          weatherGeometry(new THREE.BoxGeometry(0.11, 0.12, 0.09), 0.006, 110 + i),
          castleStoneMat
        );
        backMerlon.position.set(i * 0.16, gateH + 0.06, -gateDepth * 0.5 + 0.05);
        backMerlon.castShadow = true;
        backMerlon.receiveShadow = true;
        castleGroup.add(backMerlon);
      }

      // 3. Buried rocky plinth / foundation mounds around the towers (leaving the central arch passage clear)
      const leftPlinth = new THREE.Mesh(
        weatherGeometry(new THREE.CylinderGeometry(0.49, 0.56, 0.22, 18, 2), 0.02, 120),
        castleStoneMat
      );
      leftPlinth.position.set(-0.74, 0.06, -0.05);
      leftPlinth.receiveShadow = true;
      castleGroup.add(leftPlinth);

      const rightPlinth = new THREE.Mesh(
        weatherGeometry(new THREE.CylinderGeometry(0.45, 0.52, 0.22, 18, 2), 0.02, 121),
        castleStoneMat
      );
      rightPlinth.position.set(0.74, 0.06, -0.05);
      rightPlinth.receiveShadow = true;
      castleGroup.add(rightPlinth);

      // Flagstone threshold steps inside & in front of the archway
      for (let s = -1; s <= 1; s++) {
        const stepStone = new THREE.Mesh(
          weatherGeometry(new THREE.BoxGeometry(0.44, 0.05, 0.24), 0.006, 130 + s),
          castleStoneMat
        );
        stepStone.position.set(0, 0.015, s * 0.23);
        stepStone.receiveShadow = true;
        castleGroup.add(stepStone);
      }

      // Register accurate collision volumes for the solid towers and walls (leaving the central doorway open at ground level)
      castleCollisionVolumes.push(
        // Left tower + left gate pier
        { x: CASTLE_POS.x - 0.72, yMin: 0, yMax: baseY + 1.98, z: CASTLE_POS.z - 0.05, radius: 0.52 },
        // Right tower + right gate pier
        { x: CASTLE_POS.x + 0.72, yMin: 0, yMax: baseY + 1.62, z: CASTLE_POS.z - 0.05, radius: 0.48 },
        // Rear turret
        { x: CASTLE_POS.x - 0.32, yMin: 0, yMax: baseY + 2.35, z: CASTLE_POS.z - 0.44, radius: 0.42 },
        // Upper lintel above the archway (blocks fish above Y = baseY + 0.65 while leaving lower arch open)
        { x: CASTLE_POS.x, yMin: baseY + 0.58, yMax: baseY + 1.45, z: CASTLE_POS.z + 0.02, radius: 0.52 }
      );

      scene.add(castleGroup);
      return castleGroup;
    }

    const castleOrnament = createCastleOrnament();

    // =========================================================================
    // STAGE 6 — DEVELOP FOUR DIFFERENT AQUATIC PLANTS SEPARATELY
    // =========================================================================
    const plantBaseObstacles = [
      { x: -3.05, z: -1.25, radius: 0.42 }, // Vallisneria
      { x: -2.18, z: 0.52,  radius: 0.42 }, // Anubias
      { x: 0.92,  z: -1.18, radius: 0.40 }, // Java Fern
      { x: 2.32,  z: -0.35, radius: 0.44 }  // Cabomba
    ];

    const plantUpdateCallbacks = [];

    // -------------------------------------------------------------------------
    // Plant 1: Vallisneria (Rear-left clump of 11 long ribbon leaves)
    // -------------------------------------------------------------------------
    function createVallisneriaPlant() {
      const valGroup = new THREE.Group();
      valGroup.name = 'Plant1_Vallisneria';

      const rootX = -3.05;
      const rootZ = -1.25;
      const rootY = getSubstrateHeight(rootX, rootZ) - 0.03;
      valGroup.position.set(rootX, rootY, rootZ);

      const leafCount = 11;
      const rng = createSeededRandom(601);
      const leaves = [];

      const valMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.46,
          metalness: 0.02,
          side: THREE.DoubleSide
        }),
        0.32
      );

      // Small basal root crown in the gravel
      const crownMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11, 0.16, 0.09, 14),
        new THREE.MeshStandardMaterial({ color: 0x3b4d28, roughness: 0.85 })
      );
      crownMesh.position.y = 0.02;
      valGroup.add(crownMesh);

      for (let i = 0; i < leafCount; i++) {
        const height = 2.65 + rng() * 1.18; // Reaches up toward surface without piercing it
        const width = 0.11 + rng() * 0.035;
        const segX = 4;
        const segY = 28;

        const geo = new THREE.PlaneGeometry(width, height, segX, segY);
        geo.translate(0, height * 0.5, 0);

        const pos = geo.attributes.position;
        const basePos = new Float32Array(pos.array.length);
        const colors = new Float32Array(pos.count * 3);

        const spreadAngle = (i / leafCount) * Math.PI * 2 + (rng() - 0.5) * 0.35;
        const baseRadius = 0.03 + rng() * 0.08;
        const ox = Math.cos(spreadAngle) * baseRadius;
        const oz = Math.sin(spreadAngle) * baseRadius;
        const archDirX = Math.cos(spreadAngle) * (0.28 + rng() * 0.25) + 0.24; // Slight drift toward center
        const archDirZ = Math.sin(spreadAngle) * (0.24 + rng() * 0.22) + 0.12;
        const totalTwist = (rng() - 0.45) * 1.85;
        const hueShift = (rng() - 0.5) * 0.03;

        for (let v = 0; v < pos.count; v++) {
          const lx = pos.getX(v);
          const ly = pos.getY(v);
          const vNorm = THREE.MathUtils.clamp(ly / height, 0, 1);
          const uNorm = lx / (width * 0.5); // -1 to 1 across ribbon width

          // Taper near root and softly taper to a rounded ribbon tip
          const widthProfile = Math.sin(Math.pow(vNorm, 0.65) * Math.PI * 0.92) * (1.0 - 0.55 * Math.pow(vNorm, 4.0)) + 0.22 * (1.0 - vNorm);
          const shapedX = lx * widthProfile;

          // Visible central V-crease along ribbon
          const creaseZ = -Math.abs(uNorm) * 0.014;

          // Gentle ribbon twist along height
          const twistAngle = vNorm * totalTwist;
          const cosT = Math.cos(twistAngle);
          const sinT = Math.sin(twistAngle);
          const rx = shapedX * cosT - creaseZ * sinT;
          const rz = shapedX * sinT + creaseZ * cosT;

          // Upward curve that bends softly near the tip
          const bend = Math.pow(vNorm, 1.85);
          const fx = ox + rx + archDirX * bend;
          const fy = ly * (1.0 - bend * 0.08);
          const fz = oz + rz + archDirZ * bend;

          pos.setXYZ(v, fx, fy, fz);
          basePos[v * 3] = fx;
          basePos[v * 3 + 1] = fy;
          basePos[v * 3 + 2] = fz;

          // Bright-to-deep green variation with lighter central midrib and longitudinal striation
          const col = new THREE.Color();
          const lightness = 0.22 + vNorm * 0.18 - Math.abs(uNorm) * 0.04 + (Math.abs(uNorm) < 0.22 ? 0.035 : 0);
          col.setHSL(0.29 + hueShift - vNorm * 0.02, 0.68, lightness);
          colors[v * 3] = col.r;
          colors[v * 3 + 1] = col.g;
          colors[v * 3 + 2] = col.b;
        }

        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();

        const mesh = new THREE.Mesh(geo, valMat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        valGroup.add(mesh);

        leaves.push({
          geo,
          basePos,
          height,
          phase: rng() * Math.PI * 2,
          freq: 0.85 + rng() * 0.35
        });
      }

      const currentVec = new THREE.Vector3();
      plantUpdateCallbacks.push((time) => {
        sampleWaterCurrent(rootX, rootY + 2.0, rootZ, time, currentVec);
        for (let i = 0; i < leaves.length; i++) {
          const lf = leaves[i];
          const pos = lf.geo.attributes.position;
          const base = lf.basePos;
          for (let v = 0; v < pos.count; v++) {
            const bx = base[v * 3];
            const by = base[v * 3 + 1];
            const bz = base[v * 3 + 2];
            const vNorm = THREE.MathUtils.clamp(by / lf.height, 0, 1);
            // Rooted base stays strictly fixed; broad slow motion increases toward tip
            const flex = vNorm * vNorm * (1.15 - 0.15 * vNorm);
            const wave1 = Math.sin(time * lf.freq - vNorm * 2.2 + lf.phase) * 0.16;
            const wave2 = Math.cos(time * (lf.freq * 0.72) - vNorm * 1.6 + lf.phase * 1.3) * 0.09;

            const nx = bx + (wave1 + currentVec.x * 0.45) * flex;
            const nz = bz + (wave2 + currentVec.z * 0.45) * flex;
            const ny = Math.min(TANK.waterLevel - rootY - 0.08, by - Math.abs(wave1) * 0.04 * flex);
            pos.setXYZ(v, nx, ny, nz);
          }
          pos.needsUpdate = true;
        }
      });

      scene.add(valGroup);
      return valGroup;
    }

    // -------------------------------------------------------------------------
    // Plant 2: Anubias (Foreground/midground left-center with rhizome, petioles & 7 thick oval leaves)
    // -------------------------------------------------------------------------
    function createAnubiasPlant() {
      const anubGroup = new THREE.Group();
      anubGroup.name = 'Plant2_Anubias';

      const rootX = -2.18;
      const rootZ = 0.52;
      const rootY = getSubstrateHeight(rootX, rootZ);
      anubGroup.position.set(rootX, rootY, rootZ);
      anubGroup.scale.setScalar(1.32);

      const rhizomeMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0x2a4d24,
          roughness: 0.68,
          metalness: 0.03
        }),
        0.30
      );

      // Visible horizontal creeping rhizome resting just above the gravel
      const rhizomeCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.22, 0.045, -0.06),
        new THREE.Vector3(-0.07, 0.065, 0.02),
        new THREE.Vector3(0.09, 0.060, -0.01),
        new THREE.Vector3(0.24, 0.050, 0.05)
      ]);
      const rhizomeGeo = new THREE.TubeGeometry(rhizomeCurve, 24, 0.036, 12, false);
      const rhizomeMesh = new THREE.Mesh(rhizomeGeo, rhizomeMat);
      rhizomeMesh.castShadow = true;
      rhizomeMesh.receiveShadow = true;
      anubGroup.add(rhizomeMesh);

      // Fine anchor rootlets gripping down into the pebbles
      const rootletMat = new THREE.MeshStandardMaterial({ color: 0x3f4a2c, roughness: 0.88 });
      for (let r = 0; r < 9; r++) {
        const u = (r + 0.5) / 9;
        const pt = rhizomeCurve.getPoint(u);
        const side = (r % 2 === 0 ? 1 : -1) * 0.05;
        const rCurve = new THREE.CatmullRomCurve3([
          pt.clone(),
          new THREE.Vector3(pt.x + side * 0.5, pt.y * 0.5, pt.z + side),
          new THREE.Vector3(pt.x + side * 0.9, -0.03, pt.z + side * 1.4)
        ]);
        const rMesh = new THREE.Mesh(new THREE.TubeGeometry(rCurve, 8, 0.010, 6, false), rootletMat);
        anubGroup.add(rMesh);
      }

      // 7 thick, glossy dark-green oval leaves with distinct petioles, central veins & curled edges
      const leafMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.26, // Glossy waxy Anubias cuticle
          metalness: 0.04,
          side: THREE.DoubleSide
        }),
        0.35
      );

      const leafSpecs = [
        { u: 0.10, angle: 2.35, tilt: 0.42, len: 0.34, wid: 0.23, stemH: 0.24 },
        { u: 0.24, angle: 1.25, tilt: 0.35, len: 0.38, wid: 0.25, stemH: 0.31 },
        { u: 0.38, angle: 3.65, tilt: 0.48, len: 0.36, wid: 0.24, stemH: 0.27 },
        { u: 0.52, angle: 0.35, tilt: 0.30, len: 0.41, wid: 0.27, stemH: 0.36 },
        { u: 0.66, angle: 2.85, tilt: 0.38, len: 0.35, wid: 0.23, stemH: 0.29 },
        { u: 0.80, angle: -0.75, tilt: 0.44, len: 0.37, wid: 0.24, stemH: 0.26 },
        { u: 0.93, angle: 5.15, tilt: 0.40, len: 0.32, wid: 0.21, stemH: 0.22 }
      ];

      const animatedUnits = [];

      leafSpecs.forEach((spec, idx) => {
        const attachPt = rhizomeCurve.getPoint(spec.u);
        const unitPivot = new THREE.Group();
        unitPivot.position.copy(attachPt);

        // Distinct petiole stem rising from rhizome to leaf base
        const petioleEnd = new THREE.Vector3(
          Math.cos(spec.angle) * 0.14,
          spec.stemH,
          Math.sin(spec.angle) * 0.14
        );
        const petioleMid = new THREE.Vector3(
          petioleEnd.x * 0.45,
          spec.stemH * 0.62,
          petioleEnd.z * 0.45
        );
        const petioleCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          petioleMid,
          petioleEnd
        ]);
        const petioleMesh = new THREE.Mesh(
          new THREE.TubeGeometry(petioleCurve, 12, 0.015, 8, false),
          rhizomeMat
        );
        petioleMesh.castShadow = true;
        unitPivot.add(petioleMesh);

        // Broad cordate-oval leaf blade geometry
        const segU = 14;
        const segV = 18;
        const bladeGeo = new THREE.PlaneGeometry(spec.wid, spec.len, segU, segV);
        bladeGeo.translate(0, spec.len * 0.5, 0);

        const pos = bladeGeo.attributes.position;
        const colors = new Float32Array(pos.count * 3);

        for (let i = 0; i < pos.count; i++) {
          const lx = pos.getX(i);
          const ly = pos.getY(i);
          const vNorm = THREE.MathUtils.clamp(ly / spec.len, 0, 1);
          const uNorm = lx / (spec.wid * 0.5); // -1..1

          // Broad oval outline with slightly cordate base and rounded-acute tip
          const profile = Math.sin(Math.pow(vNorm, 0.58) * Math.PI);
          const cordateNotch = (1.0 - vNorm) * (1.0 - Math.abs(uNorm)) * 0.025;
          const xShaped = uNorm * (spec.wid * 0.5) * profile;
          const yShaped = ly - cordateNotch;

          // Central midrib depression + lateral primary veins + slightly curled edges
          const midribGroove = -Math.exp(-uNorm * uNorm * 18.0) * 0.012;
          const lateralVeinWave = Math.sin((vNorm * 7.0 - Math.abs(uNorm) * 2.2) * Math.PI) * 0.0045 * profile;
          const edgeCurl = -Math.pow(Math.abs(uNorm), 2.6) * 0.022;
          const archDrop = -Math.pow(vNorm, 1.7) * 0.065;

          pos.setXYZ(i, xShaped, yShaped, midribGroove + lateralVeinWave + edgeCurl + archDrop);

          // Rich dark green with subtle lighter midrib and lateral vein lines
          const veinHighlight = Math.max(
            Math.exp(-uNorm * uNorm * 40.0) * 0.07,
            Math.pow(Math.max(0, Math.cos((vNorm * 6.5 - Math.abs(uNorm) * 1.9) * Math.PI * 2.0)), 6.0) * 0.04 * (1.0 - Math.abs(uNorm) * 0.5)
          );
          const col = new THREE.Color().setHSL(
            0.33,
            0.66,
            0.14 + vNorm * 0.04 + veinHighlight
          );
          colors[i * 3] = col.r;
          colors[i * 3 + 1] = col.g;
          colors[i * 3 + 2] = col.b;
        }
        bladeGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        bladeGeo.computeVertexNormals();

        const bladeGroup = new THREE.Group();
        bladeGroup.position.copy(petioleEnd);
        bladeGroup.rotation.y = -spec.angle + Math.PI * 0.5;
        bladeGroup.rotation.x = Math.PI * 0.36 + spec.tilt * 0.25;

        const bladeMesh = new THREE.Mesh(bladeGeo, leafMat);
        bladeMesh.castShadow = true;
        bladeMesh.receiveShadow = true;
        bladeGroup.add(bladeMesh);

        unitPivot.add(bladeGroup);
        anubGroup.add(unitPivot);

        animatedUnits.push({
          unitPivot,
          bladeGroup,
          baseRotX: bladeGroup.rotation.x,
          baseRotZ: bladeGroup.rotation.z,
          phase: idx * 1.15
        });
      });

      // Small, relatively stiff movements in the current (Stage 6 requirement)
      const currentVec = new THREE.Vector3();
      plantUpdateCallbacks.push((time) => {
        sampleWaterCurrent(rootX, rootY + 0.35, rootZ, time, currentVec);
        for (let i = 0; i < animatedUnits.length; i++) {
          const u = animatedUnits[i];
          const stiffOsc = Math.sin(time * 1.65 + u.phase) * 0.024;
          u.unitPivot.rotation.x = stiffOsc + currentVec.z * 0.06;
          u.unitPivot.rotation.z = Math.cos(time * 1.35 + u.phase) * 0.022 - currentVec.x * 0.06;
          u.bladeGroup.rotation.x = u.baseRotX + Math.sin(time * 2.2 + u.phase) * 0.018;
        }
      });

      scene.add(anubGroup);
      return anubGroup;
    }

    const plant1Vallisneria = createVallisneriaPlant();
    const plant2Anubias = createAnubiasPlant();

    // -------------------------------------------------------------------------
    // Plant 3: Java Fern (Medium-height plant with 9 wrinkled lance-shaped fronds)
    // -------------------------------------------------------------------------
    function createJavaFernPlant() {
      const fernGroup = new THREE.Group();
      fernGroup.name = 'Plant3_JavaFern';

      const rootX = 0.92;
      const rootZ = -1.18;
      const rootY = getSubstrateHeight(rootX, rootZ) - 0.02;
      fernGroup.position.set(rootX, rootY, rootZ);

      // Dark fibrous anchored rhizome knot at the base
      const baseKnot = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.11, 1),
        new THREE.MeshStandardMaterial({ color: 0x2d241b, roughness: 0.92 })
      );
      baseKnot.scale.set(1.35, 0.65, 1.1);
      baseKnot.position.y = 0.035;
      fernGroup.add(baseKnot);

      const fernMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.54,
          metalness: 0.02,
          side: THREE.DoubleSide
        }),
        0.34
      );

      const frondCount = 9;
      const rng = createSeededRandom(603);
      const fronds = [];

      for (let i = 0; i < frondCount; i++) {
        const height = 1.28 + rng() * 0.65;
        const maxWidth = 0.28 + rng() * 0.08;
        const segX = 10;
        const segY = 26;

        const geo = new THREE.PlaneGeometry(maxWidth, height, segX, segY);
        geo.translate(0, height * 0.5, 0);

        const pos = geo.attributes.position;
        const basePos = new Float32Array(pos.array.length);
        const colors = new Float32Array(pos.count * 3);

        const splayAngle = (i / frondCount) * Math.PI * 2 + (rng() - 0.5) * 0.28;
        const outwardLean = 0.34 + rng() * 0.36;
        const dirX = Math.cos(splayAngle);
        const dirZ = Math.sin(splayAngle);
        const perpX = -dirZ;
        const perpZ = dirX;
        const waveSeed = rng() * 10.0;

        for (let v = 0; v < pos.count; v++) {
          const lx = pos.getX(v);
          const ly = pos.getY(v);
          const vNorm = THREE.MathUtils.clamp(ly / height, 0, 1);
          const uNorm = lx / (maxWidth * 0.5); // -1..1

          // Narrow dark stipe at base (vNorm < 0.14), widening into a lance-shaped blade with uneven margin and tapered tip
          let lanceProfile;
          if (vNorm < 0.12) {
            lanceProfile = 0.08 + (vNorm / 0.12) * 0.18;
          } else {
            const bladeT = (vNorm - 0.12) / 0.88;
            lanceProfile = Math.sin(Math.pow(bladeT, 0.62) * Math.PI) * (1.0 - 0.25 * Math.pow(bladeT, 2.5));
          }

          // Uneven natural outline & wavy margin undulations
          const marginUndulation = 1.0 + Math.sin(vNorm * 19.0 + waveSeed + Math.sign(uNorm) * 1.4) * 0.15
                                       + Math.cos(vNorm * 31.0 - waveSeed) * 0.07;
          const localW = lx * lanceProfile * marginUndulation;

          // Slight surface wrinkles & prominent raised central rachis/midrib
          const edgeRuffle = Math.sin(vNorm * 22.0 + waveSeed * 1.7) * Math.pow(Math.abs(uNorm), 1.6) * 0.032 * lanceProfile;
          const midribRidge = Math.exp(-uNorm * uNorm * 28.0) * 0.015;
          const localZ = edgeRuffle + midribRidge;

          // Varied outward arch curvature from single anchored base
          const arch = Math.pow(vNorm, 1.55) * outwardLean;
          const wx = dirX * (0.03 + arch + localZ) + (-dirZ) * localW;
          const wy = ly * (1.0 - 0.14 * Math.pow(vNorm, 2.0));
          const wz = dirZ * (0.03 + arch + localZ) + dirX * localW;

          pos.setXYZ(v, wx, wy, wz);
          basePos[v * 3] = wx;
          basePos[v * 3 + 1] = wy;
          basePos[v * 3 + 2] = wz;

          // Deep olive and emerald tones with dark brownish-green central rachis and subtle spore/vein mottling
          const isMidrib = Math.exp(-uNorm * uNorm * 38.0);
          const mottle = Math.sin(vNorm * 28.0 + Math.abs(uNorm) * 9.0 + waveSeed) * 0.025;
          const col = new THREE.Color();
          const hue = THREE.MathUtils.lerp(0.24, 0.32, vNorm * 0.65) - isMidrib * 0.07;
          const sat = 0.68 - isMidrib * 0.22;
          const light = 0.14 + vNorm * 0.11 + mottle - isMidrib * 0.06;
          col.setHSL(hue, sat, light);

          colors[v * 3] = col.r;
          colors[v * 3 + 1] = col.g;
          colors[v * 3 + 2] = col.b;
        }

        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();

        const mesh = new THREE.Mesh(geo, fernMat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        fernGroup.add(mesh);

        fronds.push({
          geo,
          basePos,
          height,
          dirX,
          dirZ,
          phase: rng() * Math.PI * 2,
          speed: 1.15 + rng() * 0.35
        });
      }

      // Animate delayed bending wave traveling along each frond, strongest toward the tips
      const currentVec = new THREE.Vector3();
      plantUpdateCallbacks.push((time) => {
        sampleWaterCurrent(rootX, rootY + 1.1, rootZ, time, currentVec);
        for (let i = 0; i < fronds.length; i++) {
          const fr = fronds[i];
          const pos = fr.geo.attributes.position;
          const base = fr.basePos;
          for (let v = 0; v < pos.count; v++) {
            const bx = base[v * 3];
            const by = base[v * 3 + 1];
            const bz = base[v * 3 + 2];
            const vNorm = THREE.MathUtils.clamp(by / fr.height, 0, 1);

            // Delayed phase along the frond length
            const bendAmp = Math.pow(vNorm, 1.9);
            const travelingWave = Math.sin(time * fr.speed - vNorm * 3.1 + fr.phase) * 0.095;
            const crossWave = Math.cos(time * (fr.speed * 0.8) - vNorm * 2.4 + fr.phase) * 0.055;

            const nx = bx + (fr.dirX * travelingWave - fr.dirZ * crossWave + currentVec.x * 0.28) * bendAmp;
            const nz = bz + (fr.dirZ * travelingWave + fr.dirX * crossWave + currentVec.z * 0.28) * bendAmp;
            const ny = by - travelingWave * 0.035 * bendAmp;
            pos.setXYZ(v, nx, ny, nz);
          }
          pos.needsUpdate = true;
        }
      });

      scene.add(fernGroup);
      return fernGroup;
    }

    // -------------------------------------------------------------------------
    // Plant 4: Cabomba (Bushy rooted cluster of fine branched stems & feathery fan-like leaf whorls)
    // -------------------------------------------------------------------------
    function createCabombaFineFanTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, size, size);

      const cx = size * 0.5;
      const cy = size * 0.92;

      // Draw dichotomously branching feathery fan needles (characteristic Cabomba whorl segment)
      function drawBranch(x1, y1, len, angle, depth, width) {
        const x2 = x1 + Math.sin(angle) * len;
        const y2 = y1 - Math.cos(angle) * len;

        const grad = ctx.createLinearGradient(x1, y1, x2, y2);
        if (depth === 3) {
          grad.addColorStop(0, '#2e6e24');
          grad.addColorStop(1, '#4ca338');
        } else {
          grad.addColorStop(0, '#58b842');
          grad.addColorStop(1, '#9bf06e');
        }

        ctx.strokeStyle = grad;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        if (depth > 0) {
          const spread = 0.23 + depth * 0.045;
          drawBranch(x2, y2, len * 0.78, angle - spread, depth - 1, width * 0.72);
          drawBranch(x2, y2, len * 0.78, angle + spread, depth - 1, width * 0.72);
          if (depth === 2) {
            drawBranch(x2, y2, len * 0.82, angle, depth - 1, width * 0.68);
          }
        }
      }

      // Main fan petiole splitting into 5 primary divisions for a full, feathery fan whorl segment
      drawBranch(cx, cy, 52, -0.68, 3, 6.8);
      drawBranch(cx, cy, 56, -0.34, 3, 7.2);
      drawBranch(cx, cy, 58, 0.0,   3, 7.5);
      drawBranch(cx, cy, 56, 0.34,  3, 7.2);
      drawBranch(cx, cy, 52, 0.68,  3, 6.8);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createCabombaPlant() {
      const cabGroup = new THREE.Group();
      cabGroup.name = 'Plant4_Cabomba';

      const rootX = 2.32;
      const rootZ = -0.35;
      const rootY = getSubstrateHeight(rootX, rootZ) - 0.02;
      cabGroup.position.set(rootX, rootY, rootZ);

      const stemMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0x265820,
          roughness: 0.55,
          metalness: 0.02
        }),
        0.30
      );

      const fanTex = createCabombaFineFanTexture();
      const fanMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          map: fanTex,
          alphaTest: 0.14,
          transparent: true,
          color: 0xb8ff8e,
          roughness: 0.42,
          metalness: 0.0,
          side: THREE.DoubleSide
        }),
        0.38
      );

      // Build one reusable curved fan leaflet mesh
      const fanGeo = new THREE.PlaneGeometry(0.36, 0.30, 5, 5);
      fanGeo.translate(0, 0.15, 0);
      const fPos = fanGeo.attributes.position;
      for (let i = 0; i < fPos.count; i++) {
        const fx = fPos.getX(i);
        const fy = fPos.getY(i);
        const cup = -(fx * fx) * 1.15 - Math.pow(Math.max(0, fy / 0.30), 1.8) * 0.055;
        fPos.setZ(i, cup);
      }
      fanGeo.computeVertexNormals();

      // 6 fine stems (with secondary side-branches) and tiered whorls of feathery fan leaves
      const stemSpecs = [
        { ox: 0.00, oz: 0.00, height: 2.15, leanX: -0.06, leanZ: 0.04, whorls: 11 },
        { ox: -0.14, oz: 0.08, height: 1.88, leanX: -0.20, leanZ: 0.14, whorls: 10 },
        { ox: 0.15, oz: 0.07, height: 1.72, leanX: 0.18, leanZ: 0.12, whorls: 9 },
        { ox: -0.11, oz: -0.12, height: 1.98, leanX: -0.16, leanZ: -0.15, whorls: 10 },
        { ox: 0.13, oz: -0.11, height: 1.80, leanX: 0.17, leanZ: -0.13, whorls: 9 },
        { ox: 0.03, oz: 0.15, height: 1.52, leanX: 0.05, leanZ: 0.22, whorls: 8 }
      ];

      const animatedStems = [];

      stemSpecs.forEach((spec, sIdx) => {
        const stemRoot = new THREE.Group();
        stemRoot.position.set(spec.ox, 0, spec.oz);

        // Articulated 3-segment stem chain so the fine foliage sways smoothly with phase delay along the stem
        const segCount = 3;
        const segHeight = spec.height / segCount;
        const segGroups = [];
        let parentNode = stemRoot;

        for (let s = 0; s < segCount; s++) {
          const segPivot = new THREE.Group();
          segPivot.position.y = (s === 0) ? 0 : segHeight;

          const rBottom = THREE.MathUtils.lerp(0.019, 0.010, s / segCount);
          const rTop = THREE.MathUtils.lerp(0.019, 0.010, (s + 1) / segCount);
          const cyl = new THREE.Mesh(
            new THREE.CylinderGeometry(rTop, rBottom, segHeight + 0.01, 8),
            stemMat
          );
          cyl.position.y = segHeight * 0.5;
          cyl.castShadow = true;
          segPivot.add(cyl);

          // Add whorls of 4-5 feathery fan leaves at nodes along this segment
          const whorlsInSeg = Math.max(2, Math.round(spec.whorls / segCount));
          for (let w = 0; w < whorlsInSeg; w++) {
            const localT = (w + 0.45) / whorlsInSeg;
            const overallT = (s + localT) / segCount;
            const nodeY = localT * segHeight;
            const whorlGroup = new THREE.Group();
            whorlGroup.position.y = nodeY;

            const fansPerWhorl = (overallT > 0.82) ? 5 : 4;
            const scale = (1.08 - overallT * 0.38) * 0.95;

            for (let f = 0; f < fansPerWhorl; f++) {
              const angle = (f / fansPerWhorl) * Math.PI * 2 + (w + s * 3) * 0.55;
              const fanHolder = new THREE.Group();
              fanHolder.rotation.y = angle;
              fanHolder.rotation.x = Math.PI * 0.34 - overallT * 0.14;
              fanHolder.scale.setScalar(scale);

              const fanMesh = new THREE.Mesh(fanGeo, fanMat);
              fanMesh.castShadow = true;
              fanMesh.receiveShadow = true;
              fanHolder.add(fanMesh);
              whorlGroup.add(fanHolder);
            }
            segPivot.add(whorlGroup);
          }

          // Add a delicate side-branch shoot on the middle segment for extra bushy branching silhouette
          if (s === 1 && sIdx < 4) {
            const sideBranch = new THREE.Group();
            sideBranch.position.y = segHeight * 0.35;
            sideBranch.rotation.z = (sIdx % 2 === 0 ? 1 : -1) * 0.42;
            sideBranch.rotation.x = 0.22;

            const sbLen = segHeight * 0.85;
            const sbCyl = new THREE.Mesh(
              new THREE.CylinderGeometry(0.008, 0.013, sbLen, 6),
              stemMat
            );
            sbCyl.position.y = sbLen * 0.5;
            sideBranch.add(sbCyl);

            for (let bw = 0; bw < 2; bw++) {
              const bWhorl = new THREE.Group();
              bWhorl.position.y = (bw + 0.5) * (sbLen * 0.5);
              for (let bf = 0; bf < 4; bf++) {
                const fh = new THREE.Group();
                fh.rotation.y = (bf / 4) * Math.PI * 2 + bw * 0.7;
                fh.rotation.x = Math.PI * 0.32;
                fh.scale.setScalar(0.68);
                fh.add(new THREE.Mesh(fanGeo, fanMat));
                bWhorl.add(fh);
              }
              sideBranch.add(bWhorl);
            }
            segPivot.add(sideBranch);
          }

          parentNode.add(segPivot);
          parentNode = segPivot;
          segGroups.push(segPivot);
        }

        cabGroup.add(stemRoot);
        animatedStems.push({
          segGroups,
          leanX: spec.leanX,
          leanZ: spec.leanZ,
          phase: sIdx * 1.25
        });
      });

      // Cabomba responds more readily to the current (closer to right-side filter circulation) with varied phases along stems
      const currentVec = new THREE.Vector3();
      plantUpdateCallbacks.push((time) => {
        sampleWaterCurrent(rootX, rootY + 1.2, rootZ, time, currentVec);
        for (let i = 0; i < animatedStems.length; i++) {
          const st = animatedStems[i];
          for (let s = 0; s < st.segGroups.length; s++) {
            const sg = st.segGroups[s];
            const segWeight = (s + 1) / st.segGroups.length;
            const phaseDelay = st.phase - s * 0.65;
            const swayX = Math.sin(time * 2.15 + phaseDelay) * 0.055 * segWeight + currentVec.z * 0.14 * segWeight;
            const swayZ = Math.cos(time * 1.85 + phaseDelay * 1.1) * 0.055 * segWeight - currentVec.x * 0.16 * segWeight;
            sg.rotation.x = st.leanZ * 0.35 + swayX;
            sg.rotation.z = -st.leanX * 0.35 + swayZ;
          }
        }
      });

      scene.add(cabGroup);
      return cabGroup;
    }

    const plant3JavaFern = createJavaFernPlant();
    const plant4Cabomba = createCabombaPlant();

    // =========================================================================
    // SHARED FISH PROCEDURAL GEOMETRY & ANATOMY UTILITIES
    // =========================================================================
    // Builds a smoothly contoured 3D fish body along Z (u = 0 at snout +Z, u = 1 at tail peduncle -Z)
    function createProfiledFishBodyGeometry(length, segU, segTheta, profileFn) {
      const geo = new THREE.SphereGeometry(0.5, segTheta, segU);
      const pos = geo.attributes.position;
      const uvs = geo.attributes.uv;

      for (let i = 0; i < pos.count; i++) {
        // SphereGeometry has Y from +0.5 (north pole) to -0.5 (south pole)
        const rawY = pos.getY(i);
        const u = THREE.MathUtils.clamp(0.5 - rawY, 0.0, 1.0); // 0 = snout, 1 = tail base
        const vx = pos.getX(i);
        const vz = pos.getZ(i);
        const rPlanar = Math.hypot(vx, vz);

        let nx = 0;
        let ny = 0;
        if (rPlanar > 1e-5) {
          nx = vx / rPlanar; // lateral (-1 left, +1 right)
          ny = vz / rPlanar; // vertical (-1 belly, +1 dorsal)
        }

        const prof = profileFn(u, nx, ny);
        const zCoord = (0.5 - u) * length;
        const yCenter = (prof.yOffset || 0) + (ny >= 0 ? ny * prof.topH : ny * prof.botH);
        const xCoord = nx * prof.halfW * Math.sqrt(Math.max(0.0, 1.0 - ny * ny * 0.12));

        // Subtle operculum (gill cover) relief crease around u ~ 0.24
        const gillDist = Math.abs(u - (prof.gillU || 0.24)) - Math.max(0, -ny * 0.03);
        const gillGroove = (Math.abs(nx) > 0.35 && Math.abs(ny) < 0.72)
          ? -Math.exp(- (gillDist * gillDist) / 0.00045) * 0.0085
          : 0.0;

        // Subtle mouth indentation at tip (u < 0.035)
        const mouthNotch = (u < 0.035 && Math.abs(ny - (prof.mouthY || -0.05)) < 0.22)
          ? -Math.exp(-u * 90.0) * 0.012
          : 0.0;

        pos.setXYZ(i, xCoord + Math.sign(nx) * gillGroove, yCenter, zCoord + mouthNotch);
        uvs.setXY(i, u, ny * 0.5 + 0.5);
      }

      // Swapping the sphere's Y/Z axes mirrors the mesh, which flips triangle winding inward:
      // front faces got culled and only the far inner wall was visible (fish looked hollow/see-through).
      const index = geo.index;
      for (let i = 0; i < index.count; i += 3) {
        const a = index.getX(i);
        index.setX(i, index.getX(i + 2));
        index.setX(i + 2, a);
      }

      geo.computeVertexNormals();
      return geo;
    }

    // Adds glossy two-layer eyes (dark iris + corneal dome) and subtle lip rim
    // Outermost |x| of the body surface around (y, z), so eyes sit on the skin instead of inside the body
    function getBodySurfaceHalfWidth(bodyGeo, y, z, band) {
      const pos = bodyGeo.attributes.position;
      let maxX = 0;
      for (let i = 0; i < pos.count; i++) {
        if (Math.abs(pos.getZ(i) - z) < band && Math.abs(pos.getY(i) - y) < band) {
          maxX = Math.max(maxX, Math.abs(pos.getX(i)));
        }
      }
      return maxX;
    }

    function addFishEyesAndMouth(parentGroup, eyeX, eyeY, eyeZ, eyeRadius, mouthY, mouthZ, mouthWidth, lipColor = 0x554842, bodyGeo = null) {
      if (bodyGeo) {
        // Let roughly half of the flattened eyeball bulge out of the body surface
        const skinX = getBodySurfaceHalfWidth(bodyGeo, eyeY, eyeZ, eyeRadius * 1.2);
        eyeX = Math.max(eyeX, skinX + eyeRadius * 0.08);
      }
      const scleraMat = new THREE.MeshStandardMaterial({
        color: 0xd8e0e5,
        roughness: 0.25,
        metalness: 0.15
      });
      const pupilMat = new THREE.MeshPhysicalMaterial({
        color: 0x07090c,
        roughness: 0.04,
        metalness: 0.05,
        clearcoat: 1.0,
        clearcoatRoughness: 0.04
      });

      const leftEye = new THREE.Group();
      leftEye.position.set(eyeX, eyeY, eyeZ);
      const rightEye = new THREE.Group();
      rightEye.position.set(-eyeX, eyeY, eyeZ);

      [leftEye, rightEye].forEach((eg, idx) => {
        const sign = idx === 0 ? 1 : -1;
        const iris = new THREE.Mesh(new THREE.SphereGeometry(eyeRadius, 14, 12), scleraMat);
        iris.scale.set(0.58, 1.0, 1.0);
        eg.add(iris);

        const pupil = new THREE.Mesh(new THREE.SphereGeometry(eyeRadius * 0.72, 12, 10), pupilMat);
        pupil.position.set(sign * eyeRadius * 0.26, 0, eyeRadius * 0.10);
        pupil.scale.set(0.62, 1.0, 1.0);
        eg.add(pupil);

        parentGroup.add(eg);
      });

      // Small sculpted lip rim at snout (subtle anatomical jaw contour)
      const lipMat = new THREE.MeshStandardMaterial({ color: lipColor, roughness: 0.45 });
      const lipMesh = new THREE.Mesh(
        new THREE.SphereGeometry(mouthWidth * 0.72, 10, 8),
        lipMat
      );
      lipMesh.scale.set(1.15, 0.55, 0.75);
      lipMesh.position.set(0, mouthY, mouthZ - mouthWidth * 0.25);
      parentGroup.add(lipMesh);
    }

    // =========================================================================
    // STAGE 7 — DEVELOP FISH 1: FANCY GUPPY
    // =========================================================================
    function createGuppyTailTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Warm orange-red delta fan gradient with translucent outer edge
      const grad = ctx.createLinearGradient(0, 128, 256, 128);
      grad.addColorStop(0.0, 'rgba(255, 195, 55, 0.98)');
      grad.addColorStop(0.32, 'rgba(255, 108, 24, 0.96)');
      grad.addColorStop(0.74, 'rgba(235, 38, 22, 0.92)');
      grad.addColorStop(0.92, 'rgba(255, 95, 50, 0.55)');
      grad.addColorStop(1.0, 'rgba(255, 140, 80, 0.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      // Subtle radiating fin rays
      ctx.strokeStyle = 'rgba(255, 225, 150, 0.26)';
      ctx.lineWidth = 1.4;
      for (let r = -14; r <= 14; r++) {
        ctx.beginPath();
        ctx.moveTo(0, 128 + r * 1.5);
        ctx.lineTo(250, 128 + r * 8.6);
        ctx.stroke();
      }

      // Characteristic dark leopard/mosaic speckles across the fan tail
      const rng = createSeededRandom(701);
      ctx.fillStyle = 'rgba(22, 16, 26, 0.82)';
      for (let s = 0; s < 38; s++) {
        const u = 0.14 + rng() * 0.68;
        const spread = (rng() - 0.5) * (0.35 + u * 0.55);
        const sx = u * 256;
        const sy = 128 + spread * 230;
        const rx = 3.2 + rng() * 5.0;
        const ry = 2.4 + rng() * 3.8;
        ctx.beginPath();
        ctx.ellipse(sx, sy, rx, ry, (rng() - 0.5) * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createFancyGuppy() {
      const guppyGroup = new THREE.Group();
      guppyGroup.name = 'Fish1_FancyGuppy';

      // Total length ~ 0.84 units (body 0.48 + broad delta fan tail 0.36)
      const bodyLen = 0.48;
      const bodyGeo = createProfiledFishBodyGeometry(bodyLen, 36, 24, (u) => {
        // Slender, tapered guppy body with smooth narrow caudal peduncle going into the fan tail
        const topH = Math.sin(Math.pow(u, 0.62) * Math.PI) * 0.072 * (1.0 - 0.32 * u) + 0.018 * Math.pow(u, 2.0);
        const botH = Math.sin(Math.pow(u, 0.52) * Math.PI) * (u < 0.55 ? 0.092 : 0.068) * (1.0 - 0.35 * u) + 0.018 * Math.pow(u, 2.0);
        const halfW = Math.sin(Math.pow(u, 0.55) * Math.PI) * 0.056 * (1.0 - 0.38 * u) + 0.011;
        const yOffset = Math.sin(u * Math.PI) * -0.008;
        return { topH, botH, halfW, yOffset, gillU: 0.24 };
      });

      // Silver-blue base with turquoise and emerald iridescent patches transitioning to warm gold-orange at tail base
      const bPos = bodyGeo.attributes.position;
      const bUv = bodyGeo.attributes.uv;
      const bColors = new Float32Array(bPos.count * 3);
      for (let i = 0; i < bPos.count; i++) {
        const u = bUv.getX(i);
        const v = bUv.getY(i); // 0 belly, 1 dorsal
        const col = new THREE.Color(0x9bc2d9); // Silver-blue base
        // Pearlescent belly
        if (v < 0.42) {
          col.lerp(new THREE.Color(0xe6f4fa), (0.42 - v) * 1.6);
        }
        // Olive-silver dorsal ridge
        if (v > 0.72) {
          col.lerp(new THREE.Color(0x4a7b8c), (v - 0.72) * 2.1);
        }
        // Iridescent turquoise/emerald flank patches
        const patch1 = Math.exp(-Math.pow((u - 0.42) * 6.5, 2.0) - Math.pow((v - 0.52) * 4.5, 2.0));
        const patch2 = Math.exp(-Math.pow((u - 0.64) * 7.2, 2.0) - Math.pow((v - 0.48) * 4.8, 2.0));
        col.lerp(new THREE.Color(0x14d8b4), patch1 * 0.78);
        col.lerp(new THREE.Color(0x18a8e8), patch2 * 0.72);
        // Smooth transition into warm orange-red tail base
        if (u > 0.72) {
          const tBlend = THREE.MathUtils.smoothstep(u, 0.72, 1.0);
          col.lerp(new THREE.Color(0xff6b24), tBlend * 0.88);
        }
        // Subtle gill blush
        const gill = Math.exp(-Math.pow((u - 0.23) * 18.0, 2.0)) * (v > 0.25 && v < 0.68 ? 1.0 : 0.0);
        col.lerp(new THREE.Color(0xd46a72), gill * 0.28);

        bColors[i * 3] = col.r;
        bColors[i * 3 + 1] = col.g;
        bColors[i * 3 + 2] = col.b;
      }
      bodyGeo.setAttribute('color', new THREE.BufferAttribute(bColors, 3));
      const baseBodyVerts = new Float32Array(bPos.array);

      const bodyMat = applyUnderwaterCaustics(
        new THREE.MeshPhysicalMaterial({
          vertexColors: true,
          roughness: 0.22,
          metalness: 0.25,
          iridescence: 0.65,
          iridescenceIOR: 1.38,
          clearcoat: 0.6,
          clearcoatRoughness: 0.18
        }),
        0.34
      );
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;
      guppyGroup.add(bodyMesh);

      // Large triangular delta fan tail (0.37 units long, expanding from narrow tail base to broad ruffled fan)
      const tailLen = 0.37;
      const tailSpan = 0.36;
      const tailGeo = new THREE.PlaneGeometry(tailLen, tailSpan, 20, 18);
      tailGeo.translate(tailLen * 0.5, 0, 0); // X from 0 (root) to tailLen (trailing edge)
      tailGeo.rotateY(Math.PI * 0.5);        // Z from 0 to -tailLen

      const tPos = tailGeo.attributes.position;
      const tUv = tailGeo.attributes.uv;
      for (let i = 0; i < tPos.count; i++) {
        const z = tPos.getZ(i); // 0 to -tailLen
        const y = tPos.getY(i);
        const u = THREE.MathUtils.clamp(-z / tailLen, 0, 1); // 0 at peduncle, 1 at trailing edge
        const v = y / (tailSpan * 0.5); // -1 to 1

        // Delta fan expansion from narrow peduncle (0.022) to wide fan (tailSpan * 0.5)
        const fanHalfH = THREE.MathUtils.lerp(0.022, tailSpan * 0.5, Math.pow(u, 0.82));
        const shapedY = v * fanHalfH;
        // Rounded outer fan arc
        const arcZ = z - (1.0 - v * v) * u * 0.048;
        // Subtle fin-ray pleat ripples
        const rayPleat = Math.sin(v * 22.0) * 0.006 * u;

        tPos.setXYZ(i, rayPleat, shapedY, arcZ);
        tUv.setXY(i, u, v * 0.5 + 0.5);
      }
      tailGeo.computeVertexNormals();
      const baseTailVerts = new Float32Array(tPos.array);

      const tailTex = createGuppyTailTexture();
      const tailMat = new THREE.MeshStandardMaterial({
        map: tailTex,
        transparent: true,
        alphaTest: 0.04,
        roughness: 0.35,
        metalness: 0.05,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const tailMesh = new THREE.Mesh(tailGeo, tailMat);
      tailMesh.position.set(0, 0, -bodyLen * 0.48);
      tailMesh.castShadow = true;
      guppyGroup.add(tailMesh);

      // Distinct patterned dorsal fin
      const dorsalGeo = new THREE.PlaneGeometry(0.18, 0.14, 10, 8);
      const dPos = dorsalGeo.attributes.position;
      for (let i = 0; i < dPos.count; i++) {
        const dx = dPos.getX(i); // -0.09..0.09
        const dy = dPos.getY(i) + 0.07; // 0..0.14
        const vH = dy / 0.14;
        // Sweep backward toward tip
        const zCoord = -dx - vH * 0.09;
        const yCoord = dy * Math.sin((dx / 0.18 + 0.5) * Math.PI);
        dPos.setXYZ(i, Math.sin(vH * 5.0) * 0.004, yCoord, zCoord);
      }
      dorsalGeo.computeVertexNormals();
      const baseDorsalVerts = new Float32Array(dPos.array);
      const dorsalMesh = new THREE.Mesh(dorsalGeo, tailMat);
      dorsalMesh.position.set(0, 0.052, -0.04);
      guppyGroup.add(dorsalMesh);

      // Underside anal & pelvic fins
      const analGeo = new THREE.PlaneGeometry(0.10, 0.075, 6, 5);
      analGeo.rotateY(Math.PI * 0.5);
      const analMat = new THREE.MeshStandardMaterial({
        color: 0x7ad6e8,
        transparent: true,
        opacity: 0.62,
        roughness: 0.3,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const analMesh = new THREE.Mesh(analGeo, analMat);
      analMesh.position.set(0, -0.068, -0.08);
      analMesh.rotation.x = -0.38;
      guppyGroup.add(analMesh);

      const leftPelvic = new THREE.Mesh(new THREE.PlaneGeometry(0.065, 0.05, 4, 4), analMat);
      leftPelvic.position.set(0.018, -0.074, 0.04);
      leftPelvic.rotation.set(-0.35, 0.4, 0.25);
      const rightPelvic = leftPelvic.clone();
      rightPelvic.position.x = -0.018;
      rightPelvic.rotation.y = -0.4;
      rightPelvic.rotation.z = -0.25;
      guppyGroup.add(leftPelvic, rightPelvic);

      // Paired translucent pectoral fins (animated independently)
      const pecGeo = new THREE.PlaneGeometry(0.095, 0.058, 6, 4);
      pecGeo.translate(0.047, 0, 0);
      const pecMat = new THREE.MeshStandardMaterial({
        color: 0xc8f2ff,
        transparent: true,
        opacity: 0.52,
        roughness: 0.25,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const leftPec = new THREE.Mesh(pecGeo, pecMat);
      leftPec.position.set(0.048, -0.018, 0.11);
      const rightPec = new THREE.Mesh(pecGeo, pecMat);
      rightPec.position.set(-0.048, -0.018, 0.11);
      rightPec.scale.x = -1;
      guppyGroup.add(leftPec, rightPec);

      // Glossy eyes and mouth
      addFishEyesAndMouth(guppyGroup, 0.038, 0.014, 0.175, 0.019, -0.008, 0.232, 0.013, 0x627c8a, bodyGeo);

      function updateAnimation(time, swimEffort, turnAmount) {
        const freq = 7.5 + swimEffort * 7.0;
        const phase = time * freq;
        const bodyAmp = 0.016 + swimEffort * 0.022;

        // Spine undulation increasing toward tail while keeping head stable
        for (let i = 0; i < bPos.count; i++) {
          const bx = baseBodyVerts[i * 3];
          const by = baseBodyVerts[i * 3 + 1];
          const bz = baseBodyVerts[i * 3 + 2];
          const u = THREE.MathUtils.clamp(0.5 - bz / bodyLen, 0, 1);
          const env = Math.pow(u, 1.75);
          const sway = Math.sin(phase - u * 4.2) * bodyAmp * env + turnAmount * u * u * 0.035;
          bPos.setXYZ(i, bx + sway, by, bz);
        }
        bPos.needsUpdate = true;

        // Traveling wave along the broad fan tail from its base toward the flexible trailing edge
        const peduncleSway = Math.sin(phase - 4.2) * bodyAmp + turnAmount * 0.035;
        const peduncleAngle = Math.cos(phase - 4.2) * (0.18 + swimEffort * 0.22);
        for (let i = 0; i < tPos.count; i++) {
          const tx = baseTailVerts[i * 3];
          const ty = baseTailVerts[i * 3 + 1];
          const tz = baseTailVerts[i * 3 + 2];
          const uTail = THREE.MathUtils.clamp(-tz / tailLen, 0, 1);
          const vEdge = Math.abs(ty) / (tailSpan * 0.5);
          const wave = Math.sin(phase - 4.2 - uTail * 3.6 - vEdge * 0.65) * (0.042 + swimEffort * 0.048) * Math.pow(uTail, 1.25);
          const turnCurve = turnAmount * Math.pow(uTail, 1.5) * 0.07;
          tPos.setXYZ(
            i,
            tx + peduncleSway + Math.sin(peduncleAngle) * (-tz * 0.35) + wave + turnCurve,
            ty * (1.0 + Math.sin(time * 3.5 + uTail * 2.0) * 0.03),
            tz
          );
        }
        tPos.needsUpdate = true;

        // Dorsal fin ripple
        for (let i = 0; i < dPos.count; i++) {
          const dx = baseDorsalVerts[i * 3];
          const dy = baseDorsalVerts[i * 3 + 1];
          const dz = baseDorsalVerts[i * 3 + 2];
          const hFrac = dy / 0.14;
          dPos.setXYZ(i, dx + Math.sin(phase - 2.2 - hFrac * 2.4) * 0.018 * hFrac, dy, dz);
        }
        dPos.needsUpdate = true;

        // Independent rapid pectoral fin flutter (active even during hovering pauses)
        const pecFlutter = Math.sin(time * 22.0) * (0.34 + (1.0 - swimEffort) * 0.15);
        leftPec.rotation.y = -0.48 + pecFlutter;
        leftPec.rotation.z = -0.15 + Math.cos(time * 22.0) * 0.12;
        rightPec.rotation.y = 0.48 - pecFlutter;
        rightPec.rotation.z = 0.15 - Math.cos(time * 22.0) * 0.12;
      }

      return {
        group: guppyGroup,
        updateAnimation,
        halfLength: 0.45,
        halfHeight: 0.20,
        halfWidth: 0.12
      };
    }

    const fish1Guppy = createFancyGuppy();

    // =========================================================================
    // STAGE 8 — DEVELOP FISH 2: CLOWNFISH
    // =========================================================================
    function createClownfishBodyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Rich tangerine-orange base
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 256);
      bgGrad.addColorStop(0.0, '#d94c10'); // Slightly deeper dorsal orange
      bgGrad.addColorStop(0.45, '#ff6818'); // Vibrant mid-flank orange
      bgGrad.addColorStop(1.0, '#ff8028'); // Warm belly orange
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 256);

      // Subtle scale diamond lattice
      ctx.strokeStyle = 'rgba(130, 32, 4, 0.14)';
      ctx.lineWidth = 1.0;
      for (let x = -256; x < 512 + 256; x += 12) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 140, 256);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 140, 0);
        ctx.lineTo(x, 256);
        ctx.stroke();
      }

      // Three irregular white vertical bands with narrow black borders wrapped continuously around the body
      const img = ctx.getImageData(0, 0, 512, 256);
      const data = img.data;
      for (let py = 0; py < 256; py++) {
        const v = 1.0 - py / 255.0; // 1 dorsal, 0 belly
        for (let px = 0; px < 512; px++) {
          const u = px / 511.0; // 0 snout, 1 tail base

          // Band 1: Behind eye (head band), curving slightly forward at mid-height
          const c1 = 0.235 - Math.sin(v * Math.PI) * 0.025 + Math.cos(v * 6.0) * 0.006;
          const w1 = 0.044 + Math.sin(v * Math.PI) * 0.008;
          const d1 = Math.abs(u - c1) - w1;

          // Band 2: Mid-body band with characteristic forward-bulging saddle lobe at mid-flank
          const lobe2 = Math.exp(-Math.pow((v - 0.50) * 3.8, 2.0)) * 0.042;
          const c2 = 0.535 - lobe2 * 0.65 + Math.sin(v * 5.0) * 0.008;
          const w2 = 0.048 + lobe2 * 0.60;
          const d2 = Math.abs(u - c2) - w2;

          // Band 3: Caudal peduncle band near tail base
          const c3 = 0.845 + Math.sin(v * Math.PI) * 0.012;
          const w3 = 0.038 + Math.sin(v * Math.PI) * 0.006;
          const d3 = Math.abs(u - c3) - w3;

          const minDist = Math.min(d1, d2, d3);
          const idx = (py * 512 + px) * 4;

          if (minDist < 0.018) {
            if (minDist < -0.003) {
              // Pure pearl-white stripe interior with subtle shading
              const shade = 0.90 + 0.10 * Math.sin(v * Math.PI);
              data[idx] = Math.round(248 * shade);
              data[idx + 1] = Math.round(250 * shade);
              data[idx + 2] = Math.round(255 * shade);
            } else if (minDist < 0.011) {
              // Crisp narrow black border
              data[idx] = 18;
              data[idx + 1] = 14;
              data[idx + 2] = 16;
            } else {
              // Smooth anti-aliased transition from black border to orange body
              const t = (minDist - 0.011) / 0.007;
              data[idx] = Math.round(18 + (data[idx] - 18) * t);
              data[idx + 1] = Math.round(14 + (data[idx + 1] - 14) * t);
              data[idx + 2] = Math.round(16 + (data[idx + 2] - 16) * t);
            }
          }
        }
      }
      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createClownfishFinTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);

      // Rounded fan shape in UV space (u = 0 at root on left, u = 1 at rounded outer margin on right)
      const img = ctx.createImageData(256, 256);
      const data = img.data;
      for (let py = 0; py < 256; py++) {
        const v = (py / 255.0) * 2.0 - 1.0; // -1..1
        for (let px = 0; px < 256; px++) {
          const u = px / 255.0; // 0..1
          const maxU = Math.sqrt(Math.max(0.0, 1.0 - v * v * 0.72)) * 0.96;
          const distToEdge = maxU - u;
          const idx = (py * 256 + px) * 4;

          if (distToEdge > 0.0) {
            const ray = Math.sin(Math.atan2(v, u + 0.25) * 38.0) * 0.08;
            if (distToEdge < 0.035) {
              // Thin translucent white outer tip rim
              data[idx] = 245;
              data[idx + 1] = 248;
              data[idx + 2] = 255;
              data[idx + 3] = Math.round(THREE.MathUtils.clamp(distToEdge / 0.035, 0, 1) * 195);
            } else if (distToEdge < 0.145) {
              // Characteristic black sub-marginal band
              data[idx] = 20;
              data[idx + 1] = 16;
              data[idx + 2] = 18;
              data[idx + 3] = 242;
            } else {
              // Vibrant orange fin web with subtle rays
              data[idx] = Math.min(255, Math.round(252 + ray * 40));
              data[idx + 1] = Math.min(255, Math.round(104 + ray * 35));
              data[idx + 2] = Math.min(255, Math.round(24 + ray * 20));
              data[idx + 3] = 238;
            }
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createClownfish() {
      const clownGroup = new THREE.Group();

      const bodyLen = 0.78;

        // Fuller, stockier oval-fusiform body with rounded head and thick caudal peduncle
        const headRound = Math.pow(Math.sin(Math.pow(u, 0.54) * Math.PI), 0.82);
        const peduncle = Math.exp(-Math.pow((u - 0.90) * 5.2, 2.0)) * 0.042;
        const topH = headRound * 0.175 * (1.0 - 0.18 * u) + peduncle;
        const botH = headRound * 0.185 * (1.0 - 0.20 * u) + peduncle;
        const halfW = headRound * 0.115 * (1.0 - 0.22 * u) + peduncle * 0.55;
        return { topH, botH, halfW, yOffset: -0.006, gillU: 0.25 };
      });

      const baseBodyVerts = new Float32Array(bodyGeo.attributes.position.array);
      const bodyTex = createClownfishBodyTexture();
      const bodyMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          map: bodyTex,
          roughness: 0.34,
          metalness: 0.05
        }),
        0.36

      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;

      // Articulated gill operculum flaps for subtle breathing motion
      const gillMat = new THREE.MeshStandardMaterial({
        map: bodyTex,

      });
      const gillFlaps = [];
      [-1, 1].forEach((side) => {
        const gPivot = new THREE.Group();

        const gMesh = new THREE.Mesh(

        );

        gPivot.add(gMesh);

        gillFlaps.push({ pivot: gPivot, side });
      });

      const finTex = createClownfishFinTexture();
      const finMat = new THREE.MeshStandardMaterial({
        map: finTex,
        transparent: true,
        alphaTest: 0.06,
        roughness: 0.38,
        side: THREE.DoubleSide,
        depthWrite: false

      // Rounded paddle fan tail
      const tailLen = 0.25;
      const tailSpan = 0.28;
      const tailGeo = new THREE.PlaneGeometry(tailLen, tailSpan, 14, 14);
      tailGeo.translate(tailLen * 0.5, 0, 0);

        tPos.setXYZ(i, Math.sin(v * 14.0) * 0.004 * u, v * halfH, z);
        tUv.setXY(i, u, v * 0.5 + 0.5);

      const dorsalLen = 0.46;
      const dorsalMaxH = 0.135;
      const dorsalGeo = new THREE.PlaneGeometry(dorsalLen, dorsalMaxH, 20, 8);
      const dPos = dorsalGeo.attributes.position;
      const dUv = dorsalGeo.attributes.uv;
      for (let i = 0; i < dPos.count; i++) {

        const lobe1 = Math.sin(THREE.MathUtils.clamp(s / 0.58, 0, 1) * Math.PI);

      analMesh.rotation.y = Math.PI * 0.5;

      clownGroup.add(analMesh);

      const leftPelvic = new THREE.Mesh(new THREE.PlaneGeometry(0.11, 0.085, 5, 5), finMat);
      leftPelvic.position.set(0.028, -0.155, 0.05);
      leftPelvic.rotation.set(-0.42, 0.35, 0.28);
      const rightPelvic = leftPelvic.clone();
      rightPelvic.position.x = -0.028;

        const amp = 0.022 + swimEffort * 0.028;

        for (let i = 0; i < bPos.count; i++) {
          const bx = baseBodyVerts[i * 3];
          const by = baseBodyVerts[i * 3 + 1];
          const bz = baseBodyVerts[i * 3 + 2];
          const u = THREE.MathUtils.clamp(0.5 - bz / bodyLen, 0, 1);
          const env = 0.08 + 0.92 * Math.pow(u, 1.55);

          bPos.setXYZ(i, bx + sway, by, bz);
        }
        bPos.needsUpdate = true;

        const tailBaseSway = Math.sin(phase - 4.5) * amp + turnAmount * 0.045;
        for (let i = 0; i < tPos.count; i++) {
          const tx = baseTailVerts[i * 3];
          const ty = baseTailVerts[i * 3 + 1];
          const tz = baseTailVerts[i * 3 + 2];
          const uTail = THREE.MathUtils.clamp(-tz / tailLen, 0, 1);
          const wave = Math.sin(phase - 4.5 - uTail * 2.8) * (0.036 + swimEffort * 0.042) * Math.pow(uTail, 1.2);
          tPos.setXYZ(i, tx + tailBaseSway + wave + turnAmount * uTail * 0.055, ty, tz);
        }
        tPos.needsUpdate = true;

        for (let i = 0; i < dPos.count; i++) {
          const dx = baseDorsalVerts[i * 3];
          const dy = baseDorsalVerts[i * 3 + 1];
          const dz = baseDorsalVerts[i * 3 + 2];
          const u = THREE.MathUtils.clamp(0.5 - dz / bodyLen, 0, 1);
          const sway = Math.sin(phase - u * 4.5) * amp * Math.pow(u, 1.55);
          dPos.setXYZ(i, dx + sway + Math.sin(phase - u * 5.2) * 0.012, dy, dz);
        }
        dPos.needsUpdate = true;

        // Pectoral sculling (rowing motion)
        const scull = Math.sin(time * (11.0 + swimEffort * 5.0));
        const feather = Math.cos(time * (11.0 + swimEffort * 5.0));
        leftPec.rotation.y = -0.52 + scull * 0.38;
        leftPec.rotation.x = feather * 0.24;
        rightPec.rotation.y = 0.52 - scull * 0.38;
        rightPec.rotation.x = feather * 0.24;

        // Subtle rhythmic gill breathing
        const breath = (Math.sin(time * 4.2) * 0.5 + 0.5) * 0.12;
        gillFlaps.forEach((gf) => {
          gf.pivot.rotation.y = -gf.side * (0.04 + breath);
        });
      }

      return {
        group: clownGroup,
        updateAnimation,
        halfLength: 0.53,
        halfHeight: 0.28,
        halfWidth: 0.16
      };
    }

    function createAngelfishBodyTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Pearlescent silver-platinum base with subtle warm dorsal crown tint
      const bg = ctx.createLinearGradient(0, 0, 0, 512);
      bg.addColorStop(0.0, '#aebec8');
      bg.addColorStop(0.28, '#dce7ef');
      bg.addColorStop(0.65, '#edf4f9');
      bg.addColorStop(1.0, '#c8d6e0');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 512, 512);

      // Subtle golden-olive sheen on forehead/crown
      const crownGrad = ctx.createRadialGradient(140, 110, 10, 140, 110, 140);
      crownGrad.addColorStop(0.0, 'rgba(218, 188, 105, 0.35)');
      crownGrad.addColorStop(1.0, 'rgba(218, 188, 105, 0.0)');
      ctx.fillStyle = crownGrad;
      ctx.fillRect(0, 0, 512, 512);

      // Four characteristic dark charcoal-black vertical angelfish bars (Pterophyllum scalare)
      const bars = [
        { u: 0.21, w: 0.032, alpha: 0.78 }, // Eye band
        { u: 0.42, w: 0.038, alpha: 0.82 }, // Anterior flank band
        { u: 0.65, w: 0.048, alpha: 0.88 }, // Main tall dorsal-to-anal band
        { u: 0.87, w: 0.034, alpha: 0.76 }  // Caudal peduncle band
      ];

      const img = ctx.getImageData(0, 0, 512, 512);
      const data = img.data;
      for (let py = 0; py < 512; py++) {
        const v = 1.0 - py / 511.0; // 1 dorsal, 0 ventral
        for (let px = 0; px < 512; px++) {
          const u = px / 511.0;
          let barDarkness = 0.0;
          for (let b = 0; b < bars.length; b++) {
            const bar = bars[b];
            const curveShift = Math.sin(v * Math.PI) * -0.018;
            const d = Math.abs(u - (bar.u + curveShift));
            const mask = Math.exp(-Math.pow(d / bar.w, 2.2)) * bar.alpha;
            // Fade slightly toward very bottom belly on anterior bars
            const bellyFade = (b === 1) ? THREE.MathUtils.smoothstep(v, 0.12, 0.35) : 1.0;
            barDarkness = Math.max(barDarkness, mask * bellyFade);
          }

          // Fine metallic scale shimmer
          const scaleShimmer = Math.sin(u * 140.0) * Math.cos(v * 140.0) * 0.035;
          const idx = (py * 512 + px) * 4;
          const darkFactor = 1.0 - barDarkness * 0.82 + scaleShimmer;
          data[idx] = Math.round(THREE.MathUtils.clamp(data[idx] * darkFactor, 18, 252));
          data[idx + 1] = Math.round(THREE.MathUtils.clamp(data[idx + 1] * darkFactor, 22, 253));
          data[idx + 2] = Math.round(THREE.MathUtils.clamp(data[idx + 2] * (darkFactor + 0.02), 28, 255));
        }
      }
      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createAngelfishTallFinTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);

      // Luminous pearlescent silver sail with crisp dark-black leading edge spine & distinct fin rays
      const img = ctx.createImageData(256, 256);
      const data = img.data;
      for (let py = 0; py < 256; py++) {
        const v = 1.0 - py / 255.0; // 0 at body root, 1 at tall apex
        for (let px = 0; px < 256; px++) {
          const u = px / 255.0; // 0 leading edge, 1 trailing edge
          const idx = (py * 256 + px) * 4;

          // Strong black leading-edge spine (characteristic of Pterophyllum scalare) + subtle mid-fin bar accent
          const leadBlack = Math.exp(-Math.pow((u - 0.06) / 0.065, 2.0)) * 0.88;
          const midAccent = Math.exp(-Math.pow((u - 0.42) / 0.08, 2.0)) * (1.0 - v * 0.65) * 0.55;
          const darkMask = Math.max(leadBlack, midAccent);

          // Pronounced radiating silver-white fin rays
          const ray = Math.pow(Math.max(0, Math.cos(u * 52.0)), 2.0) * 0.28;
          const baseLum = THREE.MathUtils.lerp(238, 22, darkMask) + ray * (1.0 - darkMask * 0.7) * 38;

          data[idx] = Math.min(255, Math.round(baseLum * 0.95));
          data[idx + 1] = Math.min(255, Math.round(baseLum * 0.99));
          data[idx + 2] = Math.min(255, Math.round(baseLum * 1.04));

          const tipFade = 1.0 - Math.pow(v, 5.5) * 0.18;
          const trailFade = THREE.MathUtils.smoothstep(1.0, 0.93, u);
          const alpha = THREE.MathUtils.clamp(0.92 * tipFade * trailFade, 0.22, 0.96);
          data[idx + 3] = Math.round(alpha * 255);
        }
      }
      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

          bPos.setXYZ(i, bx + sway, by, bz);
        }
        bPos.needsUpdate = true;

        // Delicate edge deformation on the tall dorsal and anal fins
        for (let i = 0; i < dPos.count; i++) {
          const dx = baseDorsalVerts[i * 3];
          const dy = baseDorsalVerts[i * 3 + 1];
          const dz = baseDorsalVerts[i * 3 + 2];
          const v = THREE.MathUtils.clamp((dy - 0.18) / dorsalHeight, 0, 1);
          const u = THREE.MathUtils.clamp(0.5 - dz / bodyLen, 0, 1);
          const bodySway = Math.sin(phase - u * 3.8) * amp * Math.pow(u, 1.85);
          const finRibbon = Math.sin(phase - u * 3.8 - v * 2.9) * (0.024 + swimEffort * 0.022) * Math.pow(v, 1.35);
          dPos.setXYZ(i, dx + bodySway + finRibbon + turnAmount * v * 0.05, dy, dz);
        }
        dPos.needsUpdate = true;

        for (let i = 0; i < aPos.count; i++) {
          const ax = baseAnalVerts[i * 3];
          const ay = baseAnalVerts[i * 3 + 1];
          const az = baseAnalVerts[i * 3 + 2];
          const v = THREE.MathUtils.clamp((-ay - 0.18) / analHeight, 0, 1);
          const u = THREE.MathUtils.clamp(0.5 - az / bodyLen, 0, 1);
          const bodySway = Math.sin(phase - u * 3.8) * amp * Math.pow(u, 1.85);
          const finRibbon = Math.sin(phase - u * 3.8 - v * 2.9 + 0.5) * (0.024 + swimEffort * 0.022) * Math.pow(v, 1.35);
          aPos.setXYZ(i, ax + bodySway + finRibbon + turnAmount * v * 0.05, ay, az);
        }
        aPos.needsUpdate = true;

        const pedSway = Math.sin(phase - 3.8) * amp + turnAmount * 0.035;
        for (let i = 0; i < tPos.count; i++) {
          const tx = baseTailVerts[i * 3];
          const ty = baseTailVerts[i * 3 + 1];
          const tz = baseTailVerts[i * 3 + 2];

          tPos.setXYZ(i, tx + pedSway + wave + turnAmount * uTail * 0.045, ty, tz);

            const flex = s * s;

            const flowZ = -swimEffort * 0.08 * flex + Math.cos(time * 2.2 - s * 2.6) * 0.018 * flex;
            const flowY = swimEffort * 0.035 * flex;
            fPos.setXYZ(i, bx + flowX, by + flowY, bz + flowZ);

        leftPec.rotation.y = -0.45 + pecWave * 0.30;
        rightPec.rotation.y = 0.45 - pecWave * 0.30;

        updateAnimation,
        halfLength: 0.48,
        halfHeight: 0.76, // Full tall fin envelope so angelfish never clips surface, substrate, or decorations
        halfWidth: 0.12
      };

    function createBettaVeilFinTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);

      // Rich royal-blue to electric-violet to magenta/burgundy gradient with scalloped ruffled outer edge & radial rays
      const img = ctx.createImageData(256, 256);
      const data = img.data;
      for (let py = 0; py < 256; py++) {
        const v = (py / 255.0) * 2.0 - 1.0; // -1..1
        for (let px = 0; px < 256; px++) {
          const u = px / 255.0; // 0 at root .. 1 at outer veil margin
          const angle = Math.atan2(v, u + 0.18);
          // Softly scalloped / ruffled fin outline
          const scallop = Math.sin(angle * 28.0) * 0.032 + Math.cos(angle * 14.0) * 0.018;
          const maxR = Math.sqrt(Math.max(0.0, 1.0 - v * v * 0.62)) * 0.94 + scallop;
          const distEdge = maxR - u;
          const idx = (py * 256 + px) * 4;

          if (distEdge > 0.0) {
            // Visible radial fin rays
            const rayVal = Math.pow(Math.max(0, Math.cos(angle * 44.0)), 2.2);
            const tGrad = THREE.MathUtils.clamp(u / Math.max(0.1, maxR), 0, 1);

            // Gradient: deep royal blue (root) -> electric violet (mid) -> crimson/magenta (outer veil) -> translucent gossamer edge
            let r, g, b;
            if (tGrad < 0.45) {
              const k = tGrad / 0.45;
              r = THREE.MathUtils.lerp(24, 118, k);
              g = THREE.MathUtils.lerp(72, 34, k);
              b = THREE.MathUtils.lerp(225, 230, k);
            } else {
              const k = (tGrad - 0.45) / 0.55;
              r = THREE.MathUtils.lerp(118, 224, k);
              g = THREE.MathUtils.lerp(34, 28, k);
              b = THREE.MathUtils.lerp(230, 118, k);
            }

            // Highlight turquoise/iridescent rays
            r = Math.min(255, r + rayVal * 32);
            g = Math.min(255, g + rayVal * 52 * (1.0 - tGrad * 0.6));
            b = Math.min(255, b + rayVal * 48);

            // Translucent thin gossamer edge
            const edgeAlpha = THREE.MathUtils.smoothstep(distEdge, 0.0, 0.085);
            const alpha = THREE.MathUtils.clamp(edgeAlpha * (0.92 - tGrad * 0.16), 0, 0.92);

            data[idx] = Math.round(r);
            data[idx + 1] = Math.round(g);
            data[idx + 2] = Math.round(b);
            data[idx + 3] = Math.round(alpha * 255);
          }
        }
      }
      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBettaFish() {

        const halfH = THREE.MathUtils.lerp(0.048, caudalSpan * 0.5, Math.pow(u, 0.58));
        const veilDrape = -Math.pow(u, 1.85) * 0.095;

        const roundedZ = z * (0.78 + 0.22 * Math.cos(v * Math.PI * 0.48));
        // Soft radial ruffle pleats
        const ruffleX = Math.sin(v * 18.0 + u * 4.0) * 0.016 * Math.pow(u, 0.85);

        cPos.setXYZ(i, ruffleX, shapedY, roundedZ);
        cUv.setXY(i, u, v * 0.5 + 0.5);

        const ruffleX = Math.cos(s * 16.0 + v * 5.0) * 0.014 * v;

        aPos.setXYZ(i, ruffleX, yCoord, zRoot + zBillow);
        aUv.setXY(i, THREE.MathUtils.clamp(v * 0.85 + s * 0.15, 0, 1), s);

      // 5. Small paired translucent pectoral fins with turquoise iridescent sheen
      const pecGeo = new THREE.PlaneGeometry(0.115, 0.085, 6, 5);
      pecGeo.translate(0.057, 0, 0);

      addFishEyesAndMouth(bettaGroup, 0.044, 0.022, 0.235, 0.023, 0.008, 0.312, 0.017, 0x1688a8, bodyGeo);

      function updateAnimation(time, swimEffort, turnAmount) {
        // Slow, deliberate exploration & graceful silk-veil ribbon waves
        const freq = 4.8 + swimEffort * 4.5;
        const phase = time * freq;
        const bodyAmp = 0.015 + swimEffort * 0.022;

          const uTail = THREE.MathUtils.clamp(-cz / caudalLen, 0, 1);
          const vRad = cy / (caudalSpan * 0.5);
          const freedom = Math.pow(uTail, 1.35) * (1.0 + Math.abs(vRad) * 0.35);

          const wavePrimary = Math.sin(phase - 4.0 - uTail * 4.6 - Math.abs(vRad) * 1.4) * (0.055 + swimEffort * 0.045);
          const waveSecondary = Math.cos(time * 3.2 - uTail * 6.2 + vRad * 3.5) * 0.022;
          const turnTrail = turnAmount * Math.pow(uTail, 1.5) * 0.11;

            cx + pedSway + (wavePrimary + waveSecondary) * freedom + turnTrail,
            cy + Math.sin(time * 2.7 - uTail * 4.0 + vRad * 2.0) * 0.018 * freedom,
            cz
          );
        }
        cPos.needsUpdate = true;

        // Flowing phase-delayed wave along dorsal veil fin
        for (let i = 0; i < dPos.count; i++) {
          const dx = baseDorsalVerts[i * 3];
          const dy = baseDorsalVerts[i * 3 + 1];
          const dz = baseDorsalVerts[i * 3 + 2];
          const uBody = THREE.MathUtils.clamp(0.5 - dz / bodyLen, 0, 1.3);
          const vEdge = THREE.MathUtils.clamp((dy - 0.068) / dorsalH, 0, 1);
          const bodySway = Math.sin(phase - Math.min(1.0, uBody) * 4.0) * bodyAmp * Math.pow(Math.min(1.0, uBody), 1.75);

          dPos.setXYZ(i, dx + bodySway + veilWave + turnAmount * vEdge * 0.065, dy, dz);
        }

        for (let i = 0; i < aPos.count; i++) {
          const ax = baseAnalVerts[i * 3];
          const ay = baseAnalVerts[i * 3 + 1];
          const az = baseAnalVerts[i * 3 + 2];
          const uBody = THREE.MathUtils.clamp(0.5 - az / bodyLen, 0, 1.3);
          const vEdge = THREE.MathUtils.clamp((-ay - 0.072) / analH, 0, 1);
          const bodySway = Math.sin(phase - Math.min(1.0, uBody) * 4.0) * bodyAmp * Math.pow(Math.min(1.0, uBody), 1.75);
          const veilWave = Math.sin(phase - uBody * 4.2 - vEdge * 3.4 + 0.6) * (0.044 + swimEffort * 0.032) * Math.pow(vEdge, 1.25);
          aPos.setXYZ(i, ax + bodySway + veilWave + turnAmount * vEdge * 0.065, ay, az);
        }
        aPos.needsUpdate = true;

        // Gentle ventral tie sway & pectoral fin flutter
        leftVentral.rotation.x = -0.15 - swimEffort * 0.25 + Math.sin(time * 3.2) * 0.08;
        rightVentral.rotation.x = -0.15 - swimEffort * 0.25 + Math.cos(time * 3.2) * 0.08;

        const pecScull = Math.sin(time * 12.5);
        leftPec.rotation.y = -0.48 + pecScull * 0.34;
        rightPec.rotation.y = 0.48 - pecScull * 0.34;
      }

      return {
        group: bettaGroup,
        updateAnimation,
        halfLength: 0.62,
        halfHeight: 0.36,
        halfWidth: 0.14
      };
    }

    // =========================================================================
    // STAGE 11 — INTEGRATE FOUR INDIVIDUAL SWIMMING BEHAVIORS
    // =========================================================================
    function createFishNavigationSystem() {
      const fishGroupContainer = new THREE.Group();
      fishGroupContainer.name = 'AquariumFishPopulation';
      scene.add(fishGroupContainer);

      // Obstacles in XZ + Y range for predictive path and proximity avoidance
      const staticObstacles = [
        // Castle whole safety cylinder for swimming fish (prevents cutting through castle)
        { x: CASTLE_POS.x, z: CASTLE_POS.z - 0.08, yMin: 0.0, yMax: 2.55, radius: 1.18 },
        // Left & right castle towers extra margin
        { x: CASTLE_POS.x - 0.75, z: CASTLE_POS.z - 0.05, yMin: 0.0, yMax: 2.35, radius: 0.58 },
        { x: CASTLE_POS.x + 0.75, z: CASTLE_POS.z - 0.05, yMin: 0.0, yMax: 1.98, radius: 0.54 },
        // Black internal sponge filter & riser tube on back-right
        { x: 3.12, z: -1.42, yMin: 0.0, yMax: 2.65, radius: 0.55 },
        // Rooted plant clusters (lower/mid stems)
        { x: -3.05, z: -1.25, yMin: 0.0, yMax: 3.85, radius: 0.52 }, // Vallisneria clump
        { x: -2.18, z: 0.52,  yMin: 0.0, yMax: 0.95, radius: 0.42 }, // Anubias
        { x: 0.92,  z: -1.18, yMin: 0.0, yMax: 1.95, radius: 0.46 }, // Java fern
        { x: 2.32,  z: -0.35, yMin: 0.0, yMax: 2.25, radius: 0.48 }  // Cabomba
      ];

      // Helper to test if a point or segment [A -> B] passes too close to any obstacle at that depth
      function isPathClear(ax, ay, az, bx, by, bz, clearance) {
        const steps = 8;
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          const px = THREE.MathUtils.lerp(ax, bx, t);
          const py = THREE.MathUtils.lerp(ay, by, t);
          const pz = THREE.MathUtils.lerp(az, bz, t);

          for (let i = 0; i < staticObstacles.length; i++) {
            const ob = staticObstacles[i];
            if (py - clearance < ob.yMax && py + clearance * 0.6 > ob.yMin) {
              const d = Math.hypot(px - ob.x, pz - ob.z);
              if (d < ob.radius + clearance) return false;
            }

        }
        return true;

      const agents = [
        // 1. Fancy Guppy: lively upper-to-middle water exploration, short smooth bursts, brief hovering pauses
