      function pickNewTarget(ag) {
        const rng = ag.rng;
        const clearance = ag.model.halfLength * 0.78 + 0.12;

        // Clownfish occasionally approaches near castle front/side or Anubias/Cabomba curiously
        if (ag.id === 'clownfish' && rng() < 0.38) {
          const spots = [
            new THREE.Vector3(-0.35, 1.45, 0.48), // In front of castle arch
            new THREE.Vector3(-1.55, 1.35, 0.58), // Near Anubias
            new THREE.Vector3(1.35, 1.65, 0.42),  // Between castle and Cabomba
            new THREE.Vector3(0.25, 2.25, 0.65)   // Well-lit central foreground
          ];
          const pick = spots[Math.floor(rng() * spots.length)];
          if (isPathClear(ag.pos.x, ag.pos.y, ag.pos.z, pick.x, pick.y, pick.z, clearance)) {
            ag.target.copy(pick);
            return;
          }
        }

        for (let attempt = 0; attempt < 18; attempt++) {
          const tx = THREE.MathUtils.lerp(ag.preferXMin, ag.preferXMax, rng());
          const ty = THREE.MathUtils.lerp(ag.minY, ag.maxY, rng());
          const tz = THREE.MathUtils.lerp(ag.preferZMin, ag.preferZMax, rng());

          if (isPathClear(ag.pos.x, ag.pos.y, ag.pos.z, tx, ty, tz, clearance)) {
            ag.target.set(tx, ty, tz);
            return;
          }
        }
        // Fallback safe central well-lit target
        ag.target.set((rng() - 0.5) * 2.2, (ag.minY + ag.maxY) * 0.5, 0.65);
      }

      const desiredDir = new THREE.Vector3();
      const steerForce = new THREE.Vector3();
      const currentFlow = new THREE.Vector3();
      const lookQuat = new THREE.Quaternion();
      const bankQuat = new THREE.Quaternion();
      const lookMatrix = new THREE.Matrix4();
      const worldUp = new THREE.Vector3(0, 1, 0);
      const zeroVec = new THREE.Vector3(0, 0, 0);

      function update(time, dt) {
        for (let i = 0; i < agents.length; i++) {
          const ag = agents[i];
          const rng = ag.rng;
          const m = ag.model;

          // Update personality state timer (cruise / burst / hover)
          ag.stateTimer -= dt;
          if (ag.stateTimer <= 0) {
            const roll = rng();
            if (ag.id === 'guppy') {
              if (roll < 0.25) {
                ag.state = 'hover';
                ag.stateTimer = 0.8 + rng() * 1.1;
              } else if (roll < 0.58) {
                ag.state = 'burst';
                ag.stateTimer = 0.9 + rng() * 1.3;
              } else {
                ag.state = 'cruise';
                ag.stateTimer = 2.0 + rng() * 2.4;
              }
            } else if (ag.id === 'clownfish') {
              ag.state = roll < 0.16 ? 'hover' : (roll < 0.34 ? 'burst' : 'cruise');
              ag.stateTimer = 2.2 + rng() * 3.0;
            } else if (ag.id === 'angelfish') {
              ag.state = roll < 0.34 ? 'hover' : 'cruise';
              ag.stateTimer = 2.6 + rng() * 3.5;
            } else {
              // Betta
              ag.state = roll < 0.36 ? 'hover' : (roll < 0.52 ? 'burst' : 'cruise');
              ag.stateTimer = 2.2 + rng() * 3.2;
            }
          }

          // Update wandering target
          ag.targetTimer -= dt;
          const distToTarget = ag.pos.distanceTo(ag.target);
          if (ag.targetTimer <= 0 || distToTarget < 0.55) {
            pickNewTarget(ag);
            ag.targetTimer = 3.8 + rng() * 4.2;
          }

          // Determine target speed from personality state
          let targetSpeed = ag.cruiseSpeed;
          if (ag.state === 'burst') targetSpeed = ag.burstSpeed;
          else if (ag.state === 'hover') targetSpeed = ag.hoverSpeed;

          // 1. Seek target with gentle organic wander
          desiredDir.subVectors(ag.target, ag.pos);
          if (desiredDir.lengthSq() > 0.001) desiredDir.normalize();
          desiredDir.x += Math.sin(time * 1.1 + i * 2.1) * 0.12;
          desiredDir.y += Math.cos(time * 0.85 + i * 1.7) * 0.06;
          desiredDir.z += Math.cos(time * 1.05 + i * 2.9) * 0.12;
          desiredDir.y *= 0.48; // Keep vertical steering gentle & natural
          desiredDir.normalize();

          steerForce.copy(desiredDir).multiplyScalar(1.4);

          // 2. Predictive wall avoidance accounting for full body + tail/fin envelope
          const envR = m.halfLength + 0.16;
          const envH = m.halfHeight + 0.10;
          const lookAhead = ag.pos.clone().addScaledVector(ag.heading, envR * 1.25);

          const xWallMin = TANK.innerMinX + envR;
          const xWallMax = TANK.innerMaxX - envR;
          const zWallMin = TANK.innerMinZ + envR;
          const zWallMax = TANK.innerMaxZ - envR;

          if (lookAhead.x < xWallMin) steerForce.x += (xWallMin - lookAhead.x) * 4.5;
          if (lookAhead.x > xWallMax) steerForce.x -= (lookAhead.x - xWallMax) * 4.5;
          if (lookAhead.z < zWallMin) steerForce.z += (zWallMin - lookAhead.z) * 4.8;
          if (lookAhead.z > zWallMax) steerForce.z -= (lookAhead.z - zWallMax) * 4.8;

          const localSurfY = evaluateWaterSurfaceHeight(ag.pos.x, ag.pos.z, time) - envH - 0.08;
          const localFloorY = getSubstrateHeight(ag.pos.x, ag.pos.z) + envH + 0.10;
          const safeMinY = Math.max(ag.minY, localFloorY);
          const safeMaxY = Math.min(ag.maxY, localSurfY);

          if (lookAhead.y < safeMinY) steerForce.y += (safeMinY - lookAhead.y) * 4.2;
          if (lookAhead.y > safeMaxY) steerForce.y -= (lookAhead.y - safeMaxY) * 4.2;

          // 3. Obstacle avoidance (castle, filter, plant bases, larger accent stones)
          for (let o = 0; o < staticObstacles.length; o++) {
            const ob = staticObstacles[o];
            if (ag.pos.y + envH > ob.yMin && ag.pos.y - envH < ob.yMax) {
              // Check both current position and lookAhead position
              const dx = lookAhead.x - ob.x;
              const dz = lookAhead.z - ob.z;
              const dist = Math.hypot(dx, dz);
              const minSafe = ob.radius + envR;
              if (dist < minSafe && dist > 1e-4) {
                const push = ((minSafe - dist) / minSafe) * 5.2;
                steerForce.x += (dx / dist) * push;
                steerForce.z += (dz / dist) * push;
                if (ag.pos.y > ob.yMax - 0.45 && ag.pos.y < safeMaxY - 0.25) {
                  steerForce.y += push * 0.35;
                }
              }
            }
          }

          // 4. Separation steering between the four fish so they never intersect
          for (let j = 0; j < agents.length; j++) {
            if (i === j) continue;
            const other = agents[j];
            const diff = ag.pos.clone().sub(other.pos);
            const dist = diff.length();
            const minSep = m.halfLength + other.model.halfLength + 0.26;
            if (dist < minSep && dist > 1e-4) {
              const strength = ((minSep - dist) / minSep) * 3.8;
              diff.normalize();
              steerForce.addScaledVector(diff, strength);
            }
          }

          // Smooth heading & velocity integration with turn-rate limit
          steerForce.y = THREE.MathUtils.clamp(steerForce.y, -0.95, 0.95);
          const targetHeading = ag.heading.clone().addScaledVector(steerForce, dt * ag.maxTurnRate);
          // Restrained pitch so fish remain upright and natural
          targetHeading.y = THREE.MathUtils.clamp(targetHeading.y, -0.26, 0.26);
          if (targetHeading.lengthSq() > 1e-5) targetHeading.normalize();

          // Measure signed horizontal turn rate for fin trail & banking
          const crossY = ag.heading.z * targetHeading.x - ag.heading.x * targetHeading.z;
          const turnRate = THREE.MathUtils.clamp(crossY / Math.max(dt, 0.008), -2.5, 2.5);
          ag.smoothTurn = THREE.MathUtils.lerp(ag.smoothTurn, turnRate, Math.min(1.0, dt * 6.0));

          ag.heading.copy(targetHeading);

          // Smoothly approach target speed
          const currentSpeed = ag.vel.length();
          const newSpeed = THREE.MathUtils.lerp(currentSpeed, targetSpeed, Math.min(1.0, dt * 3.2));
          ag.vel.copy(ag.heading).multiplyScalar(newSpeed);

          // Subtle influence from shared water current
          sampleWaterCurrent(ag.pos.x, ag.pos.y, ag.pos.z, time, currentFlow);
          ag.pos.addScaledVector(ag.vel, dt);
          ag.pos.addScaledVector(currentFlow, dt * 0.14);

          // 5. Final hard bounds & obstacle safeguard so no part of any fish ever clips glass, surface, substrate, or castle
          ag.pos.x = THREE.MathUtils.clamp(ag.pos.x, xWallMin, xWallMax);
          ag.pos.z = THREE.MathUtils.clamp(ag.pos.z, zWallMin, zWallMax);
          ag.pos.y = THREE.MathUtils.clamp(ag.pos.y, localFloorY, localSurfY);

          for (let o = 0; o < staticObstacles.length; o++) {
            const ob = staticObstacles[o];
            if (ag.pos.y + envH * 0.85 > ob.yMin && ag.pos.y - envH * 0.85 < ob.yMax) {
              const dx = ag.pos.x - ob.x;
              const dz = ag.pos.z - ob.z;
              const dist = Math.hypot(dx, dz);
              const hardR = ob.radius + m.halfLength * 0.82;
              if (dist < hardR && dist > 1e-4) {
                ag.pos.x = ob.x + (dx / dist) * hardR;
                ag.pos.z = ob.z + (dz / dist) * hardR;
              }
            }
          }

          m.group.position.copy(ag.pos);

          // Smooth quaternion orientation along velocity + slight banking during turns
          // Note: lookAt(eye, target, up) in Three.js aligns -Z with (target - eye), so to align +Z with ag.heading we pass (zeroVec, ag.heading) reversed:
          lookMatrix.lookAt(ag.heading, zeroVec, worldUp);
          lookQuat.setFromRotationMatrix(lookMatrix);
          bankQuat.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -ag.smoothTurn * 0.11);
          lookQuat.multiply(bankQuat);
          m.group.quaternion.slerp(lookQuat, Math.min(1.0, dt * 8.5));

          // Couple swimming effort to body and tail undulation
          const normEffort = THREE.MathUtils.clamp(
            (newSpeed - ag.hoverSpeed) / Math.max(0.1, ag.burstSpeed - ag.hoverSpeed),
            0.05,
            1.15
          );
          ag.smoothEffort = THREE.MathUtils.lerp(ag.smoothEffort, normEffort, Math.min(1.0, dt * 5.0));
          ag.animTime += dt * (0.65 + ag.smoothEffort * 0.85);

          m.updateAnimation(ag.animTime, ag.smoothEffort, ag.smoothTurn);
        }
      }

      return { agents, update };
    }

    const fishNavigationSystem = createFishNavigationSystem();

    // =========================================================================
    // STAGE 12 — DEVELOP AND ANIMATE ONE BOTTOM-WALKING CRAB
    // =========================================================================
    // Shared reference so crab and bottom snail can mutually avoid each other
    const bottomCreaturePositions = {

    function createCarapaceTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(128, 118, 12, 128, 128, 130);
      grad.addColorStop(0.0, '#b5381c');
      grad.addColorStop(0.55, '#8f2914');
      grad.addColorStop(1.0, '#5a1a0d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      // Subtle mottled spots & gastric/branchial carapace grooves
      const rng = createSeededRandom(1201);
      for (let i = 0; i < 95; i++) {
        const x = rng() * 256;
        const y = rng() * 256;
        const r = 3 + rng() * 9;
        ctx.fillStyle = rng() > 0.45 ? 'rgba(55, 14, 6, 0.25)' : 'rgba(225, 110, 55, 0.18)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createBottomWalkingCrab() {
      const crabRoot = new THREE.Group();
      crabRoot.name = 'BottomWalkingCrab';

      const bodyGroup = new THREE.Group();
      crabRoot.add(bodyGroup);

      const shellTex = createCarapaceTexture();
      const carapaceMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          map: shellTex,
          roughness: 0.44,
          metalness: 0.08
        }),
        0.38
      );

      const legShellMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xa6351b,
          roughness: 0.48,
          metalness: 0.06
        }),

      );

      const clawTipMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xe68a56,
          roughness: 0.36,
          metalness: 0.05
        }),
        0.36
      );

      const undersideMat = new THREE.MeshStandardMaterial({
        color: 0xd49b72,
        roughness: 0.65
      });

      // 1. Low rounded hexagonal-oval carapace with subtle segmentation and frontal rostrum ridges
      const carapaceGeo = new THREE.SphereGeometry(0.19, 28, 20);
      const cPos = carapaceGeo.attributes.position;
      for (let i = 0; i < cPos.count; i++) {
        let x = cPos.getX(i);
        let y = cPos.getY(i);
        let z = cPos.getZ(i);

        // Widen laterally (X) and flatten vertically (Y) into a true crab carapace
        x *= 1.38;
        y *= (y > 0 ? 0.48 : 0.32);
        z *= 1.04;

        // Anterolateral marginal teeth bumps along front-side edges
        const angleXZ = Math.atan2(z, Math.abs(x));
        if (z > -0.02 && Math.abs(x) > 0.08) {

          x += Math.sign(x) * tooth;

      // Slight natural asymmetry: right crusher claw slightly larger than left cutter claw
      const claws = [];
      [-1, 1].forEach((side) => {

      const legs = [];

          coxaPivot.position.set(side * 0.21, 0.082, legZOffsets[l]);
          coxaPivot.rotation.y = side * legSplayAngles[l];
          bodyGroup.add(coxaPivot);

          // Coxa joint bead
          const coxaMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.019, 8, 8),
            legShellMat
          );
          coxaPivot.add(coxaMesh);

          // Upper leg segment (Merus) rising slightly outward from carapace
          const merusPivot = new THREE.Group();
          coxaPivot.add(merusPivot);

          const merusLen = 0.115 * reach;
          const merusMesh = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.015, merusLen, 5, 8),
            legShellMat
          );
          merusMesh.rotation.z = -side * (Math.PI * 0.5 - 0.32);
          merusMesh.position.set(side * (merusLen * 0.52), 0.022, 0);
          merusMesh.castShadow = true;
          merusPivot.add(merusMesh);

          // Knee joint (Carpus/Propodus pivot)
          const kneePivot = new THREE.Group();
          kneePivot.position.set(side * (merusLen * 0.96), 0.042, 0);
          merusPivot.add(kneePivot);

          const kneeBead = new THREE.Mesh(
            new THREE.SphereGeometry(0.016, 8, 8),
            legShellMat
          );
          kneePivot.add(kneeBead);

          const carpusLen = 0.095 * reach;
          const carpusMesh = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.012, carpusLen, 5, 8),
            legShellMat
          );
          carpusMesh.rotation.z = -side * (Math.PI * 0.5 + 0.45);
          carpusMesh.position.set(side * (carpusLen * 0.42), -0.025, 0);
          carpusMesh.castShadow = true;
          kneePivot.add(carpusMesh);

          // Pointed ankle/foot tip (Dactylus) that plants onto the substrate
          const anklePivot = new THREE.Group();
          anklePivot.position.set(side * (carpusLen * 0.80), -0.050, 0);
          kneePivot.add(anklePivot);

          const dactylLen = 0.092 * reach;
          const dactylMesh = new THREE.Mesh(
            new THREE.ConeGeometry(0.012, dactylLen, 8),
            clawTipMat
          );
          // Flipped so the pointed apex is the part that touches the ground
          dactylMesh.rotation.z = side * 0.25 + Math.PI;
          dactylMesh.position.set(side * 0.014, -dactylLen * 0.46, 0);
          dactylMesh.castShadow = true;
          anklePivot.add(dactylMesh);

          // Contact point at the cone apex, used to keep the foot on top of pebbles
          const footTip = new THREE.Object3D();
          footTip.position.set(0, dactylLen * 0.5, 0);
          dactylMesh.add(footTip);

          // Alternating tetrapod gait group: Group 0 or Group 1
          const gaitGroup = (l + sideIdx) % 2;

          legs.push({
            side,
            index: l,
            gaitGroup,
            coxaPivot,
            merusPivot,
            kneePivot,
            anklePivot,
            footTip,
            ikLift: 0,
            baseYaw: side * legSplayAngles[l]
          });
        }
      });

      // 5. Foreground patrol route & sideways walking state machine
      const waypoints = [
        new THREE.Vector3(-0.75, 0, 1.05),
        new THREE.Vector3(-0.25, 0, 0.68), // Passes near the castle entrance
        new THREE.Vector3(0.55,  0, 0.92),
        new THREE.Vector3(1.55,  0, 1.12),
        new THREE.Vector3(0.85,  0, 1.34),
        new THREE.Vector3(-0.15, 0, 1.26)
      ];

      let wpIndex = 2;
      const crabPos = bottomCreaturePositions.crab;
      crabPos.set(0.35, getSubstrateHeight(0.35, 0.98), 0.98);
      crabRoot.position.copy(crabPos);

      let walkPhase = 0;
      let bodyLift = 0;
      const FOOT_CLEARANCE = 0.004;
      // Points under the carapace (crab-local x, z) checked for stones beneath the body
      const BODY_FOOTPRINT = [[0.17, 0], [-0.17, 0], [0, 0.13], [0, -0.13], [0.11, 0.09], [-0.11, 0.09], [0.11, -0.09], [-0.11, -0.09]];
      const footWorld = new THREE.Vector3();
      const hipWorld = new THREE.Vector3();
      let mode = 'walk'; // 'walk' or 'pause'
      let modeTimer = 4.2;
      let facingYaw = 0.08;
      const surfNorm = new THREE.Vector3();
      const targetQuat = new THREE.Quaternion();
      const yawQuat = new THREE.Quaternion();
      const upVec = new THREE.Vector3(0, 1, 0);

      function update(time, dt) {
        modeTimer -= dt;
        if (modeTimer <= 0) {
          if (mode === 'walk') {
            mode = 'pause';
            modeTimer = 1.6 + Math.abs(Math.sin(time * 1.7)) * 1.6;
          } else {
            mode = 'walk';
            modeTimer = 4.0 + Math.abs(Math.cos(time * 1.3)) * 3.0;
          }
        }

        const targetWP = waypoints[wpIndex];
        const toWP = new THREE.Vector3(targetWP.x - crabPos.x, 0, targetWP.z - crabPos.z);
        const distWP = toWP.length();

        if (distWP < 0.14) {
          wpIndex = (wpIndex + 1) % waypoints.length;
        }

        let moveSpeed = 0;
        let lateralDirSign = 1;

        if (mode === 'walk' && distWP > 0.01) {
          toWP.normalize();

          // Avoid bottom snail A if nearby
          const toSnail = new THREE.Vector3(crabPos.x - bottomCreaturePositions.snailA.x, 0, crabPos.z - bottomCreaturePositions.snailA.z);
          const dSnail = toSnail.length();
          if (dSnail < 0.55 && dSnail > 1e-4) {
            toWP.addScaledVector(toSnail.normalize(), (0.55 - dSnail) * 2.4).normalize();
          }

          // Avoid accent stones & plant bases
          for (let i = 0; i < accentStoneObstacles.length; i++) {
            const st = accentStoneObstacles[i];
            const dx = crabPos.x - st.x;
            const dz = crabPos.z - st.z;
            const d = Math.hypot(dx, dz);
            const minD = st.radius + 0.34;
            if (d < minD && d > 1e-4) {
              toWP.x += (dx / d) * 1.8;
              toWP.z += (dz / d) * 1.8;
              toWP.normalize();
            }
          }

          moveSpeed = 0.21;
          crabPos.x += toWP.x * moveSpeed * dt;
          crabPos.z += toWP.z * moveSpeed * dt;

          // Keep strictly inside foreground/midground safe floor bounds
          crabPos.x = THREE.MathUtils.clamp(crabPos.x, TANK.innerMinX + 0.52, TANK.innerMaxX - 0.52);
          crabPos.z = THREE.MathUtils.clamp(crabPos.z, -0.25, TANK.innerMaxZ - 0.42);

          // Predominantly sideways locomotion: crab faces forward (+Z with slight yaw toward travel) while scuttling laterally
          const desiredYaw = Math.atan2(toWP.x, Math.abs(toWP.z) + 1.8) * 0.32;
          facingYaw = THREE.MathUtils.lerp(facingYaw, desiredYaw, Math.min(1.0, dt * 3.0));
          lateralDirSign = toWP.x >= 0 ? 1 : -1;

          // Advance leg cycle strictly proportional to actual distance traveled so feet never slide
          walkPhase += (moveSpeed * dt) * 26.0 * lateralDirSign;
        }

        // Follow simplified substrate height and normal for stable ground contact,
        // lifting the body over any pebble that would otherwise poke through the carapace
        const groundY = getSubstrateHeight(crabPos.x, crabPos.z);
        const cosYaw = Math.cos(facingYaw);
        const sinYaw = Math.sin(facingYaw);
        let bedUnderBody = getPebbleBedSurfaceHeight(crabPos.x, crabPos.z);
        for (let i = 0; i < BODY_FOOTPRINT.length; i++) {
          const fx = BODY_FOOTPRINT[i][0];
          const fz = BODY_FOOTPRINT[i][1];
          bedUnderBody = Math.max(bedUnderBody, getPebbleBedSurfaceHeight(
            crabPos.x + fx * cosYaw + fz * sinYaw,
            crabPos.z - fx * sinYaw + fz * cosYaw
          ));
        }
        const bodyLiftTarget = Math.max(0, bedUnderBody - groundY - 0.03);
        // Climb quickly, settle slowly so the body never dips into a stone
        bodyLift = bodyLiftTarget > bodyLift
          ? bodyLiftTarget
          : THREE.MathUtils.lerp(bodyLift, bodyLiftTarget, Math.min(1.0, dt * 3.0));
        crabPos.y = groundY + bodyLift;
        crabRoot.position.copy(crabPos);

        getSubstrateNormal(crabPos.x, crabPos.z, surfNorm);
        targetQuat.setFromUnitVectors(upVec, surfNorm);
        yawQuat.setFromAxisAngle(upVec, facingYaw);
        targetQuat.multiply(yawQuat);
        crabRoot.quaternion.slerp(targetQuat, Math.min(1.0, dt * 8.0));

        // Subtle body bob & roll synchronized with alternating tetrapod leg stance
        const gaitActivity = mode === 'walk' ? 1.0 : 0.0;
        bodyGroup.position.y = Math.abs(Math.sin(walkPhase)) * 0.009 * gaitActivity;
        bodyGroup.rotation.z = Math.sin(walkPhase) * 0.032 * gaitActivity;
        bodyGroup.rotation.x = Math.sin(time * 2.1) * 0.015;

        // Coordinate alternating tetrapod leg groups (stance on ground vs arched recovery lift)
        for (let i = 0; i < legs.length; i++) {
          const lg = legs[i];
          const phaseOffset = lg.gaitGroup * Math.PI + lg.index * 0.22;
          const cyc = walkPhase + phaseOffset;
          const sinC = Math.sin(cyc);
          const cosC = Math.cos(cyc);

          // During recovery (sinC > 0), foot lifts off substrate; during stance (sinC <= 0), foot plants firmly
          const lift = Math.max(0, sinC) * gaitActivity;
          const stride = cosC * 0.24 * gaitActivity;

          // Sideways reach & plant kinematics
          lg.coxaPivot.rotation.y = lg.baseYaw + stride * 0.45;
          lg.merusPivot.rotation.z = lg.side * (lift * 0.36);
          lg.kneePivot.rotation.z = -lg.side * (lift * 0.28 - stride * 0.18);
          lg.anklePivot.rotation.z = lg.side * (-lift * 0.12 - stride * 0.15);
          lg.gaitLift = lift;
        }

        // Foot placement: raise or lower each leg at the hip so its tip rests on the pebble bed instead of sinking in
        crabRoot.updateMatrixWorld(true);
        for (let i = 0; i < legs.length; i++) {
          const lg = legs[i];
          const isStance = lg.gaitLift < 0.05;
          // Warm-start from last frame's correction
          lg.merusPivot.rotation.z = lg.side * (lg.gaitLift * 0.36 + lg.ikLift);
          lg.merusPivot.updateMatrixWorld(true);
          for (let iter = 0; iter < 5; iter++) {
            lg.footTip.getWorldPosition(footWorld);
            const err = getPebbleBedSurfaceHeight(footWorld.x, footWorld.z) + FOOT_CLEARANCE - footWorld.y;
            // Swinging legs are only pushed up; planted legs also reach down to the stones
            if (Math.abs(err) < 0.002 || (!isStance && err < 0 && lg.ikLift <= 0)) break;
            lg.merusPivot.getWorldPosition(hipWorld);
            const lever = Math.max(0.06, Math.hypot(footWorld.x - hipWorld.x, footWorld.z - hipWorld.z));
            lg.ikLift = THREE.MathUtils.clamp(lg.ikLift + Math.atan(err / lever), isStance ? -0.45 : 0, 1.4);
            lg.merusPivot.rotation.z = lg.side * (lg.gaitLift * 0.36 + lg.ikLift);
            lg.merusPivot.updateMatrixWorld(true);
          }
          // Newton steps can overshoot on steep pebble flanks, so verify and nudge up until the tip is clear
          for (let guard = 0; guard < 30; guard++) {
            lg.footTip.getWorldPosition(footWorld);
            if (getPebbleBedSurfaceHeight(footWorld.x, footWorld.z) <= footWorld.y || lg.ikLift >= 1.4) break;
            lg.ikLift = Math.min(lg.ikLift + 0.04, 1.4);
            lg.merusPivot.rotation.z = lg.side * (lg.gaitLift * 0.36 + lg.ikLift);
            lg.merusPivot.updateMatrixWorld(true);
          }
        }

        // Claw gestures & pincer articulation (occasional exploratory gesture while stopped or walking)
        claws.forEach((cl, idx) => {
          const gestureWave = mode === 'pause'
            ? Math.sin(time * 2.6 + idx * 1.9) * 0.22
            : Math.sin(time * 1.8 + idx * 1.4) * 0.08;
          cl.shoulderPivot.rotation.y = cl.baseShoulderY + gestureWave * 0.45;
          cl.shoulderPivot.rotation.x = (mode === 'pause' && idx === 1)
            ? -0.22 - Math.max(0, Math.sin(time * 2.4)) * 0.18
            : -0.06;

          // Pincer opening & closing (dactylPivot)
          const pincerOpen = (mode === 'pause')
            ? Math.max(0, Math.sin(time * 3.2 + idx * 2.1)) * 0.48
            : Math.max(0, Math.sin(time * 1.5 + idx * 2.5) - 0.35) * 0.28;
          cl.dactylPivot.rotation.x = -pincerOpen;
        });

        // Subtle eyestalk and mouthpart movement
        eyestalks.forEach((es, idx) => {
          es.pivot.rotation.z = Math.sin(time * 2.3 + idx) * 0.08;
        });
        mouthParts.forEach((mp, idx) => {
          mp.mesh.position.x = mp.side * (0.022 + Math.sin(time * 9.0 + idx) * 0.004);
        });
      }

      scene.add(crabRoot);
      return { crabRoot, update };
    }

    const bottomWalkingCrab = createBottomWalkingCrab();

    // =========================================================================
    // STAGE 13 — DEVELOP TWO SNAILS WITH DIFFERENT SURFACE CONSTRAINTS
    // =========================================================================
    // Procedural 3D logarithmic helicospiral shell generator with growth bands
    function createCoiledSnailShellGeometry(shellRadius = 0.14) {
      const turns = 3.25;
      const uSteps = 84;
      const vSteps = 22;
      const vertices = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= uSteps; i++) {
        const u = i / uSteps; // 0 = apex tip, 1 = aperture opening
        const theta = u * turns * Math.PI * 2.0;
        const growth = Math.pow(u, 1.55);

        // Dextral helicospiral center path
        const spiralR = growth * shellRadius * 0.68;
        const tubeR = growth * shellRadius * 0.48 + 0.004;
        const spireOffsetX = (1.0 - u) * shellRadius * 0.62;

        const cx = spireOffsetX + Math.sin(theta) * (spiralR * 0.22);
        const cy = Math.sin(theta) * spiralR;
        const cz = Math.cos(theta) * spiralR;

        // Subtle growth rib ridges near outer turns
        const rib = 1.0 + Math.sin(theta * 14.0) * 0.028 * u;

        for (let j = 0; j <= vSteps; j++) {
          const v = j / vSteps;
          const phi = v * Math.PI * 2.0;

          const radialOutY = Math.sin(theta);
          const radialOutZ = Math.cos(theta);

          const cosPhi = Math.cos(phi);
          const sinPhi = Math.sin(phi);

          const px = cx + sinPhi * tubeR * 0.92 * rib;
          const py = cy + cosPhi * radialOutY * tubeR * rib;
          const pz = cz + cosPhi * radialOutZ * tubeR * rib;

          vertices.push(px, py, pz);
          uvs.push(u, v);
        }
      }

      for (let i = 0; i < uSteps; i++) {
        for (let j = 0; j < vSteps; j++) {
          const a = i * (vSteps + 1) + j;
          const b = (i + 1) * (vSteps + 1) + j;
          const c = (i + 1) * (vSteps + 1) + (j + 1);
          const d = i * (vSteps + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setIndex(indices);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.computeVertexNormals();
      return geo;
    }

    function createSnailShellTexture(variant) {
      const canvas = new THREE.CanvasTexture(document.createElement('canvas'));
      const c = canvas.image;
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      if (variant === 'amber') {
        // Snail A: warm amber-brown spiral shell with growth bands
        const grad = ctx.createLinearGradient(0, 0, 256, 0);
        grad.addColorStop(0.0, '#4f2810');
        grad.addColorStop(0.45, '#9e5620');
        grad.addColorStop(0.82, '#c87b32');
        grad.addColorStop(1.0, '#854618');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 256);

        // Transverse growth bands and spiral Chestnut stripes
        for (let x = 0; x < 256; x += 6) {
          ctx.fillStyle = (x % 12 === 0) ? 'rgba(62, 26, 8, 0.36)' : 'rgba(245, 190, 110, 0.18)';
          ctx.fillRect(x, 0, 3, 256);
        }
        ctx.fillStyle = 'rgba(72, 30, 10, 0.35)';
        ctx.fillRect(0, 52, 256, 24);
        ctx.fillRect(0, 148, 256, 28);
      } else {
        // Snail B: contrasting cream/olive nerite shell with dark zebra stripes & speckles
        const grad = ctx.createLinearGradient(0, 0, 256, 0);
        grad.addColorStop(0.0, '#7c8252');
        grad.addColorStop(0.45, '#c8c48e');
        grad.addColorStop(0.85, '#ded8a4');
        grad.addColorStop(1.0, '#a8a670');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 256);

        // Dark charcoal-brown nerite chevrons/stripes & speckles
        ctx.strokeStyle = 'rgba(28, 26, 18, 0.82)';
        ctx.lineWidth = 5.5;
        for (let x = -40; x < 280; x += 18) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + 26, 128);
          ctx.lineTo(x + 4, 256);
          ctx.stroke();
        }
      }

      canvas.colorSpace = THREE.SRGBColorSpace;
      return canvas;
    }

    function buildSnailModel(name, shellVariant, bodyColorHex, soleColorHex) {
      const snailGroup = new THREE.Group();
      snailGroup.name = name;

      // Soft muscular foot resting directly at local Y = 0, facing +Z
      const footLen = 0.27;
      const footWid = 0.115;
      const footGeo = new THREE.BoxGeometry(footWid, 0.042, footLen, 10, 4, 18);
      const fPos = footGeo.attributes.position;
      const fColors = new Float32Array(fPos.count * 3);
      const topBodyCol = new THREE.Color(bodyColorHex);
      const soleCol = new THREE.Color(soleColorHex);

      for (let i = 0; i < fPos.count; i++) {
        let x = fPos.getX(i);
        let y = fPos.getY(i) + 0.021; // 0 (flat sole on surface) to 0.042 (dorsal body)
        let z = fPos.getZ(i);

        const s = THREE.MathUtils.clamp((z / footLen) + 0.5, 0, 1); // 0 tail, 1 head
        const taper = Math.sin(Math.pow(s, 0.65) * Math.PI * 0.94) + 0.18 * s;
        x *= taper;

        // Keep sole (y near 0) flat against surface while rounding dorsal body arch
        const hProfile = Math.sin(Math.pow(s, 0.7) * Math.PI) * (1.0 - Math.pow(x / (footWid * 0.65), 2.0) * 0.55);
        if (y > 0.004) {
          y = 0.004 + (y - 0.004) * Math.max(0.25, hProfile * 1.45);
        } else {
          y = 0.001; // Flat contact sole
        }

        fPos.setXYZ(i, x, y, z);

        const c = y < 0.008 ? soleCol : topBodyCol;
        fColors[i * 3] = c.r;
        fColors[i * 3 + 1] = c.g;
        fColors[i * 3 + 2] = c.b;
      }
      footGeo.setAttribute('color', new THREE.BufferAttribute(fColors, 3));
      footGeo.computeVertexNormals();
      const baseFootVerts = new Float32Array(fPos.array);

      const footMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.42,
          metalness: 0.02
        }),
        0.34
      );
      const footMesh = new THREE.Mesh(footGeo, footMat);
      footMesh.castShadow = true;
      footMesh.receiveShadow = true;
      snailGroup.add(footMesh);

      // Small rounded head + two fine exploratory tentacles + two tiny labial palps
      const headPivot = new THREE.Group();
      headPivot.position.set(0, 0.028, footLen * 0.42);
      snailGroup.add(headPivot);

      const headMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: bodyColorHex,
          roughness: 0.38
        }),
        0.34
      );
      const headBulb = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 10), headMat);
      headBulb.scale.set(1.1, 0.82, 1.15);
      headPivot.add(headBulb);

      const tentacles = [];
      [-1, 1].forEach((side) => {
        const tPivot = new THREE.Group();
        tPivot.position.set(side * 0.018, 0.010, 0.022);
        const tCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(side * 0.018, 0.026, 0.034),
          new THREE.Vector3(side * 0.034, 0.042, 0.062)
        ]);
        const tMesh = new THREE.Mesh(
          new THREE.TubeGeometry(tCurve, 10, 0.0038, 6, false),
          headMat
        );
        tPivot.add(tMesh);

        // Tiny dark eye spot at base of tentacle
        const eyeSpot = new THREE.Mesh(
          new THREE.SphereGeometry(0.0045, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0x0b0d10 })
        );
        eyeSpot.position.set(side * 0.004, 0.003, 0.004);
        tPivot.add(eyeSpot);

        headPivot.add(tPivot);
        tentacles.push({ pivot: tPivot, side });
      });

      // Coiled 3D spiral shell firmly attached to dorsal mantle of body
      const shellPivot = new THREE.Group();
      shellPivot.position.set(0, 0.095, -0.018);
      shellPivot.rotation.set(-0.22, 0.15, -0.18);
      snailGroup.add(shellPivot);

      const shellGeo = createCoiledSnailShellGeometry(0.125);
      const shellTex = createSnailShellTexture(shellVariant);
      const shellMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          map: shellTex,
          roughness: 0.32,
          metalness: 0.05,
          side: THREE.DoubleSide
        }),
        0.38
      );
      const shellMesh = new THREE.Mesh(shellGeo, shellMat);
      shellMesh.castShadow = true;
      shellMesh.receiveShadow = true;
      shellPivot.add(shellMesh);

      function updateAnatomy(time, speedPhase) {
        // Subtle muscular pedal wave along the foot margins while keeping sole in contact
        for (let i = 0; i < fPos.count; i++) {
          const bx = baseFootVerts[i * 3];
          const by = baseFootVerts[i * 3 + 1];
          const bz = baseFootVerts[i * 3 + 2];
          const ripple = Math.sin(time * 3.6 - bz * 28.0 + speedPhase) * 0.0045;
          fPos.setXYZ(
            i,
            bx * (1.0 + ripple * 2.2),
            by > 0.004 ? by + ripple * 0.4 : by,
            bz
          );
        }
        fPos.needsUpdate = true;

        // Gentle exploratory head & tentacle motion
        headPivot.rotation.y = Math.sin(time * 1.45 + speedPhase) * 0.18;
        headPivot.rotation.x = Math.cos(time * 1.15 + speedPhase) * 0.08;
        tentacles.forEach((t, idx) => {
          t.pivot.rotation.y = Math.sin(time * 2.3 + idx * 1.7 + speedPhase) * 0.26;
          t.pivot.rotation.x = Math.cos(time * 1.9 + idx * 1.3 + speedPhase) * 0.22;
        });

        // Subtle shell posture rock synced with foot contraction
        shellPivot.rotation.z = -0.18 + Math.sin(time * 1.8 + speedPhase) * 0.025;
      }

      return { snailGroup, updateAnatomy };
    }

    function createTwoSnailsSystem() {
      // -----------------------------------------------------------------------
      // Snail A: Bottom crawler (warm amber-brown spiral shell, foreground pebble route + gentle low stone climb)
      // -----------------------------------------------------------------------
      const snailA = buildSnailModel('SnailA_BottomCrawler', 'amber', 0x705b47, 0x9e8870);
      snailA.snailGroup.scale.setScalar(1.22);
      scene.add(snailA.snailGroup);

      // Foreground route that gently climbs over the low flat foreground stone at (-1.45, 1.18)
      const snailARoute = [
        new THREE.Vector3(-2.15, 0, 1.16),
        new THREE.Vector3(-1.45, 0, 1.18), // Low climbable stone
        new THREE.Vector3(-0.78, 0, 1.24),
        new THREE.Vector3(-1.38, 0, 1.38)
      ];
      let snailAWp = 1;
      const snailAPos = bottomCreaturePositions.snailA;
      snailAPos.set(-1.72, getBottomWalkHeight(-1.72, 1.17, true), 1.17);
      let snailAHeading = new THREE.Vector3(1, 0, 0.05).normalize();

      // -----------------------------------------------------------------------
      // Snail B: Glass crawler (contrasting cream/olive striped shell on INSIDE of front glass)
      // -----------------------------------------------------------------------
      const snailB = buildSnailModel('SnailB_GlassCrawler', 'striped', 0x4b5244, 0xd8d2be);
      snailB.snailGroup.scale.setScalar(1.22);
      scene.add(snailB.snailGroup);

      // Front glass inner surface is at Z = TANK.innerMaxZ = +1.915.
      // Attach Snail B's flat sole flush against the inside of the front glass (Z = 1.913),
      // in its lower third (Y ~ 1.25 to 1.68) and offset from center so it doesn't hide fish.
      const frontGlassInnerZ = TANK.innerMaxZ - 0.002;
      const snailBStart = new THREE.Vector2(-2.86, 1.54);
      const snailBEnd = new THREE.Vector2(-2.48, 1.88);
      let snailBProgress = 0.35;
      let snailBDir = 1;

      const surfNorm = new THREE.Vector3();
      const forwardTangent = new THREE.Vector3();
      const rightTangent = new THREE.Vector3();
      const rotMat = new THREE.Matrix4();
      const targetQuat = new THREE.Quaternion();

      // Pre-compute orientation frame on the inside of the front glass:
      // Foot sole normal (+Y of snail local space) points INWARD into the water (0, 0, -1)
      const glassInwardNormal = new THREE.Vector3(0, 0, -1);

      function update(time, dt) {
        // --- Update Snail A (Bottom Crawler) ---
        const targetA = snailARoute[snailAWp];
        const toA = new THREE.Vector3(targetA.x - snailAPos.x, 0, targetA.z - snailAPos.z);
        if (toA.length() < 0.08) {
          snailAWp = (snailAWp + 1) % snailARoute.length;
        } else {
          toA.normalize();
          // Avoid crab if crab approaches closely
          const dxC = snailAPos.x - bottomCreaturePositions.crab.x;
          const dzC = snailAPos.z - bottomCreaturePositions.crab.z;
          const dCrab = Math.hypot(dxC, dzC);
          if (dCrab < 0.48 && dCrab > 1e-4) {
            toA.x += (dxC / dCrab) * 1.5;
            toA.z += (dzC / dCrab) * 1.5;
            toA.normalize();
          }

          snailAHeading.lerp(toA, Math.min(1.0, dt * 1.8)).normalize();
          // Very slow, realistic bottom snail glide speed
          const snailASpeed = 0.028;
          snailAPos.x += snailAHeading.x * snailASpeed * dt;
          snailAPos.z += snailAHeading.z * snailASpeed * dt;
        }

        // Sample height & normal including the climbable low foreground stone
        const eps = 0.04;
        const hCenter = getBottomWalkHeight(snailAPos.x, snailAPos.z, true);
        const hX1 = getBottomWalkHeight(snailAPos.x + eps, snailAPos.z, true);
        const hX0 = getBottomWalkHeight(snailAPos.x - eps, snailAPos.z, true);
        const hZ1 = getBottomWalkHeight(snailAPos.x, snailAPos.z + eps, true);
        const hZ0 = getBottomWalkHeight(snailAPos.x, snailAPos.z - eps, true);

        surfNorm.set(-(hX1 - hX0) / (2 * eps), 1.0, -(hZ1 - hZ0) / (2 * eps)).normalize();
        snailAPos.y = hCenter;
        snailA.snailGroup.position.copy(snailAPos);

        // Align Snail A's local +Y with surface normal and local +Z with heading
        rightTangent.crossVectors(surfNorm, snailAHeading).normalize();
        forwardTangent.crossVectors(rightTangent, surfNorm).normalize();
        rotMat.makeBasis(rightTangent, surfNorm, forwardTangent);
        targetQuat.setFromRotationMatrix(rotMat);
        snailA.snailGroup.quaternion.slerp(targetQuat, Math.min(1.0, dt * 6.0));
        snailA.updateAnatomy(time, 0.0);

        // --- Update Snail B (Front Glass Inside Crawler) ---
        // Extremely slow crawl along a diagonal path in the lower-left third of the front glass
        const glassCrawlSpeed = 0.012;
        snailBProgress += (glassCrawlSpeed * dt) * snailBDir;
        if (snailBProgress >= 1.0) {
          snailBProgress = 1.0;
          snailBDir = -1;
        } else if (snailBProgress <= 0.0) {
          snailBProgress = 0.0;
          snailBDir = 1;
        }

        const gx = THREE.MathUtils.lerp(snailBStart.x, snailBEnd.x, snailBProgress);
        const gy = THREE.MathUtils.lerp(snailBStart.y, snailBEnd.y, snailBProgress);
        snailB.snailGroup.position.set(gx, gy, frontGlassInnerZ);

        // Crawl direction along the inner front glass pane
        forwardTangent.set(
          (snailBEnd.x - snailBStart.x) * snailBDir,
          (snailBEnd.y - snailBStart.y) * snailBDir,
          0
        ).normalize();

        // Local +Y is glassInwardNormal (0, 0, -1) so the shell points inward into the water and sole presses against the front glass
        rightTangent.crossVectors(glassInwardNormal, forwardTangent).normalize();
        rotMat.makeBasis(rightTangent, glassInwardNormal, forwardTangent);
        snailB.snailGroup.quaternion.setFromRotationMatrix(rotMat);
        snailB.updateAnatomy(time, 2.4);
      }

      return { snailA, snailB, update };
    }

    const twoSnailsSystem = createTwoSnailsSystem();

    // =========================================================================
    // STAGE 14 — SUSPENDED UNDERWATER PARTICLES (REVEALING DEPTH & CURRENT)
    // =========================================================================
    function createSuspendedParticlesSystem() {
      const count = 68; // Faint, sparse motes so the water remains crystal clear
      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      const rng = createSeededRandom(1414);

      for (let i = 0; i < count; i++) {
        positions[i * 3] = THREE.MathUtils.lerp(TANK.innerMinX + 0.25, TANK.innerMaxX - 0.25, rng());
        positions[i * 3 + 1] = THREE.MathUtils.lerp(0.55, TANK.waterLevel - 0.25, rng());
        positions[i * 3 + 2] = THREE.MathUtils.lerp(TANK.innerMinZ + 0.25, TANK.innerMaxZ - 0.25, rng());
        phases[i] = rng() * Math.PI * 2;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        transparent: true,
        depthWrite: false,
        vertexShader: `
          attribute float aPhase;
          uniform float uTime;
          uniform float uPixelRatio;
          varying float vAlpha;

          void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = clamp((13.0 * uPixelRatio) / -mvPosition.z, 1.5, 4.2);
            vAlpha = 0.16 + 0.12 * sin(uTime * 1.4 + aPhase);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            float soft = smoothstep(0.5, 0.05, d);
            gl_FragColor = vec4(0.75, 0.93, 0.98, vAlpha * soft);
          }
        `
      });

      const points = new THREE.Points(geo, mat);
      points.name = 'SuspendedWaterMotes';
      points.renderOrder = 14;
      scene.add(points);

      const currentVec = new THREE.Vector3();

      function update(time, dt) {
        mat.uniforms.uTime.value = time;
        const posAttr = geo.attributes.position;
        for (let i = 0; i < count; i++) {
          let x = posAttr.getX(i);
          let y = posAttr.getY(i);
          let z = posAttr.getZ(i);

          sampleWaterCurrent(x, y, z, time, currentVec);
          x += currentVec.x * dt * 0.35;
          y += (currentVec.y * 0.25 + Math.sin(time * 0.7 + phases[i]) * 0.015) * dt;
          z += currentVec.z * dt * 0.35;

          // Wrap gently within the water volume
          if (x < TANK.innerMinX + 0.2) x = TANK.innerMaxX - 0.25;
          if (x > TANK.innerMaxX - 0.2) x = TANK.innerMinX + 0.25;
          if (y < 0.52) y = TANK.waterLevel - 0.25;
          if (y > TANK.waterLevel - 0.18) y = 0.58;
          if (z < TANK.innerMinZ + 0.2) z = TANK.innerMaxZ - 0.25;
          if (z > TANK.innerMaxZ - 0.2) z = TANK.innerMinZ + 0.25;

          posAttr.setXYZ(i, x, y, z);
        }
        posAttr.needsUpdate = true;
      }

      return { points, mat, update };
    }

    const suspendedParticlesSystem = createSuspendedParticlesSystem();

    // =========================================================================
    // STAGE 15 & 16 — UI CONTROLS, PAUSE/RESUME, RESIZE & RENDER LOOP
    // =========================================================================
    let isPaused = false;
    let simTime = 0.0;
    let lastFrameTimestamp = performance.now();

    const btnReset = document.getElementById('btn-reset');
    const btnPause = document.getElementById('btn-pause');

    btnReset.addEventListener('click', () => {
      setResponsiveDefaultCamera();
    });

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.textContent = isPaused ? 'Resume' : 'Pause';
      btnPause.classList.toggle('active', isPaused);
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(w, h);
      waterSystem.resize(w, h);
      suspendedParticlesSystem.mat.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
      enforceCameraConstraints();
    });

    // Two-pass rendering:
    // Pass 1 captures the underwater scene (pebbles, castle, plants, fish, filter, bubbles, crab, snails)
    // into the refraction color+depth render target without recursive water surface feedback.
    // Pass 2 renders the full scene with optical surface refraction, waterline meniscus, and glass panels.
    function renderFrame() {
      requestAnimationFrame(renderFrame);

      const now = performance.now();
      let rawDt = (now - lastFrameTimestamp) * 0.001;
      lastFrameTimestamp = now;

      // Clamp large delta times after a hidden tab resumes (Stage Technical Boundaries)
      const dt = Math.min(rawDt, 0.05);

      if (!isPaused) {
        simTime += dt;

        // Update world-space caustic time
        causticUniforms.uCausticTime.value = simTime;

        // Update Stage 3: Bubble plume & surface ripple triggers
        bubblePlumeSystem.update(simTime, dt);

        // Update Stage 2: Animated water surface & meniscus waterline
        waterSystem.update(simTime);

        // Update Stage 6: All four distinct aquatic plants in the shared current
        for (let i = 0; i < plantUpdateCallbacks.length; i++) {
          plantUpdateCallbacks[i](simTime, dt);
        }

        // Update Stage 7-11: Four individually modeled & steered fish
        fishNavigationSystem.update(simTime, dt);

        // Update Stage 12: Articulated bottom-walking crab
        bottomWalkingCrab.update(simTime, dt);

        // Update Stage 13: Bottom snail A and front-glass snail B
        twoSnailsSystem.update(simTime, dt);

        // Update Stage 14: Faint suspended particles
        suspendedParticlesSystem.update(simTime, dt);
      }

      controls.update();

      // Pass 1: Capture scene into refractionRT for water surface optical distortion
      waterSystem.waterSurfaceMesh.visible = false;
      waterSystem.meniscusLine.visible = false;
      aquariumTank.glassPanels.forEach((p) => { p.visible = false; });

      renderer.setRenderTarget(waterSystem.refractionRT);
      renderer.clear();
      renderer.render(scene, camera);

      // Pass 2: Main screen render with refractive water surface & glass panels
      renderer.setRenderTarget(null);
      waterSystem.waterSurfaceMesh.visible = true;
      waterSystem.meniscusLine.visible = true;
      aquariumTank.glassPanels.forEach((p) => { p.visible = true; });

      renderer.render(scene, camera);
    }

    // Run one initial simulation step so all procedural meshes, waterlines, and fins are initialized
    bubblePlumeSystem.update(0.016, 0.016);
    waterSystem.update(0.016);
    plantUpdateCallbacks.forEach((fn) => fn(0.016, 0.016));
    fishNavigationSystem.update(0.016, 0.016);
    bottomWalkingCrab.update(0.016, 0.016);
    twoSnailsSystem.update(0.016, 0.016);
    suspendedParticlesSystem.update(0.016, 0.016);

    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
