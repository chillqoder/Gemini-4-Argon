<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Living Glass Aquarium — Procedural Three.js Experience</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #122938 0%, #091722 58%, #040b11 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e4f1f8;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #ui-overlay {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
      background: rgba(8, 20, 30, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(150, 215, 245, 0.18);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
    }
    .ui-btn {
      appearance: none;
      border: 1px solid rgba(165, 225, 255, 0.22);
      background: rgba(18, 42, 60, 0.65);
      color: #dff2fc;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.1s ease;
    }
    .ui-btn:hover {
      background: rgba(34, 74, 102, 0.82);
      border-color: rgba(190, 235, 255, 0.45);
    }
    .ui-btn:active {
      transform: scale(0.97);
    }
    .ui-btn.active {
      background: rgba(45, 118, 155, 0.85);
      border-color: rgba(200, 242, 255, 0.65);
    }
    @media (max-width: 600px) {
      #ui-overlay {
        bottom: 14px;
        right: 14px;
        padding: 6px 8px;
      }
      .ui-btn {
        font-size: 11.5px;
        padding: 5px 11px;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui-overlay" aria-label="Aquarium Controls">
    <button id="btn-reset" class="ui-btn" type="button">Reset View</button>
    <button id="btn-pause" class="ui-btn" type="button">Pause</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // =========================================================================
    // CONSTANTS & TANK DIMENSIONS
    // =========================================================================
    const TANK = {
      width: 8.0,
      depth: 4.0,
      height: 5.0,
      glassThickness: 0.085,
      waterLevel: 4.55,
      innerMinX: -3.915,
      innerMaxX: 3.915,
      innerMinZ: -1.915,
      innerMaxZ: 1.915,
      bottomY: 0.085
    };

    // =========================================================================
    // PROCEDURAL UTILITIES, PRNG, SUBSTRATE HEIGHT & CURRENT FIELD
    // =========================================================================
    function createSeededRandom(seed = 1337) {
      let s = seed >>> 0;
      return function () {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hash2D(x, y) {
      const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return h - Math.floor(h);
    }

    function valueNoise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const a = hash2D(ix, iy);
      const b = hash2D(ix + 1, iy);
      const c = hash2D(ix, iy + 1);
      const d = hash2D(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y, octaves = 3) {
      let val = 0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        val += amp * valueNoise2D(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return val;
    }

    // Simplified smooth substrate height query for bottom creatures, pebbles, castle, and plants
    function getSubstrateHeight(x, z) {
      // Base height on top of bottom glass
      let h = 0.25;
      // Slight upward slope toward the back (negative Z)
      const backFactor = THREE.MathUtils.clamp((1.8 - z) / 3.6, 0, 1);
      h += backFactor * 0.24;

      // Gentle mound around castle (-0.35, -0.55)
      const dCastle = Math.hypot(x - (-0.35), z - (-0.55));
      h += Math.exp(-dCastle * dCastle * 0.75) * 0.10;

      // Gentle mound around Vallisneria (-3.05, -1.25)
      const dVal = Math.hypot(x - (-3.05), z - (-1.25));
      h += Math.exp(-dVal * dVal * 1.4) * 0.07;

      // Gentle mound around Java Fern (1.45, -1.05)
      const dJava = Math.hypot(x - 1.45, z - (-1.05));
      h += Math.exp(-dJava * dJava * 1.5) * 0.06;

      // Gentle mound around Anubias (-2.15, 0.45)
      const dAnub = Math.hypot(x - (-2.15), z - 0.45);
      h += Math.exp(-dAnub * dAnub * 1.8) * 0.05;

      // Gentle mound around Cabomba (2.25, 0.25)
      const dCab = Math.hypot(x - 2.25, z - 0.25);
      h += Math.exp(-dCab * dCab * 1.6) * 0.05;

      // Smooth organic undulations
      h += Math.sin(x * 0.85 + 0.4) * Math.cos(z * 1.15 - 0.2) * 0.035;
      h += Math.sin(x * 1.9 - z * 1.4) * 0.018;
      return h;
    }

    function getSubstrateNormal(x, z, target = new THREE.Vector3()) {
      const eps = 0.06;
      const hx1 = getSubstrateHeight(x + eps, z);
      const hx0 = getSubstrateHeight(x - eps, z);
      const hz1 = getSubstrateHeight(x, z + eps);
      const hz0 = getSubstrateHeight(x, z - eps);
      target.set(-(hx1 - hx0) / (2 * eps), 1.0, -(hz1 - hz0) / (2 * eps)).normalize();
      return target;
    }

    // Shared spatial water current field (Stage 2)
    // Used by bubbles, plants, suspended particles, and trailing fins
    const FILTER_OUTLET_POS = new THREE.Vector3(3.12, 1.88, -1.32);

    function sampleWaterCurrent(x, y, z, time, out = new THREE.Vector3()) {
      // Gentle tank-wide circulation loop driven by filter airlift on back-right
      const swirlX = Math.sin(y * 0.65 - time * 0.75 + z * 0.4) * 0.16
                   - Math.cos(x * 0.35 + time * 0.42) * 0.08;
      const swirlY = Math.sin(x * 0.5 + z * 0.6 - time * 0.55) * 0.04;
      const swirlZ = Math.cos(x * 0.45 + time * 0.62 - y * 0.3) * 0.11;

      // Localized upward and outward flow near the bubble plume (back-right)
      const dx = x - FILTER_OUTLET_POS.x;
      const dz = z - FILTER_OUTLET_POS.z;
      const distHorizSq = dx * dx + dz * dz;
      const plumeRadius = 0.55 + Math.max(0, y - FILTER_OUTLET_POS.y) * 0.14;
      const plumeInfluence = (y >= FILTER_OUTLET_POS.y - 0.2)
        ? Math.exp(-distHorizSq / (plumeRadius * plumeRadius))
        : 0.0;

      const upwardFlow = plumeInfluence * 0.55;
      // Near top of plume, water diverges leftward across the upper tank
      const surfaceSpread = plumeInfluence * THREE.MathUtils.smoothstep(y, 3.4, 4.5) * -0.28;

      out.set(
        swirlX + surfaceSpread,
        swirlY + upwardFlow,
        swirlZ + plumeInfluence * 0.06
      );
      return out;
    }

    // =========================================================================
    // WORLD-SPACE CAUSTICS & DEPTH ABSORPTION SHADER INJECTION (STAGE 14)
    // =========================================================================
    const causticUniforms = {
      uCausticTime: { value: 0 },
      uWaterLevel: { value: TANK.waterLevel }
    };

    const CAUSTIC_NOISE_GLSL = `
      uniform float uCausticTime;
      uniform float uWaterLevel;

      vec2 causticHash2(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
        return fract(sin(p) * 43758.5453);
      }

      // Delicate cellular caustic pattern derived from wave-coherent phase
      float causticPattern(vec2 uv, float t) {
        vec2 n = floor(uv);
        vec2 f = fract(uv);
        float md = 8.0;
        float md2 = 8.0;
        for (int j = -1; j <= 1; j++) {
          for (int i = -1; i <= 1; i++) {
            vec2 g = vec2(float(i), float(j));
            vec2 o = causticHash2(n + g);
            o = 0.5 + 0.42 * sin(t * 1.15 + 6.2831 * o);
            vec2 r = g + o - f;
            float d = dot(r, r);
            if (d < md) {
              md2 = md;
              md = d;
            } else if (d < md2) {
              md2 = d;
            }
          }
        }
        float edge = clamp(1.0 - (sqrt(md2) - sqrt(md)) * 2.35, 0.0, 1.0);
        return pow(edge, 2.6);
      }

      float computeUnderwaterCaustics(vec3 worldPos, vec3 worldNormal) {
        if (worldPos.y > uWaterLevel + 0.02 || abs(worldPos.x) > 3.96 || abs(worldPos.z) > 1.96) {
          return 0.0;
        }
        float depth = max(0.0, uWaterLevel - worldPos.y);
        // Project slightly angled from overhead aquarium light
        vec2 p = worldPos.xz * 1.55 + vec2(worldPos.y * 0.14, -worldPos.y * 0.09);
        // Wave distortion coherent with surface wave directions
        vec2 waveShift = vec2(
          sin(worldPos.x * 1.8 + worldPos.z * 0.7 + uCausticTime * 1.65) * 0.12,
          cos(worldPos.z * 2.1 - worldPos.x * 0.8 + uCausticTime * 1.35) * 0.12
        );
        float c1 = causticPattern((p + waveShift) * 0.95, uCausticTime);
        float c2 = causticPattern((p * 1.32 - waveShift * 0.7 + vec2(2.7, -1.4)), uCausticTime * 0.85);
        float c = (c1 * 0.62 + c2 * 0.48);
        float upFacing = smoothstep(-0.15, 0.85, worldNormal.y);
        float depthFade = exp(-depth * 0.16) * smoothstep(0.02, 0.28, depth);
        // Wall proximity fade
        float boundsFade = smoothstep(3.96, 3.65, abs(worldPos.x)) * smoothstep(1.96, 1.72, abs(worldPos.z));
        return c * upFacing * depthFade * boundsFade;
      }
    `;

    let customShaderIdCounter = 1;
    function applyUnderwaterCaustics(material, intensity = 0.28, extraFragmentChunk = '') {
      const uniqueKey = `uw_caustics_${customShaderIdCounter++}_${intensity.toFixed(3)}`;
      material.customProgramCacheKey = () => uniqueKey;

      material.onBeforeCompile = (shader) => {
        shader.uniforms.uCausticTime = causticUniforms.uCausticTime;
        shader.uniforms.uWaterLevel = causticUniforms.uWaterLevel;

        shader.vertexShader = `
          varying vec3 vUwWorldPos;
          varying vec3 vUwWorldNormal;
        ` + shader.vertexShader.replace(
          '#include <worldpos_vertex>',
          `#include <worldpos_vertex>
           vec4 uwWp = vec4( transformed, 1.0 );
           #ifdef USE_INSTANCING
             uwWp = instanceMatrix * uwWp;
           #endif
           uwWp = modelMatrix * uwWp;
           vUwWorldPos = uwWp.xyz;
           mat3 uwNMat = mat3( modelMatrix );
           #ifdef USE_INSTANCING
             uwNMat = uwNMat * mat3( instanceMatrix );
           #endif
           vUwWorldNormal = normalize( uwNMat * objectNormal );
          `
        );

        shader.fragmentShader = `
          varying vec3 vUwWorldPos;
          varying vec3 vUwWorldNormal;
          ${CAUSTIC_NOISE_GLSL}
        ` + shader.fragmentShader.replace(
          '#include <tonemapping_fragment>',
          `
          ${extraFragmentChunk}
          float cLight = computeUnderwaterCaustics(vUwWorldPos, normalize(vUwWorldNormal));
          gl_FragColor.rgb += vec3(0.55, 0.85, 0.98) * cLight * ${intensity.toFixed(3)};
          // Subtle depth-dependent cool water absorption
          float camDist = length(cameraPosition - vUwWorldPos);
          float uwDepth = clamp((uWaterLevel - vUwWorldPos.y) / 4.6, 0.0, 1.0);
          float absorb = clamp((camDist - 5.5) * 0.030 + uwDepth * 0.065, 0.0, 0.20);
          gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.05, 0.19, 0.28), absorb);
          #include <tonemapping_fragment>
          `
        );
      };
      return material;
    }

    // =========================================================================
    // STAGE 1 — CONSTRUCT THE AQUARIUM AND ESTABLISH THE COMPOSITION
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Generate calm studio backdrop texture (deep navy-to-teal gradient)
    function createStudioBackgroundTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(256, 190, 30, 256, 256, 360);
      grad.addColorStop(0.0, '#163447');
      grad.addColorStop(0.48, '#0c202e');
      grad.addColorStop(1.0, '#050d14');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    scene.background = createStudioBackgroundTexture();

    // Procedural environment map for crisp glass and eye reflections
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnv = new RoomEnvironment();
    const envMap = pmremGenerator.fromScene(roomEnv, 0.04).texture;
    scene.environment = envMap;
    roomEnv.dispose();

    // Perspective camera framed in a slightly elevated three-quarter front view
    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      80
    );

    const DEFAULT_CAMERA_POS = new THREE.Vector3(6.8, 5.15, 9.65);
    const DEFAULT_CAMERA_TARGET = new THREE.Vector3(0.0, 2.25, 0.0);

    function setResponsiveDefaultCamera() {
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);
      const scale = aspect < 1.15 ? THREE.MathUtils.clamp(1.22 / Math.max(0.55, aspect), 1.0, 1.65) : 1.0;
      camera.position.copy(DEFAULT_CAMERA_POS).multiplyScalar(scale);
      controls.target.copy(DEFAULT_CAMERA_TARGET);
      controls.update();
    }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 6.2;
    controls.maxDistance = 22.0;
    controls.minPolarAngle = 0.14;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.target.copy(DEFAULT_CAMERA_TARGET);

    // Keep camera strictly outside the tank and pedestal at all times
    function enforceCameraConstraints() {
      controls.target.x = THREE.MathUtils.clamp(controls.target.x, -2.5, 2.5);
      controls.target.y = THREE.MathUtils.clamp(controls.target.y, 1.0, 3.8);
      controls.target.z = THREE.MathUtils.clamp(controls.target.z, -1.2, 1.2);

      // Prevent camera from entering tank + margin box
      const marginX = 4.65;
      const marginY = 5.45;
      const marginZ = 2.65;
      const pos = camera.position;
      if (Math.abs(pos.x) < marginX && pos.y < marginY && Math.abs(pos.z) < marginZ) {
        const dx = marginX - Math.abs(pos.x);
        const dy = marginY - pos.y;
        const dz = marginZ - Math.abs(pos.z);
        if (dx <= dy && dx <= dz) {
          pos.x = Math.sign(pos.x || 1) * marginX;
        } else if (dz <= dx && dz <= dy) {
          pos.z = Math.sign(pos.z || 1) * marginZ;
        } else {
          pos.y = marginY;
        }
      }
      if (pos.y < 0.35) pos.y = 0.35;
    }
    controls.addEventListener('change', enforceCameraConstraints);
    setResponsiveDefaultCamera();

    // Believable aquarium lighting above the water (Stage 1 & Stage 14)
    function setupLighting() {
      const lightGroup = new THREE.Group();
      lightGroup.name = 'AquariumLighting';

      const hemiLight = new THREE.HemisphereLight(0xb8ecff, 0x162d3a, 0.82);
      hemiLight.position.set(0, 9.0, 0);
      lightGroup.add(hemiLight);

      // Soft bright overhead aquarium key light
      const keyLight = new THREE.DirectionalLight(0xfffaf0, 2.35);
      keyLight.position.set(1.1, 9.2, 1.6);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 2.0;
      keyLight.shadow.camera.far = 14.0;
      const d = 4.6;
      keyLight.shadow.camera.left = -d;
      keyLight.shadow.camera.right = d;
      keyLight.shadow.camera.top = d * 0.65;
      keyLight.shadow.camera.bottom = -d * 0.65;
      keyLight.shadow.bias = -0.0005;
      keyLight.shadow.normalBias = 0.018;
      lightGroup.add(keyLight);

      // Restrained cool fill light
      const coolFill = new THREE.DirectionalLight(0x64b8e6, 0.68);
      coolFill.position.set(-4.5, 5.8, -3.5);
      lightGroup.add(coolFill);

      // Subtle front-left viewing fill so foreground creatures stay rich and readable
      const frontFill = new THREE.DirectionalLight(0xd9f2ff, 0.42);
      frontFill.position.set(-2.5, 3.2, 6.2);
      lightGroup.add(frontFill);

      scene.add(lightGroup);
      return lightGroup;
    }
    setupLighting();

    // Construct the glass aquarium, frame, and pedestal (Stage 1)
    function createAquariumTank() {
      const tankGroup = new THREE.Group();
      tankGroup.name = 'GlassAquarium';

      const W = TANK.width;
      const D = TANK.depth;
      const H = TANK.height;
      const t = TANK.glassThickness;

      // Physically based low-iron aquarium glass material for the 5 panes
      // Low normal-incidence opacity so inhabitants remain vivid and crystal clear (no milky overlay)
      const paneMaterial = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0xd8f6ff),
        metalness: 0.0,
        roughness: 0.025,
        ior: 1.5,
        reflectivity: 0.65,
        clearcoat: 1.0,
        clearcoatRoughness: 0.03,
        transparent: true,
        opacity: 0.055,
        envMapIntensity: 1.45,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      // Richer emerald-green glass edge material for visible wall thickness and bevel highlights
      const edgeGlassMaterial = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0x52b89a),
        emissive: new THREE.Color(0x0b3327),
        emissiveIntensity: 0.42,
        metalness: 0.0,
        roughness: 0.06,
        ior: 1.52,
        transparent: true,
        opacity: 0.68,
        depthWrite: false
      });

      // Silicone seam material between panes
      const seamMaterial = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0x88b5aa),
        roughness: 0.35,
        metalness: 0.05,
        transparent: true,
        opacity: 0.55,
        depthWrite: false
      });

      function makeGlassPanel(name, pw, ph, pd, x, y, z) {
        const panelGroup = new THREE.Group();
        panelGroup.name = name;
        panelGroup.position.set(x, y, z);

        // Multi-material box: thinner edge faces get the green glass edge material
        const geo = new THREE.BoxGeometry(pw, ph, pd);
        // BoxGeometry face order: +x, -x, +y, -y, +z, -z
        const isFrontBack = pd < pw && pd < ph;
        const isLeftRight = pw < pd && pw < ph;
        const materials = [
          isLeftRight ? paneMaterial : edgeGlassMaterial,
          isLeftRight ? paneMaterial : edgeGlassMaterial,
          edgeGlassMaterial,
          edgeGlassMaterial,
          isFrontBack ? paneMaterial : edgeGlassMaterial,
          isFrontBack ? paneMaterial : edgeGlassMaterial
        ];
        const mesh = new THREE.Mesh(geo, materials);
        mesh.renderOrder = 30;
        panelGroup.add(mesh);

        // Crisp subtle edge highlight line
        const edgesGeo = new THREE.EdgesGeometry(geo);
        const edgesMat = new THREE.LineBasicMaterial({
          color: 0xbef5e6,
          transparent: true,
          opacity: 0.32
        });
        const line = new THREE.LineSegments(edgesGeo, edgesMat);
        line.renderOrder = 31;
        panelGroup.add(line);

        return panelGroup;
      }

      // 5 Glass Panels: Bottom, Front, Back, Left, Right (Open Top)
      const bottomPanel = makeGlassPanel('BottomGlass', W, t, D, 0, t * 0.5, 0);
      const frontPanel = makeGlassPanel('FrontGlass', W, H - t, t, 0, t + (H - t) * 0.5, D * 0.5 - t * 0.5);
      const backPanel = makeGlassPanel('BackGlass', W, H - t, t, 0, t + (H - t) * 0.5, -D * 0.5 + t * 0.5);
      const leftPanel = makeGlassPanel('LeftGlass', t, H - t, D - 2 * t, -W * 0.5 + t * 0.5, t + (H - t) * 0.5, 0);
      const rightPanel = makeGlassPanel('RightGlass', t, H - t, D - 2 * t, W * 0.5 - t * 0.5, t + (H - t) * 0.5, 0);

      tankGroup.add(bottomPanel, frontPanel, backPanel, leftPanel, rightPanel);

      // Vertical silicone seams at the four inner corners
      const seamGeo = new THREE.BoxGeometry(0.022, H - t, 0.022);
      const seamPositions = [
        [-W * 0.5 + t, t + (H - t) * 0.5, D * 0.5 - t],
        [W * 0.5 - t, t + (H - t) * 0.5, D * 0.5 - t],
        [-W * 0.5 + t, t + (H - t) * 0.5, -D * 0.5 + t],
        [W * 0.5 - t, t + (H - t) * 0.5, -D * 0.5 + t]
      ];
      seamPositions.forEach(([sx, sy, sz]) => {
        const seam = new THREE.Mesh(seamGeo, seamMaterial);
        seam.position.set(sx, sy, sz);
        seam.renderOrder = 29;
        tankGroup.add(seam);
      });

      // Matte-black bottom frame & narrow upper rim
      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x14181c,
        roughness: 0.62,
        metalness: 0.18
      });

      function createRectFrame(yCenter, frameHeight, thicknessOut, insetIn) {
        const fg = new THREE.Group();
        const outerW = W + thicknessOut * 2;
        const outerD = D + thicknessOut * 2;
        const barThick = thicknessOut + insetIn;

        const frontBar = new THREE.Mesh(new THREE.BoxGeometry(outerW, frameHeight, barThick), frameMaterial);
        frontBar.position.set(0, yCenter, D * 0.5 + thicknessOut - barThick * 0.5);

        const backBar = new THREE.Mesh(new THREE.BoxGeometry(outerW, frameHeight, barThick), frameMaterial);
        backBar.position.set(0, yCenter, -D * 0.5 - thicknessOut + barThick * 0.5);

        const leftBar = new THREE.Mesh(new THREE.BoxGeometry(barThick, frameHeight, outerD - barThick * 2), frameMaterial);
        leftBar.position.set(-W * 0.5 - thicknessOut + barThick * 0.5, yCenter, 0);

        const rightBar = new THREE.Mesh(new THREE.BoxGeometry(barThick, frameHeight, outerD - barThick * 2), frameMaterial);
        rightBar.position.set(W * 0.5 + thicknessOut - barThick * 0.5, yCenter, 0);

        [frontBar, backBar, leftBar, rightBar].forEach((m) => {
          m.castShadow = true;
          m.receiveShadow = true;
          fg.add(m);
        });
        return fg;
      }

      // Restrained matte-black bottom frame
      const bottomFrame = createRectFrame(0.08, 0.19, 0.045, 0.04);
      bottomFrame.name = 'BottomFrame';
      tankGroup.add(bottomFrame);

      // Narrow upper rim (keeps top open)
      const upperRim = createRectFrame(H - 0.04, 0.095, 0.035, 0.03);
      upperRim.name = 'UpperRim';
      tankGroup.add(upperRim);

      // Dark leveling mat & simple dark architectural pedestal below Y = 0
      const pedestalGroup = new THREE.Group();
      pedestalGroup.name = 'AquariumPedestal';

      const matMesh = new THREE.Mesh(
        new THREE.BoxGeometry(W + 0.14, 0.06, D + 0.14),
        new THREE.MeshStandardMaterial({ color: 0x0d1014, roughness: 0.85, metalness: 0.05 })
      );
      matMesh.position.set(0, -0.04, 0);
      matMesh.receiveShadow = true;
      pedestalGroup.add(matMesh);

      const plinthTop = new THREE.Mesh(
        new THREE.BoxGeometry(W + 0.46, 0.22, D + 0.46),
        new THREE.MeshStandardMaterial({ color: 0x121920, roughness: 0.52, metalness: 0.15 })
      );
      plinthTop.position.set(0, -0.18, 0);
      plinthTop.receiveShadow = true;
      plinthTop.castShadow = true;
      pedestalGroup.add(plinthTop);

      const cabinetBody = new THREE.Mesh(
        new THREE.BoxGeometry(W + 0.22, 1.85, D + 0.22),
        new THREE.MeshStandardMaterial({ color: 0x0c1218, roughness: 0.68, metalness: 0.12 })
      );
      cabinetBody.position.set(0, -1.21, 0);
      cabinetBody.receiveShadow = true;
      cabinetBody.castShadow = true;
      pedestalGroup.add(cabinetBody);

      // Soft contact shadow plane under the tank & pedestal
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 256;
      shadowCanvas.height = 256;
      const sctx = shadowCanvas.getContext('2d');
      const sgrad = sctx.createRadialGradient(128, 128, 25, 128, 128, 124);
      sgrad.addColorStop(0.0, 'rgba(0, 0, 0, 0.68)');
      sgrad.addColorStop(0.65, 'rgba(0, 0, 0, 0.28)');
      sgrad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
      sctx.fillStyle = sgrad;
      sctx.fillRect(0, 0, 256, 256);
      const shadowTex = new THREE.CanvasTexture(shadowCanvas);

      const contactShadow = new THREE.Mesh(
        new THREE.PlaneGeometry(W * 1.65, D * 1.85),
        new THREE.MeshBasicMaterial({
          map: shadowTex,
          transparent: true,
          depthWrite: false
        })
      );
      contactShadow.rotation.x = -Math.PI * 0.5;
      contactShadow.position.set(0, -2.13, 0);
      pedestalGroup.add(contactShadow);

      tankGroup.add(pedestalGroup);
      scene.add(tankGroup);

      return { tankGroup, glassPanels: [bottomPanel, frontPanel, backPanel, leftPanel, rightPanel] };
    }

    const aquariumTank = createAquariumTank();

    // =========================================================================
    // STAGE 2 — WATER, SURFACE MOVEMENT, RIPPLE RINGS & OPTICAL REFRACTION
    // =========================================================================
    const MAX_RIPPLES = 16;
    const ripplePool = [];
    for (let i = 0; i < MAX_RIPPLES; i++) {
      ripplePool.push(new THREE.Vector4(0, 0, -100, 0)); // (x, z, birthTime, strength)
    }
    let nextRippleIdx = 0;

    function spawnSurfaceRipple(x, z, time, strength = 1.0) {
      // Aggregate if a very recent ripple is already right next to this bubble arrival
      for (let i = 0; i < MAX_RIPPLES; i++) {
        const r = ripplePool[i];
        const age = time - r.z;
        if (age >= 0 && age < 0.22) {
          const distSq = (r.x - x) * (r.x - x) + (r.y - z) * (r.y - z);
          if (distSq < 0.045) {
            r.w = Math.min(1.6, r.w + strength * 0.35);
            return;
          }
        }
      }
      ripplePool[nextRippleIdx].set(x, z, time, strength);
      nextRippleIdx = (nextRippleIdx + 1) % MAX_RIPPLES;
    }

    // Exact wave evaluation on CPU so bubble arrival detection and waterline match the GPU shader
    function evaluateWaterSurfaceHeight(x, z, time) {
      let h = TANK.waterLevel;
      // 6 directional small waves with restrained indoor aquarium amplitudes
      h += Math.sin(x * 1.45 + z * 0.55 + time * 1.85) * 0.014;
      h += Math.sin(x * -0.95 + z * 1.75 + time * 1.52 + 1.1) * 0.011;
      h += Math.sin(x * 2.35 - z * 1.25 + time * 2.40 + 2.4) * 0.0065;
      h += Math.sin(x * 0.65 + z * 2.65 - time * 1.95 + 0.7) * 0.0055;
      h += Math.sin(x * 3.60 + z * 2.10 + time * 3.10) * 0.0032;
      h += Math.cos(x * 2.80 - z * 3.40 - time * 2.75) * 0.0028;

      // Subtle steady dome lift above the filter bubble plume
      const dxP = x - FILTER_OUTLET_POS.x;
      const dzP = z - FILTER_OUTLET_POS.z;
      const dPlume = Math.sqrt(dxP * dxP + dzP * dzP);
      h += Math.exp(-dPlume * dPlume * 6.5) * (0.012 + 0.004 * Math.sin(time * 6.0));

      return h;
    }

    function createWaterSystem() {
      const waterGroup = new THREE.Group();
      waterGroup.name = 'WaterBody';

      const innerW = TANK.innerMaxX - TANK.innerMinX;
      const innerD = TANK.innerMaxZ - TANK.innerMinZ;

      // Offscreen scene color + depth target for true optical refraction (Stage 2)
      const rtScale = 0.75;
      const refractionRT = new THREE.WebGLRenderTarget(
        Math.max(256, Math.floor(window.innerWidth * Math.min(window.devicePixelRatio, 2) * rtScale)),
        Math.max(256, Math.floor(window.innerHeight * Math.min(window.devicePixelRatio, 2) * rtScale)),
        {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat
        }
      );
      refractionRT.depthTexture = new THREE.DepthTexture();
      refractionRT.depthTexture.type = THREE.UnsignedIntType;

      const waterUniforms = {
        uTime: { value: 0 },
        uSceneTex: { value: refractionRT.texture },
        uDepthTex: { value: refractionRT.depthTexture },
        uResolution: { value: new THREE.Vector2(refractionRT.width, refractionRT.height) },
        uCameraNear: { value: camera.near },
        uCameraFar: { value: camera.far },
        uRipples: { value: ripplePool },
        uPlumeXZ: { value: new THREE.Vector2(FILTER_OUTLET_POS.x, FILTER_OUTLET_POS.z) },
        uInnerHalfSize: { value: new THREE.Vector2(innerW * 0.5, innerD * 0.5) }
      };

      const waterSurfaceGeo = new THREE.PlaneGeometry(innerW, innerD, 140, 70);
      waterSurfaceGeo.rotateX(-Math.PI * 0.5);

      const waterSurfaceMat = new THREE.ShaderMaterial({
        uniforms: waterUniforms,
        transparent: false,
        side: THREE.DoubleSide,
        vertexShader: `
          uniform float uTime;
          uniform vec4 uRipples[${MAX_RIPPLES}];
          uniform vec2 uPlumeXZ;
          uniform vec2 uInnerHalfSize;

          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          varying vec4 vClipPos;
          varying float vMeniscus;

          float evalWaveDisplacement(vec2 p, float t) {
            float h = 0.0;
            h += sin(p.x * 1.45 + p.y * 0.55 + t * 1.85) * 0.014;
            h += sin(p.x * -0.95 + p.y * 1.75 + t * 1.52 + 1.1) * 0.011;
            h += sin(p.x * 2.35 - p.y * 1.25 + t * 2.40 + 2.4) * 0.0065;
            h += sin(p.x * 0.65 + p.y * 2.65 - t * 1.95 + 0.7) * 0.0055;
            h += sin(p.x * 3.60 + p.y * 2.10 + t * 3.10) * 0.0032;
            h += cos(p.x * 2.80 - p.y * 3.40 - t * 2.75) * 0.0028;

            // Localized agitation above bubble plume
            float dPlume = length(p - uPlumeXZ);
            h += exp(-dPlume * dPlume * 6.5) * (0.012 + 0.004 * sin(t * 6.0));

            // Expanding, fading ripple rings triggered by bubbles reaching the surface
            for (int i = 0; i < ${MAX_RIPPLES}; i++) {
              vec4 rip = uRipples[i];
              float age = t - rip.z;
              if (age > 0.0 && age < 2.2) {
                float dist = length(p - rip.xy);
                float radius = age * 0.72;
                float band = exp(-pow((dist - radius) * 7.5, 2.0));
                float fade = exp(-age * 1.85) * rip.w;
                h += sin((dist - radius) * 26.0) * band * fade * 0.011;
              }
            }

            // Subtle meniscus rise along the inner glass walls
            float dx = uInnerHalfSize.x - abs(p.x);
            float dz = uInnerHalfSize.y - abs(p.y);
            float edgeDist = min(dx, dz);
            float meniscus = exp(-edgeDist * 26.0) * 0.018;
            return h + meniscus;
          }

          void main() {
            vec3 pos = position;
            vec2 xz = pos.xz;
            float eps = 0.025;
            float hC = evalWaveDisplacement(xz, uTime);
            float hX = evalWaveDisplacement(xz + vec2(eps, 0.0), uTime);
            float hZ = evalWaveDisplacement(xz + vec2(0.0, eps), uTime);

            pos.y += hC;
            vec3 n = normalize(vec3(-(hX - hC) / eps, 1.0, -(hZ - hC) / eps));

            float dx = uInnerHalfSize.x - abs(xz.x);
            float dz = uInnerHalfSize.y - abs(xz.y);
            vMeniscus = exp(-min(dx, dz) * 20.0);

            vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
            vWorldPos = worldPosition.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * n);
            vClipPos = projectionMatrix * viewMatrix * worldPosition;
            gl_Position = vClipPos;
          }
        `,
        fragmentShader: `
          #include <packing>
          uniform float uTime;
          uniform sampler2D uSceneTex;
          uniform sampler2D uDepthTex;
          uniform vec2 uResolution;
          uniform float uCameraNear;
          uniform float uCameraFar;

          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          varying vec4 vClipPos;
          varying float vMeniscus;

          float getLinearDepth(float fragCoordZ) {
            float viewZ = perspectiveDepthToViewZ(fragCoordZ, uCameraNear, uCameraFar);
            return viewZToOrthographicDepth(viewZ, uCameraNear, uCameraFar);
          }

          void main() {
            vec2 screenUV = (vClipPos.xy / vClipPos.w) * 0.5 + 0.5;
            vec3 N = normalize(vWorldNormal);
            vec3 V = normalize(cameraPosition - vWorldPos);
            if (!gl_FrontFacing) N = -N;

            // Fine micro-ripples for crisp normal perturbation
            vec2 micro = vec2(
              sin(vWorldPos.x * 7.5 + uTime * 2.6) * cos(vWorldPos.z * 6.5 - uTime * 2.1),
              cos(vWorldPos.x * 6.2 - uTime * 2.3) * sin(vWorldPos.z * 8.1 + uTime * 2.8)
            ) * 0.025;
            N = normalize(N + vec3(micro.x, 0.0, micro.y));

            // Water IOR ~ 1.333 refraction offset driven by surface wave slope
            vec2 refractOffset = N.xz * 0.068;
            // Attenuate distortion right at screen borders to prevent edge clamping artifacts
            vec2 edgeGuard = smoothstep(0.02, 0.12, screenUV) * (1.0 - smoothstep(0.88, 0.98, screenUV));
            refractOffset *= edgeGuard.x * edgeGuard.y;

            vec2 refrUV = clamp(screenUV + refractOffset, 0.002, 0.998);

            // Prevent foreground objects above the water surface from bleeding into refraction
            float surfaceDepth = getLinearDepth(gl_FragCoord.z);
            float sampleRawDepth = texture2D(uDepthTex, refrUV).x;
            float sampleDepth = getLinearDepth(sampleRawDepth);
            if (sampleDepth < surfaceDepth - 0.001) {
              refrUV = screenUV;
              sampleRawDepth = texture2D(uDepthTex, refrUV).x;
              sampleDepth = getLinearDepth(sampleRawDepth);
            }

            // Subtle chromatic dispersion across the refracted water surface
            vec3 refractedColor;
            refractedColor.r = texture2D(uSceneTex, clamp(refrUV + refractOffset * 0.08, 0.002, 0.998)).r;
            refractedColor.g = texture2D(uSceneTex, refrUV).g;
            refractedColor.b = texture2D(uSceneTex, clamp(refrUV - refractOffset * 0.08, 0.002, 0.998)).b;

            // Depth-dependent water absorption (vivid near surface, faint cool tint over longer paths)
            float waterPath = clamp((sampleDepth - surfaceDepth) * 16.0, 0.0, 1.0);
            vec3 absorptionTint = vec3(0.76, 0.93, 0.98);
            vec3 deepTint = vec3(0.09, 0.29, 0.39);
            refractedColor *= mix(vec3(1.0), absorptionTint, waterPath * 0.45);
            refractedColor = mix(refractedColor, deepTint, waterPath * 0.22);

            // Angle-dependent Fresnel reflection (IOR 1.333 -> F0 = 0.02)
            float cosTheta = clamp(dot(N, V), 0.0, 1.0);
            float fresnel = 0.02 + 0.98 * pow(1.0 - cosTheta, 4.2);

            // Studio & overhead aquarium light reflection
            vec3 R = reflect(-V, N);
            float skyFactor = clamp(R.y * 0.5 + 0.5, 0.0, 1.0);
            vec3 envReflection = mix(vec3(0.04, 0.12, 0.19), vec3(0.32, 0.58, 0.74), pow(skyFactor, 1.6));

            // Overhead light bar reflection on ripples
            vec3 lightDir = normalize(vec3(0.18, 0.96, 0.22));
            float spec = pow(max(dot(N, normalize(lightDir + V)), 0.0), 160.0) * 0.65;
            float softSpec = pow(max(dot(N, normalize(vec3(-0.2, 0.95, -0.1) + V)), 0.0), 48.0) * 0.12;

            vec3 finalColor = mix(refractedColor, envReflection, fresnel * 0.62) + vec3(0.95, 0.99, 1.0) * (spec + softSpec);

            // Bright meniscus highlight along the glass waterline
            finalColor += vec3(0.45, 0.78, 0.92) * vMeniscus * 0.22;

            gl_FragColor = vec4(finalColor, 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `
      });

      const waterSurfaceMesh = new THREE.Mesh(waterSurfaceGeo, waterSurfaceMat);
      waterSurfaceMesh.position.set(0, TANK.waterLevel, 0);
      waterSurfaceMesh.name = 'AnimatedWaterSurface';
      waterSurfaceMesh.renderOrder = 15;
      waterGroup.add(waterSurfaceMesh);

      // Animated waterline & meniscus ribbon around the 4 inner walls
      const meniscusSegmentsX = 96;
      const meniscusSegmentsZ = 48;
      const meniscusPositions = [];
      const totalPerimeterPts = (meniscusSegmentsX + meniscusSegmentsZ) * 2;
      for (let i = 0; i <= totalPerimeterPts; i++) {
        meniscusPositions.push(0, TANK.waterLevel, 0);
      }
      const meniscusGeo = new THREE.BufferGeometry();
      meniscusGeo.setAttribute('position', new THREE.Float32BufferAttribute(meniscusPositions, 3));
      const meniscusMat = new THREE.LineBasicMaterial({
        color: 0xbaf2ff,
        transparent: true,
        opacity: 0.72
      });
      const meniscusLine = new THREE.Line(meniscusGeo, meniscusMat);
      meniscusLine.name = 'WaterlineMeniscus';
      meniscusLine.renderOrder = 26;
      waterGroup.add(meniscusLine);

      function updateWaterlineRibbon(time) {
        const posAttr = meniscusGeo.attributes.position;
        let idx = 0;
        const xMin = TANK.innerMinX + 0.005;
        const xMax = TANK.innerMaxX - 0.005;
        const zMin = TANK.innerMinZ + 0.005;
        const zMax = TANK.innerMaxZ - 0.005;

        for (let i = 0; i < meniscusSegmentsX; i++) {
          const u = i / meniscusSegmentsX;
          const x = THREE.MathUtils.lerp(xMin, xMax, u);
          posAttr.setXYZ(idx++, x, evaluateWaterSurfaceHeight(x, zMax, time) + 0.012, zMax);
        }
        for (let i = 0; i < meniscusSegmentsZ; i++) {
          const u = i / meniscusSegmentsZ;
          const z = THREE.MathUtils.lerp(zMax, zMin, u);
          posAttr.setXYZ(idx++, xMax, evaluateWaterSurfaceHeight(xMax, z, time) + 0.012, z);
        }
        for (let i = 0; i < meniscusSegmentsX; i++) {
          const u = i / meniscusSegmentsX;
          const x = THREE.MathUtils.lerp(xMax, xMin, u);
          posAttr.setXYZ(idx++, x, evaluateWaterSurfaceHeight(x, zMin, time) + 0.012, zMin);
        }
        for (let i = 0; i <= meniscusSegmentsZ; i++) {
          const u = i / meniscusSegmentsZ;
          const z = THREE.MathUtils.lerp(zMin, zMax, u);
          posAttr.setXYZ(idx++, xMin, evaluateWaterSurfaceHeight(xMin, z, time) + 0.012, z);
        }
        posAttr.needsUpdate = true;
      }

      // Subtle side water volume tint & view-dependent glass/water vertical refraction feel
      const sideWaterGeo = new THREE.BoxGeometry(innerW - 0.01, TANK.waterLevel - TANK.bottomY, innerD - 0.01);
      const sideWaterMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0x1b6e8c),
        transparent: true,
        opacity: 0.028,
        roughness: 0.08,
        ior: 1.333,
        depthWrite: false,
        side: THREE.BackSide
      });
      const sideWaterMesh = new THREE.Mesh(sideWaterGeo, sideWaterMat);
      sideWaterMesh.position.set(0, TANK.bottomY + (TANK.waterLevel - TANK.bottomY) * 0.5, 0);
      sideWaterMesh.renderOrder = 1;
      waterGroup.add(sideWaterMesh);

      scene.add(waterGroup);

      return {
        waterGroup,
        waterSurfaceMesh,
        sideWaterMesh,
        meniscusLine,
        refractionRT,
        waterUniforms,
        update(time) {
          waterUniforms.uTime.value = time;
          updateWaterlineRibbon(time);
        },
        resize(width, height) {
          const dpr = Math.min(window.devicePixelRatio, 2);
          const rw = Math.max(256, Math.floor(width * dpr * rtScale));
          const rh = Math.max(256, Math.floor(height * dpr * rtScale));
          refractionRT.setSize(rw, rh);
          waterUniforms.uResolution.value.set(rw, rh);
        }
      };
    }

    const waterSystem = createWaterSystem();

    // =========================================================================
    // STAGE 3 — MODEL THE BLACK FILTER AND ANIMATE ITS BUBBLE PLUME
    // =========================================================================
    function createPorousSpongeBumpTexture() {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(size, size);
      const rng = createSeededRandom(409);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.floor(40 + rng() * 185);
        img.data[i] = v;
        img.data[i + 1] = v;
        img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 6);
      return tex;
    }

    function createBubbleFilter() {
      const filterGroup = new THREE.Group();
      filterGroup.name = 'InternalBubbleFilter';

      const baseX = 3.12;
      const baseZ = -1.42;
      const groundY = getSubstrateHeight(baseX, baseZ) - 0.04;

      const darkPlasticMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0x16191d,
          roughness: 0.42,
          metalness: 0.18
        }),
        0.18
      );

      const spongeBump = createPorousSpongeBumpTexture();
      const spongeMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0x1e2226,
          roughness: 0.94,
          metalness: 0.04,
          bumpMap: spongeBump,
          bumpScale: 0.032
        }),
        0.14
      );

      // Weighted dark base resting on the substrate
      const basePedestal = new THREE.Mesh(
        new THREE.CylinderGeometry(0.36, 0.41, 0.14, 24),
        darkPlasticMat
      );
      basePedestal.position.set(baseX, groundY + 0.07, baseZ);
      basePedestal.castShadow = true;
      basePedestal.receiveShadow = true;
      filterGroup.add(basePedestal);

      // Ribbed sponge cartridge with vertical flutes and horizontal grooves
      const spongeRadius = 0.33;
      const spongeHeight = 0.88;
      const spongeGeo = new THREE.CylinderGeometry(spongeRadius, spongeRadius, spongeHeight, 48, 36);
      const sPos = spongeGeo.attributes.position;
      for (let i = 0; i < sPos.count; i++) {
        const vx = sPos.getX(i);
        const vy = sPos.getY(i);
        const vz = sPos.getZ(i);
        const r = Math.hypot(vx, vz);
        if (r > 0.05) {
          const angle = Math.atan2(vz, vx);
          const verticalFlute = Math.cos(angle * 16.0) * 0.022;
          const horizGroove = Math.sin((vy / spongeHeight) * Math.PI * 10.0) * 0.012;
          const poreNoise = (hash2D(angle * 12.0, vy * 24.0) - 0.5) * 0.012;
          const scale = (r + verticalFlute + horizGroove + poreNoise) / r;
          sPos.setX(i, vx * scale);
          sPos.setZ(i, vz * scale);
        }
      }
      spongeGeo.computeVertexNormals();

      const spongeMesh = new THREE.Mesh(spongeGeo, spongeMat);
      spongeMesh.position.set(baseX, groundY + 0.14 + spongeHeight * 0.5, baseZ);
      spongeMesh.castShadow = true;
      spongeMesh.receiveShadow = true;
      filterGroup.add(spongeMesh);

      // Strainer cap on top of the sponge
      const topCap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.24, 0.32, 0.09, 24),
        darkPlasticMat
      );
      topCap.position.set(baseX, groundY + 0.14 + spongeHeight + 0.04, baseZ);
      topCap.castShadow = true;
      filterGroup.add(topCap);

      // Vertical dark smoky airlift riser tube
      const riserMat = new THREE.MeshPhysicalMaterial({
        color: 0x1b2329,
        roughness: 0.18,
        metalness: 0.05,
        transparent: true,
        opacity: 0.82
      });
      const riserHeight = 0.56;
      const riserY = groundY + 0.14 + spongeHeight + 0.08 + riserHeight * 0.5;
      const riserTube = new THREE.Mesh(
        new THREE.CylinderGeometry(0.085, 0.09, riserHeight, 20),
        riserMat
      );
      riserTube.position.set(baseX, riserY, baseZ);
      riserTube.castShadow = true;
      filterGroup.add(riserTube);

      // Curved directional outlet nozzle at top of riser tube
      const nozzleCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(baseX, riserY + riserHeight * 0.45, baseZ),
        new THREE.Vector3(baseX, riserY + riserHeight * 0.62, baseZ + 0.03),
        new THREE.Vector3(baseX - 0.02, riserY + riserHeight * 0.69, baseZ + 0.10)
      ]);
      const nozzleGeo = new THREE.TubeGeometry(nozzleCurve, 12, 0.082, 16, false);
      const nozzleMesh = new THREE.Mesh(nozzleGeo, darkPlasticMat);
      nozzleMesh.castShadow = true;
      filterGroup.add(nozzleMesh);

      // Dark collar ring around nozzle mouth
      const mouthPos = nozzleCurve.getPoint(1.0);
      const collarRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.082, 0.015, 10, 20),
        darkPlasticMat
      );
      collarRing.position.copy(mouthPos);
      collarRing.rotation.x = Math.PI * 0.25;
      filterGroup.add(collarRing);

      // Sync global FILTER_OUTLET_POS to the actual nozzle opening
      FILTER_OUTLET_POS.copy(mouthPos).add(new THREE.Vector3(0, 0.03, 0.02));

      // Two black suction cups & mounting clips against the rear glass (innerMinZ = -1.915)
      const suctionCupHeights = [groundY + 0.62, groundY + 1.28];
      suctionCupHeights.forEach((cy) => {
        const cup = new THREE.Mesh(
          new THREE.ConeGeometry(0.12, 0.08, 18, 1, true),
          darkPlasticMat
        );
        cup.rotation.x = -Math.PI * 0.5;
        cup.position.set(baseX, cy, TANK.innerMinZ + 0.045);
        filterGroup.add(cup);

        const strutLen = Math.abs(baseZ - (TANK.innerMinZ + 0.05));
        const strut = new THREE.Mesh(
          new THREE.CylinderGeometry(0.028, 0.028, strutLen, 10),
          darkPlasticMat
        );
        strut.rotation.x = Math.PI * 0.5;
        strut.position.set(baseX, cy, (baseZ + TANK.innerMinZ + 0.05) * 0.5);
        filterGroup.add(strut);
      });

      // Thin semi-translucent airline hose routed discreetly up & over the rear rim
      const airlineCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(baseX + 0.09, groundY + 1.08, baseZ - 0.04),
        new THREE.Vector3(baseX + 0.22, 2.2, -1.78),
        new THREE.Vector3(baseX + 0.26, 3.8, -1.84),
        new THREE.Vector3(baseX + 0.25, 4.92, -1.86),
        new THREE.Vector3(baseX + 0.25, 5.09, -1.98),
        new THREE.Vector3(baseX + 0.25, 4.88, -2.12),
        new THREE.Vector3(baseX + 0.27, 2.20, -2.14)
      ]);
      const airlineGeo = new THREE.TubeGeometry(airlineCurve, 44, 0.021, 10, false);
      const airlineMat = new THREE.MeshPhysicalMaterial({
        color: 0x99b8c4,
        roughness: 0.28,
        metalness: 0.0,
        transparent: true,
        opacity: 0.56
      });
      const airlineMesh = new THREE.Mesh(airlineGeo, airlineMat);
      filterGroup.add(airlineMesh);

      scene.add(filterGroup);
      return filterGroup;
    }

    const bubbleFilter = createBubbleFilter();

    // Pooled Bubble Plume System (Stage 3)
    function createBubblePlumeSystem() {
      const bubbleCount = 56;
      const sphereGeo = new THREE.SphereGeometry(1.0, 16, 14);

      // Clear refractive bubble shader with curved specular highlights and thin rim (never opaque white balls)
      const bubbleMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }
        },
        transparent: true,
        depthWrite: false,
        vertexShader: `
          uniform float uTime;
          varying vec3 vWorldNormal;
          varying vec3 vViewDir;
          varying float vPhase;

          void main() {
            vPhase = float(gl_InstanceID) * 1.37;
            // Subtle oblate wobble as bubble rises
            vec3 pos = position;
            float wobble = sin(uTime * 11.0 + vPhase) * 0.08;
            pos.y *= (0.88 - wobble * 0.4);
            pos.x *= (1.06 + wobble * 0.5);
            pos.z *= (1.06 - wobble * 0.5);

            vec4 worldPos = modelMatrix * instanceMatrix * vec4(pos, 1.0);
            mat3 nMat = mat3(modelMatrix * instanceMatrix);
            vWorldNormal = normalize(nMat * normal);
            vViewDir = normalize(cameraPosition - worldPos.xyz);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          varying vec3 vWorldNormal;
          varying vec3 vViewDir;

          void main() {
            vec3 N = normalize(vWorldNormal);
            vec3 V = normalize(vViewDir);
            float ndotv = clamp(dot(N, V), 0.0, 1.0);

            // Clear center, bright curved Fresnel rim
            float rim = pow(1.0 - ndotv, 2.4);

            // Primary curved highlight from top aquarium light
            vec3 L1 = normalize(vec3(0.28, 0.92, 0.35));
            vec3 H1 = normalize(L1 + V);
            float spec1 = pow(max(dot(N, H1), 0.0), 72.0);

            // Secondary lower-left internal reflection arc
            vec3 L2 = normalize(vec3(-0.55, -0.65, 0.45));
            vec3 H2 = normalize(L2 + V);
            float spec2 = pow(max(dot(N, H2), 0.0), 28.0) * 0.45;

            vec3 col = mix(vec3(0.62, 0.89, 0.98), vec3(0.96, 0.99, 1.0), rim * 0.7 + spec1);
            col += vec3(1.0) * (spec1 * 1.35 + spec2);

            float alpha = clamp(0.07 + rim * 0.62 + spec1 * 0.90 + spec2 * 0.45, 0.0, 0.92);
            gl_FragColor = vec4(col, alpha);
          }
        `
      });

      const instancedBubbles = new THREE.InstancedMesh(sphereGeo, bubbleMat, bubbleCount);
      instancedBubbles.name = 'BubblePlume';
      instancedBubbles.renderOrder = 18;
      scene.add(instancedBubbles);

      const rng = createSeededRandom(808);
      const dummy = new THREE.Object3D();
      const currentVec = new THREE.Vector3();

      const bubbles = [];
      for (let i = 0; i < bubbleCount; i++) {
        bubbles.push({
          active: false,
          x: FILTER_OUTLET_POS.x,
          y: FILTER_OUTLET_POS.y,
          z: FILTER_OUTLET_POS.z,
          vx: 0,
          vz: 0,
          baseRadius: 0.02,
          riseSpeed: 1.0,
          wobbleFreq: 5.0,
          wobbleAmp: 0.02,
          phase: rng() * Math.PI * 2
        });
      }

      function activateBubble(b, startProgress = 0) {
        b.active = true;
        // Mostly small bubbles with occasional slightly larger ones
        const isLarge = rng() < 0.16;
        b.baseRadius = isLarge ? (0.030 + rng() * 0.013) : (0.014 + rng() * 0.012);
        b.riseSpeed = (0.82 + rng() * 0.42) * (isLarge ? 1.18 : 0.96);
        b.wobbleFreq = 4.5 + rng() * 4.2;
        b.wobbleAmp = 0.012 + rng() * 0.018;
        b.phase = rng() * Math.PI * 2;

        // Narrow source right at filter outlet
        b.x = FILTER_OUTLET_POS.x + (rng() - 0.5) * 0.045;
        b.y = FILTER_OUTLET_POS.y + startProgress * (TANK.waterLevel - FILTER_OUTLET_POS.y);
        b.z = FILTER_OUTLET_POS.z + (rng() - 0.5) * 0.045;

        // Gently widening upper region drift
        b.vx = (rng() - 0.52) * 0.09;
        b.vz = (rng() - 0.48) * 0.09;
      }

      // Pre-populate the column so bubbles are rising immediately on open
      for (let i = 0; i < bubbleCount; i++) {
        activateBubble(bubbles[i], i / bubbleCount);
      }

      let spawnAccumulator = 0;

      function update(time, dt) {
        bubbleMat.uniforms.uTime.value = time;

        // Emit ~16-18 bubbles/sec with slight irregular cadence
        const rate = 16.5 + Math.sin(time * 3.1) * 3.5;
        spawnAccumulator += dt * rate;

        for (let i = 0; i < bubbleCount; i++) {
          const b = bubbles[i];
          if (!b.active) {
            if (spawnAccumulator >= 1.0) {
              spawnAccumulator -= 1.0;
              activateBubble(b, 0);
            } else {
              dummy.position.set(0, -10, 0);
              dummy.scale.setScalar(0.0001);
              dummy.updateMatrix();
              instancedBubbles.setMatrixAt(i, dummy.matrix);
              continue;
            }
          }

          // Height fraction in plume (0 at nozzle, 1 at surface)
          const hFrac = THREE.MathUtils.clamp(
            (b.y - FILTER_OUTLET_POS.y) / (TANK.waterLevel - FILTER_OUTLET_POS.y),
            0,
            1
          );

          // Sample shared current
          sampleWaterCurrent(b.x, b.y, b.z, time, currentVec);

          // Spiral wobble widens slightly as bubble rises
          const spreadFactor = 0.35 + hFrac * 0.95;
          const wobbleX = Math.cos(time * b.wobbleFreq + b.phase) * b.wobbleAmp * spreadFactor;
          const wobbleZ = Math.sin(time * b.wobbleFreq + b.phase) * b.wobbleAmp * spreadFactor;

          b.y += (b.riseSpeed + currentVec.y * 0.35) * dt;
          b.x += (b.vx * spreadFactor + currentVec.x * 0.25) * dt + wobbleX * dt * 8.0;
          b.z += (b.vz * spreadFactor + currentVec.z * 0.25) * dt + wobbleZ * dt * 8.0;

          // Keep strictly inside inner glass walls
          b.x = THREE.MathUtils.clamp(b.x, TANK.innerMinX + 0.08, TANK.innerMaxX - 0.08);
          b.z = THREE.MathUtils.clamp(b.z, TANK.innerMinZ + 0.08, TANK.innerMaxZ - 0.08);

          // Subtle hydrostatic expansion on the way up (never shrinks)
          const radius = b.baseRadius * (1.0 + hFrac * 0.14);

          // Check arrival at the animated water surface
          const surfY = evaluateWaterSurfaceHeight(b.x, b.z, time);
          if (b.y + radius >= surfY) {
            spawnSurfaceRipple(b.x, b.z, time, THREE.MathUtils.clamp(radius * 36.0, 0.55, 1.35));
            if (spawnAccumulator >= 0.25) {
              spawnAccumulator = Math.max(0, spawnAccumulator - 1.0);
              activateBubble(b, 0);
            } else {
              b.active = false;
              dummy.position.set(0, -10, 0);
              dummy.scale.setScalar(0.0001);
              dummy.updateMatrix();
              instancedBubbles.setMatrixAt(i, dummy.matrix);
              continue;
            }
          }

          dummy.position.set(b.x, b.y, b.z);
          dummy.scale.setScalar(radius);
          dummy.updateMatrix();
          instancedBubbles.setMatrixAt(i, dummy.matrix);
        }

        instancedBubbles.instanceMatrix.needsUpdate = true;
      }

      return { instancedBubbles, update };
    }

    const bubblePlumeSystem = createBubblePlumeSystem();

    // =========================================================================
    // STAGE 4 — CREATE THE PEBBLE BED
    // =========================================================================
    const accentStoneObstacles = [];

    // Coarse spatial grid of pebble domes so walking feet can stand on top of stones instead of sinking into them
    const PEBBLE_GRID_CELL = 0.3;
    const pebbleSurfaceGrid = new Map();

    function registerPebbleSurface(x, z, topY, rx, rz) {
      const dome = { x, z, topY, rx, rz, height: topY - getSubstrateHeight(x, z) };
      const r = Math.max(rx, rz);
      const ix0 = Math.floor((x - r) / PEBBLE_GRID_CELL);
      const ix1 = Math.floor((x + r) / PEBBLE_GRID_CELL);
      const iz0 = Math.floor((z - r) / PEBBLE_GRID_CELL);
      const iz1 = Math.floor((z + r) / PEBBLE_GRID_CELL);
      for (let ix = ix0; ix <= ix1; ix++) {
        for (let iz = iz0; iz <= iz1; iz++) {
          const key = ix * 1000 + iz;
          let cell = pebbleSurfaceGrid.get(key);
          if (!cell) {
            cell = [];
            pebbleSurfaceGrid.set(key, cell);
          }
          cell.push(dome);
        }
      }
    }

    // Top of the walkable bed: smooth substrate or the highest pebble dome covering (x, z)
    function getPebbleBedSurfaceHeight(x, z) {
      let h = getSubstrateHeight(x, z);
      const cell = pebbleSurfaceGrid.get(Math.floor(x / PEBBLE_GRID_CELL) * 1000 + Math.floor(z / PEBBLE_GRID_CELL));
      if (!cell) return h;
      for (let i = 0; i < cell.length; i++) {
        const p = cell[i];
        const dx = (x - p.x) / p.rx;
        const dz = (z - p.z) / p.rz;
        const d2 = dx * dx + dz * dz;
        if (d2 < 1.0) {
          const domeY = p.topY - p.height * (1.0 - Math.sqrt(1.0 - d2));
          if (domeY > h) h = domeY;
        }
      }
      return h;
    }

    function createPebbleBed() {
      const pebbleGroup = new THREE.Group();
      pebbleGroup.name = 'PebbleBed';

      const innerW = TANK.innerMaxX - TANK.innerMinX;
      const innerD = TANK.innerMaxZ - TANK.innerMinZ;

      // 1. Continuous sculpted shallow substrate bed so no bare plane is ever visible
      const subGeo = new THREE.BoxGeometry(innerW - 0.01, 0.45, innerD - 0.01, 80, 1, 40);
      const subPos = subGeo.attributes.position;
      const subColors = new Float32Array(subPos.count * 3);
      for (let i = 0; i < subPos.count; i++) {
        const vx = subPos.getX(i);
        const vy = subPos.getY(i);
        const vz = subPos.getZ(i);
        if (vy > 0) {
          const bump = (hash2D(vx * 18.0, vz * 18.0) - 0.5) * 0.025;
          const h = getSubstrateHeight(vx, vz) - 0.018 + bump;
          subPos.setY(i, h);
        } else {
          subPos.setY(i, TANK.bottomY + 0.005);
        }
        const n = fbm2D(vx * 4.5 + 5.2, vz * 4.5 - 2.1, 3);
        const grain = hash2D(Math.floor(vx * 14.0), Math.floor(vz * 14.0));
        const c = new THREE.Color().setHSL(
          0.075 + (n - 0.5) * 0.04,
          0.24,
          0.09 + n * 0.07 + (grain - 0.5) * 0.03
        );
        subColors[i * 3] = c.r;
        subColors[i * 3 + 1] = c.g;
        subColors[i * 3 + 2] = c.b;
      }
      subGeo.setAttribute('color', new THREE.BufferAttribute(subColors, 3));
      subGeo.computeVertexNormals();

      const subMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.95,
          metalness: 0.02
        }),
        0.32,
        `
        // Fine gravel micro-pebble relief shading on the substrate bed
        vec2 gCell = floor(vUwWorldPos.xz * 28.0);
        vec2 gFract = fract(vUwWorldPos.xz * 28.0) - 0.5;
        float gHash = fract(sin(dot(gCell, vec2(127.1, 311.7))) * 43758.5453);
        float pebbleDome = clamp(1.0 - dot(gFract, gFract) * 3.2, 0.25, 1.0);
        gl_FragColor.rgb *= (0.65 + 0.35 * pebbleDome) * (0.78 + 0.34 * gHash);
        `
      );
      const substrateMesh = new THREE.Mesh(subGeo, subMat);
      substrateMesh.receiveShadow = true;
      pebbleGroup.add(substrateMesh);

      // 2. Generate 5 distinct irregular rounded stone geometries and instance ~600 pebbles
      function buildIrregularPebbleGeometry(variantSeed, detail = 2) {
        const rng = createSeededRandom(variantSeed);
        const geo = new THREE.IcosahedronGeometry(1.0, detail);
        const pos = geo.attributes.position;
        const ax = (rng() - 0.5) * 2.5;
        const ay = (rng() - 0.5) * 2.5;
        const az = (rng() - 0.5) * 2.5;
        const stretchX = 0.88 + rng() * 0.34;
        const flattenY = 0.52 + rng() * 0.26;
        const stretchZ = 0.85 + rng() * 0.32;

        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let y = pos.getY(i);
          let z = pos.getZ(i);

          const n1 = Math.sin(x * 2.7 + ax) * Math.cos(y * 2.5 + ay) * Math.sin(z * 2.6 + az);
          const n2 = Math.cos(x * 4.8 - z * 4.2 + ay) * 0.06;
          const radial = 1.0 + n1 * 0.16 + n2;

          x *= radial * stretchX;
          y *= radial * flattenY;
          z *= radial * stretchZ;

          // Slightly flatter bottom so pebbles look settled
          if (y < 0) y *= 0.78;

          pos.setXYZ(i, x, y, z);
        }
        geo.computeVertexNormals();
        return geo;
      }

      const stoneMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.84,
          metalness: 0.04
        }),
        0.36,
        `
        // Procedural stone mineral grain & bottom contact darkening
        float grain = fract(sin(dot(floor(vUwWorldPos.xz * 85.0), vec2(12.9898, 78.233))) * 43758.5453);
        float mottle = sin(vUwWorldPos.x * 22.0 + vUwWorldPos.z * 19.0) * cos(vUwWorldPos.y * 34.0);
        gl_FragColor.rgb *= (0.92 + grain * 0.10 + mottle * 0.05);
        float pebbleContact = smoothstep(-0.65, 0.35, normalize(vUwWorldNormal).y);
        gl_FragColor.rgb *= (0.62 + 0.38 * pebbleContact);
        `
      );

      // Balanced natural stone palette: warm beige, slate gray, charcoal, muted brown, occasional pale stones
      const palette = [
        new THREE.Color(0xb8a389), // warm beige
        new THREE.Color(0x9e8c76), // sandy taupe
        new THREE.Color(0x69737a), // slate gray
        new THREE.Color(0x525960), // dark slate
        new THREE.Color(0x373c40), // charcoal
        new THREE.Color(0x7e6651), // muted brown
        new THREE.Color(0x665444), // umber brown
        new THREE.Color(0xd2c7b8)  // pale river stone
      ];

      const variantCount = 5;
      const instancesPerVariant = 136; // 5 * 136 = 680 instanced pebbles
      const rng = createSeededRandom(2026);
      const dummy = new THREE.Object3D();
      const surfNorm = new THREE.Vector3();
      const upVec = new THREE.Vector3(0, 1, 0);
      const alignQuat = new THREE.Quaternion();
      const spinQuat = new THREE.Quaternion();

      for (let v = 0; v < variantCount; v++) {
        const pGeo = buildIrregularPebbleGeometry(900 + v * 37, 2);
        pGeo.computeBoundingBox();
        const pBox = pGeo.boundingBox;
        const pHalfW = (Math.max(-pBox.min.x, pBox.max.x) + Math.max(-pBox.min.z, pBox.max.z)) * 0.5;
        const instMesh = new THREE.InstancedMesh(pGeo, stoneMat, instancesPerVariant);
        instMesh.castShadow = true;
        instMesh.receiveShadow = true;

        for (let i = 0; i < instancesPerVariant; i++) {
          // Stratified jittered grid across tank floor for uniform, dense coverage right up to the walls
          const gx = (i % 17) / 16.0;
          const gz = Math.floor(i / 17) / 7.0;
          const x = THREE.MathUtils.lerp(TANK.innerMinX + 0.08, TANK.innerMaxX - 0.08, gx) + (rng() - 0.5) * 0.44;
          const z = THREE.MathUtils.lerp(TANK.innerMinZ + 0.08, TANK.innerMaxZ - 0.08, gz) + (rng() - 0.5) * 0.44;
          const clampedX = THREE.MathUtils.clamp(x, TANK.innerMinX + 0.06, TANK.innerMaxX - 0.06);
          const clampedZ = THREE.MathUtils.clamp(z, TANK.innerMinZ + 0.06, TANK.innerMaxZ - 0.06);

          const baseScale = 0.078 + Math.pow(rng(), 1.50) * 0.095;
          const sx = baseScale * (0.88 + rng() * 0.44);
          const sy = baseScale * (0.55 + rng() * 0.36);
          const sz = baseScale * (0.88 + rng() * 0.44);

          const groundY = getSubstrateHeight(clampedX, clampedZ);
          dummy.position.set(clampedX, groundY + sy * 0.25, clampedZ);

          getSubstrateNormal(clampedX, clampedZ, surfNorm);
          alignQuat.setFromUnitVectors(upVec, surfNorm);
          spinQuat.setFromEuler(new THREE.Euler((rng() - 0.5) * 0.35, rng() * Math.PI * 2, (rng() - 0.5) * 0.35));
          dummy.quaternion.copy(alignQuat).multiply(spinQuat);
          dummy.scale.set(sx, sy, sz);
          dummy.updateMatrix();
          instMesh.setMatrixAt(i, dummy.matrix);
          registerPebbleSurface(clampedX, clampedZ, dummy.position.y + pBox.max.y * sy, pHalfW * sx, pHalfW * sz);

          const baseCol = palette[Math.floor(rng() * palette.length)].clone();
          baseCol.offsetHSL((rng() - 0.5) * 0.03, (rng() - 0.5) * 0.06, (rng() - 0.5) * 0.07);
          instMesh.setColorAt(i, baseCol);
        }

        instMesh.instanceMatrix.needsUpdate = true;
        if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
        pebbleGroup.add(instMesh);
      }

      // 3. Larger compositional accent stones (placed so they frame plants/castle without blocking crab/snail routes)
      const accentSpecs = [
        { x: -1.65, z: -0.58, sx: 0.32, sy: 0.21, sz: 0.26, col: 0x5c666d, rot: 0.4 },
        { x: -1.35, z: -0.78, sx: 0.22, sy: 0.15, sz: 0.19, col: 0x8d7b68, rot: 1.2 },
        { x: 0.85,  z: -0.62, sx: 0.30, sy: 0.19, sz: 0.25, col: 0x677077, rot: 2.1 },
        { x: 1.15,  z: -0.45, sx: 0.21, sy: 0.14, sz: 0.18, col: 0xa9967e, rot: 0.8 },
        { x: -2.65, z: 0.32,  sx: 0.26, sy: 0.17, sz: 0.22, col: 0x4b5258, rot: 1.7 },
        { x: 2.65,  z: 0.18,  sx: 0.28, sy: 0.18, sz: 0.24, col: 0x746252, rot: 2.6 },
        { x: -3.35, z: -0.72, sx: 0.25, sy: 0.16, sz: 0.21, col: 0x626b72, rot: 0.5 },
        { x: 2.48,  z: -1.22, sx: 0.26, sy: 0.17, sz: 0.22, col: 0x877766, rot: 1.9 },
        // One low smooth stepping stone along Snail A's foreground route for gentle climbing
        { x: -1.45, z: 1.18,  sx: 0.22, sy: 0.065, sz: 0.19, col: 0xb5a189, rot: 0.3, climbable: true }
      ];

      accentSpecs.forEach((spec, idx) => {
        const aGeo = buildIrregularPebbleGeometry(3000 + idx * 53, 3);
        const aMat = stoneMat.clone();
        aMat.color = new THREE.Color(spec.col);
        applyUnderwaterCaustics(aMat, 0.38);

        const mesh = new THREE.Mesh(aGeo, aMat);
        const gy = getSubstrateHeight(spec.x, spec.z);
        mesh.position.set(spec.x, gy + spec.sy * 0.36, spec.z);
        mesh.rotation.set(0.08, spec.rot, -0.05);
        mesh.scale.set(spec.sx, spec.sy, spec.sz);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        pebbleGroup.add(mesh);

        aGeo.computeBoundingBox();
        const aHalfW = (aGeo.boundingBox.max.x + aGeo.boundingBox.max.z) * 0.5;
        registerPebbleSurface(spec.x, spec.z, mesh.position.y + aGeo.boundingBox.max.y * spec.sy, aHalfW * spec.sx, aHalfW * spec.sz);

        accentStoneObstacles.push({
          x: spec.x,
          y: gy + spec.sy * 0.4,
          z: spec.z,
          radius: Math.max(spec.sx, spec.sz) * 0.95,
          height: spec.sy,
          climbable: !!spec.climbable
        });
      });

      scene.add(pebbleGroup);
      return pebbleGroup;
    }

    const pebbleBed = createPebbleBed();

    // Exact substrate + climbable low foreground stone height for Snail A
    function getBottomWalkHeight(x, z, allowLowStoneClimb = false) {
      let h = getSubstrateHeight(x, z);
      if (allowLowStoneClimb) {
        for (let i = 0; i < accentStoneObstacles.length; i++) {
          const st = accentStoneObstacles[i];
          if (st.climbable) {
            const d = Math.hypot(x - st.x, z - st.z);
            if (d < st.radius * 1.2) {
              const dome = Math.max(0, 1.0 - (d / (st.radius * 1.1)) ** 2);
              h += dome * st.height * 0.72;
            }
          }
        }
      }
      return h;
    }

    // =========================================================================
    // STAGE 5 — BUILD THE MINIATURE CASTLE AS ITS OWN DETAILED ASSET
    // =========================================================================
    const CASTLE_POS = new THREE.Vector3(-0.35, 0, -0.58);
    const castleCollisionVolumes = [];

    function createCastleOrnament() {
      const castleGroup = new THREE.Group();
      castleGroup.name = 'MiniatureCastle';

      const baseY = getSubstrateHeight(CASTLE_POS.x, CASTLE_POS.z) - 0.05;
      castleGroup.position.set(CASTLE_POS.x, baseY, CASTLE_POS.z);

      // Muted gray-beige ceramic/stone material with procedural stone courses, cracks & greenish base staining
      const castleStoneMat = applyUnderwaterCaustics(
        new THREE.MeshStandardMaterial({
          // Weathered sandstone base; the shader below multiplies in courses, mortar and algae (a white base washed it out)
          color: 0x9a8b76,
          roughness: 0.88,
          metalness: 0.04
        }),
        0.42,
        `
        // Stone courses, mortar grooves, weathering cracks, and algae staining near the base
        vec3 wp = vUwWorldPos;
        float courseY = wp.y * 8.5;
        float row = floor(courseY);
        float mortarH = smoothstep(0.08, 0.17, fract(courseY)) * (1.0 - smoothstep(0.83, 0.92, fract(courseY)));
        float brickX = (wp.x * 1.15 + wp.z * 0.95) * 4.8 + mod(row, 2.0) * 0.5 + sin(wp.y * 10.0) * 0.04;
        float mortarV = smoothstep(0.06, 0.14, fract(brickX)) * (1.0 - smoothstep(0.86, 0.94, fract(brickX)));
        float mortar = mortarH * mortarV;

        float blockHash = fract(sin(row * 31.7 + floor(brickX) * 73.1) * 43758.5453);
        vec3 stoneCol = mix(vec3(0.42, 0.40, 0.36), vec3(0.64, 0.59, 0.52), blockHash);
        // Dark recessed mortar lines
        stoneCol = mix(vec3(0.18, 0.17, 0.15), stoneCol, 0.25 + 0.75 * mortar);

        // Subtle crack lines & pitting
        float crack = smoothstep(0.955, 0.992, sin(wp.x * 19.0 + sin(wp.y * 27.0) * 1.8) * cos(wp.y * 14.0 - wp.z * 16.0));
        stoneCol *= (1.0 - crack * 0.52);

        // Restrained greenish algae staining near base and lower mortar crevices
        float heightAboveBase = max(0.0, wp.y - ${baseY.toFixed(3)});
        float algaeMask = clamp(exp(-heightAboveBase * 1.65) * 0.85 + (1.0 - mortar) * exp(-heightAboveBase * 0.85) * 0.45, 0.0, 0.88);
        vec3 algaeCol = vec3(0.19, 0.36, 0.18);
        vec3 finalTint = mix(stoneCol, algaeCol, algaeMask * 0.72);
        gl_FragColor.rgb *= finalTint;
        `
      );

      const darkInteriorMat = new THREE.MeshStandardMaterial({
        color: 0x222526,
        roughness: 0.95,
        metalness: 0.02
      });

      // Helper to displace vertices slightly for worn, chipped masonry edges
      function weatherGeometry(geo, amp = 0.014, seed = 10) {
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const y = pos.getY(i);
          const z = pos.getZ(i);
          const n = (hash2D(x * 13.7 + seed, y * 17.3 + z * 11.1) - 0.5) * 2.0;
          const courseBulge = Math.sin(y * 9.5 * Math.PI * 2.0) * 0.005;
          pos.setXYZ(i, x + n * amp + courseBulge, y + n * amp * 0.4, z + n * amp + courseBulge);
        }
        geo.computeVertexNormals();
        return geo;
      }

      // Helper to build a cylindrical stone tower with corbel ring, crenellations & recessed slit windows
      function buildTower(radiusBottom, radiusTop, height, merlonCount, x, z, hasRoof = false, seed = 1) {
        const tg = new THREE.Group();
        tg.position.set(x, 0, z);

        // Main tower shaft
        const shaftGeo = weatherGeometry(
          new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 28, 18),
          0.012,
          seed
        );
        const shaft = new THREE.Mesh(shaftGeo, castleStoneMat);
        shaft.position.y = height * 0.5;
        shaft.castShadow = true;
        shaft.receiveShadow = true;
        tg.add(shaft);

        // Stone corbel cornice ring near top
        const corniceGeo = weatherGeometry(
          new THREE.CylinderGeometry(radiusTop + 0.045, radiusTop + 0.015, 0.09, 28, 2),
          0.008,
          seed + 5
        );
        const cornice = new THREE.Mesh(corniceGeo, castleStoneMat);
        cornice.position.y = height - 0.03;
        cornice.castShadow = true;
        cornice.receiveShadow = true;
        tg.add(cornice);

        // Crenellations (merlons around the parapet)
        const merlonRadius = radiusTop + 0.02;
        for (let m = 0; m < merlonCount; m++) {
          // Leave one chipped/worn lower merlon for character
          const isChipped = (m === 2 && seed === 10) || (m === 5 && seed === 20);
          const mh = isChipped ? 0.075 : 0.135;
          const angle = (m / merlonCount) * Math.PI * 2;
          const merlonGeo = weatherGeometry(new THREE.BoxGeometry(0.11, mh, 0.085, 2, 2, 2), 0.007, seed + m);
          const merlon = new THREE.Mesh(merlonGeo, castleStoneMat);
          merlon.position.set(
            Math.cos(angle) * merlonRadius,
            height + mh * 0.5,
            Math.sin(angle) * merlonRadius
          );
          merlon.rotation.y = -angle + Math.PI * 0.5;
          merlon.castShadow = true;
          merlon.receiveShadow = true;
          tg.add(merlon);
        }

        // Optional weathered conical turret cap
        if (hasRoof) {
          // three r169 ConeGeometry drops every other side triangle when heightSegments > 1 (roof looked see-through),
          // so build the cone as a cylinder with a near-zero top radius
          const roofGeo = weatherGeometry(new THREE.CylinderGeometry(0.0005, radiusTop + 0.055, 0.36, 24, 4), 0.01, seed + 99);
          const roof = new THREE.Mesh(roofGeo, castleStoneMat);
          roof.position.y = height + 0.22;
          roof.castShadow = true;
          roof.receiveShadow = true;
          tg.add(roof);
        }

        // Recessed arched slit windows (frame + dark recessed alcoves)
        const winAngles = [0.25, 1.85, -1.35];
        winAngles.forEach((wa, idx) => {
          const wy = height * (0.46 + (idx % 2) * 0.22);
          const wr = THREE.MathUtils.lerp(radiusBottom, radiusTop, wy / height);
          const recessGroup = new THREE.Group();
          recessGroup.position.set(Math.cos(wa) * (wr - 0.01), wy, Math.sin(wa) * (wr - 0.01));
          recessGroup.rotation.y = -wa + Math.PI * 0.5;

          const stoneArchFrame = new THREE.Mesh(
            weatherGeometry(new THREE.BoxGeometry(0.12, 0.22, 0.05), 0.005, seed + idx * 7),
            castleStoneMat
          );
          recessGroup.add(stoneArchFrame);

          const darkSlit = new THREE.Mesh(
            new THREE.BoxGeometry(0.058, 0.16, 0.065),
            darkInteriorMat
          );
          darkSlit.position.z = 0.005;
          recessGroup.add(darkSlit);

          tg.add(recessGroup);
        });

        return tg;
      }

      // 1. Three distinct towers with different heights
      // Left tall watchtower
      const leftTower = buildTower(0.41, 0.35, 1.82, 8, -0.78, -0.05, false, 10);
      castleGroup.add(leftTower);

      // Right medium bastion tower
      const rightTower = buildTower(0.37, 0.32, 1.46, 7, 0.78, -0.05, false, 20);
      castleGroup.add(rightTower);

      // Rear-left keep turret with weathered conical roof
      const rearTurret = buildTower(0.31, 0.27, 1.98, 6, -0.32, -0.44, true, 30);
      castleGroup.add(rearTurret);

      // 2. Central Gatehouse with a REAL 3D arched doorway and visible interior passage
      // Extrude front & rear walls with a true semi-circular arched cutout so there is an actual opening through the castle
      const gateW = 1.06;
      const gateH = 1.24;
      const archHalfW = 0.25;
      const archStraightH = 0.44;

      const wallShape = new THREE.Shape();
      wallShape.moveTo(-gateW * 0.5, 0);
      wallShape.lineTo(-archHalfW, 0);
      wallShape.lineTo(-archHalfW, archStraightH);
      wallShape.absarc(0, archStraightH, archHalfW, Math.PI, 0, true);
      wallShape.lineTo(archHalfW, 0);
      wallShape.lineTo(gateW * 0.5, 0);
      wallShape.lineTo(gateW * 0.5, gateH);
      wallShape.lineTo(-gateW * 0.5, gateH);
      wallShape.closePath();

      const gateDepth = 0.64;
      const gateExtrudeGeo = new THREE.ExtrudeGeometry(wallShape, {
        depth: gateDepth,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 4,
        bevelSize: 0.015,
        bevelThickness: 0.015
      });
      gateExtrudeGeo.translate(0, 0, -gateDepth * 0.5);
      weatherGeometry(gateExtrudeGeo, 0.009, 45);

      const gatehouseMesh = new THREE.Mesh(gateExtrudeGeo, castleStoneMat);
      gatehouseMesh.position.set(0, 0, 0.02);
      gatehouseMesh.castShadow = true;
      gatehouseMesh.receiveShadow = true;
      castleGroup.add(gatehouseMesh);

      // Carved stone voussoirs (arch ring stones) on both front and back of the doorway
      const voussoirCount = 9;
      [-gateDepth * 0.5 + 0.01, gateDepth * 0.5 - 0.01].forEach((zSide, sideIdx) => {
        for (let v = 0; v < voussoirCount; v++) {
          const t = v / (voussoirCount - 1);
          const ang = Math.PI * (1.0 - t);
          const r = archHalfW + 0.04;
          const isKeystone = v === 4;
          const vGeo = weatherGeometry(
            new THREE.BoxGeometry(isKeystone ? 0.095 : 0.075, isKeystone ? 0.13 : 0.095, 0.08),
            0.004,
            60 + v + sideIdx * 10
          );
          const vMesh = new THREE.Mesh(vGeo, castleStoneMat);
          vMesh.position.set(
            Math.cos(ang) * r,
            archStraightH + Math.sin(ang) * r,
            zSide + 0.02
          );
          vMesh.rotation.z = ang - Math.PI * 0.5;
          vMesh.castShadow = true;
          vMesh.receiveShadow = true;
          castleGroup.add(vMesh);
        }

        // Stone jamb pillars flanking the arch opening
        [-archHalfW - 0.04, archHalfW + 0.04].forEach((jx, jIdx) => {
          const jamb = new THREE.Mesh(
            weatherGeometry(new THREE.BoxGeometry(0.085, archStraightH, 0.075), 0.005, 80 + jIdx),
            castleStoneMat
          );
          jamb.position.set(jx, archStraightH * 0.5, zSide + 0.02);
          jamb.castShadow = true;
          jamb.receiveShadow = true;
          castleGroup.add(jamb);
        });
      });

      // Recessed circular rose/oculus window above the front gatehouse arch
      const oculusFrame = new THREE.Mesh(
        new THREE.TorusGeometry(0.11, 0.028, 10, 20),
        castleStoneMat
      );
      oculusFrame.position.set(0, 0.96, gateDepth * 0.5 + 0.02);
      castleGroup.add(oculusFrame);

      const oculusRecess = new THREE.Mesh(
        new THREE.CylinderGeometry(0.095, 0.095, 0.06, 18),
        darkInteriorMat
      );
      oculusRecess.rotation.x = Math.PI * 0.5;
      oculusRecess.position.set(0, 0.96, gateDepth * 0.5 - 0.01);
      castleGroup.add(oculusRecess);

      // Gatehouse battlements along the front & rear top wall
      for (let i = -3; i <= 3; i++) {
        const mh = (i === 1) ? 0.075 : 0.125; // One worn merlon
        const frontMerlon = new THREE.Mesh(
          weatherGeometry(new THREE.BoxGeometry(0.11, mh, 0.09), 0.006, 90 + i),
          castleStoneMat
        );
        frontMerlon.position.set(i * 0.16, gateH + mh * 0.5, gateDepth * 0.5 - 0.03);
        frontMerlon.castShadow = true;
        frontMerlon.receiveShadow = true;
        castleGroup.add(frontMerlon);

        const backMerlon = new THREE.Mesh(
